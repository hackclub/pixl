<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixl · Collectibles</title>
    <!-- <pixl-preview> -->
    <meta name="description" content="Spend Restoration Energy on collectibles for your village.">
    <link rel="canonical" href="https://pixl.hackclub.com/collectibles/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Pixl">
    <meta property="og:title" content="Pixl · Collectibles">
    <meta property="og:description" content="Spend Restoration Energy on collectibles for your village.">
    <meta property="og:url" content="https://pixl.hackclub.com/collectibles/">
    <meta property="og:image" content="https://pixl.hackclub.com/collectibles/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Pixl · Collectibles">
    <meta name="twitter:description" content="Spend Restoration Energy on collectibles for your village.">
    <meta name="twitter:image" content="https://pixl.hackclub.com/collectibles/og.png">
    <!-- <pixl-preview:end> -->
    <link rel="icon" href="/index.icon.png" />
    <link rel="stylesheet" href="/pixl.css?v=4" />
    <style>
      .bal { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px;
        font-family: var(--pixel); font-size: 15px; color: var(--gold);
        background: var(--panel); border: var(--bw) solid var(--stroke); border-radius: 0; padding: 7px 15px; }
      .bal .up { font-size: 13px; }
      .col-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; margin-top: 24px; }
      .col-card { display: flex; flex-direction: column; gap: 10px; padding: 16px; }
      .col-thumb { aspect-ratio: 1 / 1; border-radius: 0; background: var(--panel-2);
        border: var(--bw) solid var(--stroke); display: grid; place-items: center; overflow: hidden; }
      .col-thumb img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
      .col-thumb .ph { font-family: var(--pixel); font-size: 12px; color: var(--faint); }
      .col-name { font-family: var(--pixel); font-size: 15px; color: var(--ink); letter-spacing: .3px; }
      .col-desc { font-size: 13.5px; color: var(--dim); line-height: 1.5; flex: 1; }
      .col-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
      .col-cost { font-family: var(--pixel); font-size: 13px; color: var(--gold); display: inline-flex; align-items: center; gap: 4px; }
      .col-card .btn { padding: 7px 14px; font-size: 13px; }
      .owned-tag { font-family: var(--pixel); font-size: 12px; color: var(--teal, #6cc); letter-spacing: .5px; }
      .col-progress { flex: 1; min-width: 60px; }
      .col-progress-bar { height: 6px; border-radius: 0; background: var(--panel-2); border: 1px solid var(--stroke); overflow: hidden; }
      .col-progress-bar > div { height: 100%; background: var(--gold); }
      .col-progress-label { font-size: 11px; color: var(--faint); margin-top: 3px; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1 class="page-title">COLLECTIBLES</h1>
      <div class="page-sub">
        Earn cosmetics for your Builder as your projects get upvoted. The moment you reach a collectible's
        upvote count it's yours to keep, even if a vote gets taken back later.
      </div>
      <div class="bal" id="bal" hidden>▲ <span class="up" id="bal-n">0</span> UPVOTES RECEIVED</div>

      <div class="spin" id="loading"></div>
      <div class="col-grid" id="grid"></div>
      <div class="empty-note" id="empty" hidden>NO COLLECTIBLES IN THE STORE YET. CHECK BACK SOON.</div>
    </main>

    <script src="/pixl.js?v=6"></script>
    <script>
      Pixl.mountTopbar("collectibles");
      Pixl.loadWallet();
      const $ = (id) => document.getElementById(id);
      let balance = 0;

      function card(c) {
        const pct = c.owned ? 100 : Math.max(0, Math.min(100, (balance / Math.max(c.cost, 1)) * 100));
        const foot = c.owned
          ? `<span class="owned-tag">OWNED</span>`
          : `<div class="col-progress">
               <div class="col-progress-bar"><div style="width:${pct}%"></div></div>
               <div class="col-progress-label">${balance} / ${c.cost} upvotes</div>
             </div>`;
        return `
          <div class="col-card card panel" id="c-${Pixl.esc(c.id)}">
            <div class="col-thumb">${c.image_url ? `<img src="${Pixl.esc(c.image_url)}" alt="" onerror="this.parentNode.innerHTML='<span class=ph>NO IMAGE</span>'">` : `<span class="ph">NO IMAGE</span>`}</div>
            <div class="col-name">${Pixl.esc(c.name)}</div>
            <div class="col-desc">${Pixl.esc(c.description || "")}</div>
            <div class="col-foot">
              <span class="col-cost">▲ ${c.cost}</span>
              ${foot}
            </div>
          </div>`;
      }

      let items = [];
      function render() {
        $("bal-n").textContent = balance;
        $("bal").hidden = false;
        $("grid").innerHTML = items.map(card).join("");
        $("empty").hidden = items.length !== 0;
      }

      async function boot() {
        if (!Pixl.hasToken) return;
        let data;
        try { data = await Pixl.api("/api/collectibles"); }
        catch (e) { $("loading").remove(); if (e.message !== "unauthorized") Pixl.toast("Couldn't load the store.", true); return; }
        $("loading").remove();
        balance = data.balance || 0;
        items = data.collectibles || [];
        render();
      }
      boot();
    </script>
  </body>
</html>
