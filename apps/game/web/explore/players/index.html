<link rel="icon" href="/index.icon.png">
<link rel="stylesheet" href="/pixl.css?v=4">
<link rel="stylesheet" href="/explore.css?v=1">
</head>
<body>
<main class="wrap">
  <section class="hero hud deep">
    <h1 class="page-title">PLAYERS</h1>
    <div class="page-sub">EVERY HACK CLUBBER BUILDING ON PIXL.</div>
  </section>

  <div class="tabs" id="tabs">
    <a class="tab active" href="/explore/players/">PLAYERS</a>
    <a class="tab" href="/explore/projects/">PROJECTS</a>
    <a class="tab" href="/explore/leaderboard/">LEADERBOARD</a>
  </div>

  <div id="view"></div>
</main>

<script src="/pixl.js?v=6"></script>
<script src="/explore.js?v=1"></script>
<script>
// This page answers two URLs. /explore/players is the directory. /players/<id>
// is one profile, served from this same HTML by web/api/player-meta.ts with
// that player's preview meta patched in, and it's the one view in this family
// that works signed out, so a link pasted outside Pixl opens the profile
// rather than the sign-in rail.
const PLAYER_ID = location.pathname.match(/^\/players\/([0-9a-f-]{36})\/?$/i)?.[1] ?? null;
const GUEST_PROFILE = !!PLAYER_ID && !Pixl.hasToken;

Pixl.mountTopbar("explore", PLAYER_ID ? { guestNoShell: true } : undefined);
Pixl.loadWallet();

if (GUEST_PROFILE) {
  // Everything else here needs a session, so a guest gets the profile and a
  // way in, nothing else.
  document.getElementById("tabs").remove();
  document.querySelector(".hero .page-title").textContent = "A PIXL BUILDER";
  document.querySelector(".hero .page-sub").innerHTML =
    `THEY BUILD AND SHIP ON PIXL. <a href="/">START YOUR OWN</a>.`;
}

if (PLAYER_ID) Explore.player(PLAYER_ID);
else Explore.players();
</script>
</body>
</html>
