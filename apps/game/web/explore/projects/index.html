<body>
<main class="wrap">
  <section class="hero hud deep">
    <h1 class="page-title">PROJECTS</h1>
    <div class="page-sub">EVERY BUILD SHIPPED ON PIXL.</div>
  </section>

  <div class="tabs" id="tabs">
    <a class="tab" href="/explore/players/">PLAYERS</a>
    <a class="tab active" href="/explore/projects/">PROJECTS</a>
    <a class="tab" href="/explore/leaderboard/">LEADERBOARD</a>
  </div>

  <div id="view"></div>
</main>

<script src="/pixl.js?v=6"></script>
<script src="/explore.js?v=1"></script>
<script>
// These were one tabbed page switching on location.hash. Links shared or
// bookmarked back then land here, since /explore forwards to this board and
// keeps the hash, so they get sent on to the right page rather than silently
// showing the wrong board.
const [key, val] = location.hash.replace(/^#/, "").split("=");
if (key === "player" && val) location.replace("/players/" + encodeURIComponent(val));
else if (key === "project" && val) location.replace("/project/" + encodeURIComponent(val));
else if (key === "leaderboard" && val && val !== "pixels") location.replace("/explore/leaderboard/" + encodeURIComponent(val));
else if (key === "players") location.replace("/explore/players/");
else if (key === "leaderboard") location.replace("/explore/leaderboard/");
else {
  Pixl.mountTopbar("explore");
  Pixl.loadWallet();
  Explore.projects();
}
</script>
</body>
