<main class="wrap">

  <div class="tabs" id="tabs">
    <a class="tab" href="/players/">PLAYERS</a>

  </div>

  <div id="view"></div>
</main>

<script src="/pixl.js?v=6"></script>
<script src="/explore.js?v=1"></script>
<script>
// This page was one tabbed view switching on location.hash before the tabs
// became real pages. Links shared or bookmarked back then still arrive here,
// so they get forwarded rather than silently landing on the wrong board.
const LEGACY = {
  players: "/players/",
  projects: "/explore/",
  leaderboard: "/leaderboard/",
};
const [key, val] = location.hash.replace(/^#/, "").split("=");
if (key === "player" && val) location.replace("/players/" + encodeURIComponent(val));
else if (key === "project" && val) location.replace("/project/" + encodeURIComponent(val));
else if (key === "leaderboard" && val && val !== "pixels") location.replace("/leaderboard/" + encodeURIComponent(val));
else if (key === "players") location.replace(LEGACY.players);
else if (key === "leaderboard") location.replace(LEGACY.leaderboard);
else {
  Pixl.mountTopbar("explore");
  Pixl.loadWallet();
  Explore.projects();
}
</script>
