<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="twitter:title" content="Pixl · Projects">
    <meta name="twitter:description" content="Every project you've shipped, its hours, tier and payout.">
    <meta name="twitter:image" content="https://pixl.hackclub.com/projects/og.png">
    <!-- <pixl-preview:end> -->
    <link rel="icon" href="/index.icon.png" />
    <link rel="stylesheet" href="/pixl.css?v=2" />
    <style>
      .hero {
        padding: 24px 28px;
        margin-top: 8px;
        display: flex;
        align-items: flex-end;
        gap: 20px;
        flex-wrap: wrap;
      }
      .hero-actions {
        margin-left: auto;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .ht-bar {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        margin: 20px 0;
        padding: 15px 20px 13px;
        font-size: 15px;
      }
      .ht-dot {
        width: 12px;
        height: 12px;
        border: var(--bw) solid var(--stroke);
        border-radius: 0;
      }
      .ht-dot.on {
        background: var(--good);
      }
      .ht-dot.off {
        background: var(--bad);
      }
      .ht-bars {
        margin: 6px 0 20px;
        display: none;
        flex-direction: column;
        gap: 10px;
        width: 100%;
      }
      .ht-bars.show {
        display: flex;
      }
      .ht-row {
        padding: 13px 18px 12px;
      }
      .ht-row .top {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 8px;
        font-size: 16px;
      }
      .bar {
        height: 14px;
        border: var(--bw) solid var(--stroke);
        border-radius: 0;
        background: var(--panel-deep);
        overflow: hidden;
      }
      .bar > div {
        height: 100%;
        background: repeating-linear-gradient(
          90deg,
          var(--gold) 0 10px,
          var(--gold-soft) 10px 20px
        );
      }
      .section-h {
        font-size: 20px;
        color: var(--gold);
        margin: 26px 0 16px;
        letter-spacing: 1px;
      }
      .invite-box {
        border: var(--bw) solid var(--stroke);
        border-radius: 0;
        background: var(--panel);
        padding: 16px 20px;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
      }
      .invite-box-head {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 200px;
      }
      .invite-box-title {
        font-family: var(--pixel, var(--sans));
        font-size: 14px;
        letter-spacing: 0.5px;
        color: var(--gold);
      }
      .invite-box-sub {
        font-family: var(--sans);
        font-size: 13px;
        color: var(--faint);
      }
      .invite-box-row {
        display: flex;
        gap: 10px;
        margin-left: auto;
        flex-wrap: wrap;
      }
      .invite-box-row .field {
        max-width: 180px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      @media (max-width: 560px) {
        .invite-box {
          flex-direction: column;
          align-items: stretch;
        }
        .invite-box-row {
          margin-left: 0;
        }
        .invite-box-row .field {
          max-width: none;
          flex: 1;
        }
      }
      .ysws-modal {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .ysws-modal-veil {
        position: absolute;
        inset: 0;
        background: rgba(10, 10, 14, 0.66);
        backdrop-filter: blur(2px);
      }
      .ysws-modal-box {
        position: relative;
        width: 100%;
        max-width: 540px;
        max-height: 86vh;
        overflow-y: auto;
        background: var(--panel);
        color: var(--ink);
        border: 2px solid var(--stroke);
        border-radius: 0;
        padding: 22px;
        box-shadow: var(--drop-lg);
        animation: ysws-pop 0.16s ease;
      }
      @keyframes ysws-pop {
        from {
          transform: scale(0.96);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      .ysws-modal-title {
        font-family: var(--pixel, var(--sans));
        font-size: 17px;
        color: var(--gold);
        letter-spacing: 0.5px;
        margin-bottom: 10px;
      }
      .ysws-modal-body {
        font-size: 14px;
        line-height: 1.55;
        color: var(--dim);
      }
      .ysws-modal-acts {
        display: flex;
        justify-content: flex-end;
        margin-top: 18px;
      }
      .ysws-pick-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 16px;
        max-height: 44vh;
        overflow-y: auto;
      }
      .ysws-pick {
        display: flex;
        flex-direction: column;
        gap: 3px;
        width: 100%;
        text-align: left;
        padding: 11px 13px;
        border: var(--bw) solid var(--stroke);
        border-radius: 0;
        background: none;
        cursor: pointer;
        transition:
          border-color 0.12s ease,
          background 0.12s ease;
      }
      .ysws-pick:hover:not(:disabled) {
        border-color: var(--gold);
        background: rgba(255, 255, 255, 0.03);
      }
      .ysws-pick:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .ysws-pick-name {
        font-family: var(--pixel, var(--sans));
        font-size: 13px;
        color: var(--ink);
        letter-spacing: 0.5px;
      }
      .ysws-pick-meta {
        font-size: 12px;
        color: var(--gold);
      }
      .ysws-pick-desc {
        font-size: 12px;
        line-height: 1.45;
        color: var(--faint);
      }
      .proj-thumb {
        height: 140px;
        border: var(--bw) solid var(--stroke);
        border-radius: 0;
        background:
          repeating-conic-gradient(
              rgba(22, 22, 30, 0.05) 0% 25%,
              transparent 0% 50%
            )
            0 0 / 22px 22px,
          var(--panel-deep);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        overflow: hidden;
      }
      .proj-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .proj-name {
        font-size: 19px;
        color: var(--ink);
      }
      .proj-meta {
        font-size: 14.5px;
        color: var(--faint);
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
      }
      /* full-width project rows */
      .proj-rows {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .proj-row {
        display: flex;
        gap: 20px;
        align-items: stretch;
        padding: 16px 18px;
        width: 100%;
      }
      .proj-row-thumb {
        width: 280px;
        flex-shrink: 0;
        align-self: stretch;
        min-height: 120px;
        border: var(--bw) solid var(--stroke);
        border-radius: 0;
        background:
          repeating-conic-gradient(
              rgba(22, 22, 30, 0.05) 0% 25%,
              transparent 0% 50%
            )
            0 0 / 22px 22px,
          var(--panel-deep);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 44px;
        overflow: hidden;
      }
      .proj-row-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* the banner is the card's anchor, so an absent one says so rather than
         leaving a dead rectangle */
      .thumb-none {
        font-family: var(--pixel);
        font-size: 13px;
        letter-spacing: 1.5px;
        color: var(--muted);
      }
      .proj-row-body {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .proj-row-head {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .proj-row-head .proj-name {
        font-size: 22px;
      }
      .proj-row-arrow {
        align-self: center;
        color: var(--faint);
        font-size: 30px;
        flex-shrink: 0;
      }
      .proj-row:hover .proj-row-arrow {
        color: var(--gold);
      }
      .proj-row .note-strip {
        margin-top: 2px;
      }
      @media (max-width: 560px) {
        .proj-row {
          flex-direction: column;
          gap: 12px;
        }
        .proj-row-thumb {
          width: 100%;
          height: 160px;
        }
        .proj-row-arrow {
          display: none;
        }
      }
      /* status legend, sits opposite the page title */
      /* capped so the four states wrap into a 2x2 block beside the button
         rather than one long row that pushes it off the hero */
      .legend {
        display: flex;
        gap: 7px 20px;
        flex-wrap: wrap;
        align-items: center;
        max-width: 330px;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: var(--pixel);
        font-size: 13px;
        letter-spacing: 0.5px;
        color: var(--dim);
      }
      .legend-dot {
        width: 11px;
        height: 11px;
        border: var(--bw) solid var(--stroke);
        border-radius: 0;
        flex-shrink: 0;
      }
      .legend-dot.status-approved {
        background: var(--good);
      }
      .legend-dot.status-shipped {
        background: var(--gold);
      }
      .legend-dot.status-needs {
        background: var(--bad);
      }
      .legend-dot.muted {
        background: var(--muted);
      }
      .legend-n {
        color: var(--ink);
      }


      /* links along the bottom of a project card */
      .proj-links {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        font-size: 13.5px;
      }
      .proj-links a {
        font-family: var(--pixel);
        font-size: 14px;
        letter-spacing: 1px;
        color: var(--teal);
        text-decoration: none;
      }
      .proj-links a:hover {
        color: var(--teal-hover);
        text-decoration: underline;
      }
      .proj-links .ht {
        color: var(--faint);
        font-family: var(--sans);
      }

      .list-actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        margin: 24px 0 8px;
      }

      /* action log + news, side by side under the list */
      .panel-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 16px;
        margin-top: 26px;
      }
      .feed {
        padding: 18px 20px 20px;
      }
      .feed-h {
        font-family: var(--pixel);
        font-size: 19px;
        letter-spacing: 1px;
        color: var(--gold);
        margin-bottom: 16px;
      }
      .log-row {
        display: flex;
        gap: 12px;
        padding-bottom: 16px;
        position: relative;
      }
      /* the thread joining one entry to the next, stopping at the last */
      .log-row:not(:last-child)::before {
        content: "";
        position: absolute;
        left: 5px;
        top: 14px;
        bottom: 0;
        width: 1px;
        background: var(--stroke);
      }
      .log-dot {
        width: 11px;
        height: 11px;
        margin-top: 3px;
        border-radius: 0;
        flex-shrink: 0;
        background: var(--muted);
        position: relative;
        z-index: 1;
      }
      .log-dot.created,
      .log-dot.trial {
        background: var(--teal);
      }
      .log-dot.shipped,
      .log-dot.journal {
        background: var(--gold);
      }
      .log-dot.approved,
      .log-dot.earned {
        background: var(--good);
      }
      .log-dot.rejected {
        background: var(--bad);
      }
      .log-txt {
        font-size: 14.5px;
        color: var(--ink);
        line-height: 1.4;
      }
      .log-when {
        font-size: 12.5px;
        color: var(--faint);
        margin-top: 3px;
      }
      .news-row {
        display: flex;
        gap: 14px;
        margin-bottom: 14px;
        font-size: 14.5px;
        line-height: 1.5;
      }
      .news-date {
        font-family: var(--pixel);
        font-size: 13px;
        letter-spacing: 0.5px;
        color: var(--gold);
        flex-shrink: 0;
        width: 52px;
        padding-top: 1px;
      }
      .news-body {
        color: var(--dim);
      }
      .news-body a {
        color: var(--teal);
      }

      .note-strip {
        font-family: var(--sans);
        font-size: 13.5px;
        line-height: 1.6;
        padding: 10px 12px;
        border: var(--bw) solid var(--stroke);
        border-radius: 0;
        background: color-mix(in srgb, var(--bad) 12%, var(--panel));
        color: var(--bad);
      }
      .note-strip.teal {
        background: color-mix(in srgb, var(--teal) 12%, var(--panel));
        color: var(--teal);
      }
      .trial-brief {
        border: 1px solid color-mix(in srgb, var(--gold) 45%, var(--stroke));
        border-radius: 0;
        background: color-mix(in srgb, var(--gold) 9%, var(--panel));
        padding: 14px 16px;
        margin-bottom: 16px;
      }
      .trial-brief-h {
        font-family: var(--pixel, var(--sans));
        color: var(--gold);
        font-size: 15px;
        letter-spacing: 0.02em;
        margin-bottom: 8px;
      }
      .trial-brief-desc {
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.6;
        margin: 0 0 8px;
      }
      .trial-brief-hours {
        font-family: var(--sans);
        font-size: 13.5px;
        color: var(--dim);
        margin-bottom: 8px;
      }
      .trial-brief-spec {
        font-family: var(--sans);
        font-size: 13.5px;
        line-height: 1.6;
        border-left: 8px solid var(--gold);
        padding-left: 10px;
        margin: 0 0 10px;
      }
      .trial-brief-spec-h {
        font-family: var(--pixel, var(--sans));
        font-size: 11px;
        letter-spacing: 0.08em;
        color: var(--ink);
        margin-bottom: 4px;
      }
      .trial-brief-spec p {
        margin: 0;
      }
      .trial-brief-reward {
        font-family: var(--sans);
        font-size: 13.5px;
        color: var(--teal);
        margin-bottom: 8px;
      }
      .trial-brief-note {
        font-family: var(--sans);
        font-size: 12.5px;
        line-height: 1.5;
        opacity: 0.75;
      }
      /* the one-or-the-other reward claim, shown once a Trial ship is approved */
      .trial-claim {
        border: 1px solid color-mix(in srgb, var(--gold) 60%, var(--stroke));
        border-radius: 0;
        background: color-mix(in srgb, var(--gold) 12%, var(--panel));
        padding: 16px 18px;
        margin-bottom: 16px;
      }
      .trial-claim-h {
        font-family: var(--pixel, var(--sans));
        color: var(--gold);
        font-size: 17px;
        letter-spacing: 0.02em;
        margin-bottom: 6px;
      }
      .trial-claim p {
        font-family: var(--sans);
        font-size: 13.5px;
        line-height: 1.6;
        margin: 0 0 12px;
      }
      .trial-claim-opts {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .trial-claim-taken {
        font-family: var(--sans);
        font-size: 13.5px;
        color: var(--teal);
      }
      .tl-list {
        display: flex;
        flex-direction: column;
        margin-top: 6px;
      }
      .tl-item {
        position: relative;
        padding: 0 0 16px 26px;
      }
      .tl-item::before {
        content: "";
        position: absolute;
        left: 8px;
        top: 6px;
        bottom: -2px;
        width: 2px;
        background: var(--stroke);
      }
      .tl-item:last-child::before {
        display: none;
      }
      .tl-dot {
        position: absolute;
        left: 3px;
        top: 5px;
        width: 12px;
        height: 12px;
        border-radius: 0;
        background: var(--faint);
        box-shadow: 0 0 0 3px var(--panel);
      }
      .tl-dot.ok {
        background: var(--good);
      }
      .tl-dot.rev {
        background: var(--teal);
      }
      .tl-dot.warn {
        background: var(--gold);
      }
      .tl-dot.bad {
        background: var(--bad);
      }
      .tl-head {
        display: flex;
        gap: 10px;
        align-items: baseline;
        flex-wrap: wrap;
      }
      .tl-title {
        font-family: var(--sans);
        font-weight: 700;
        font-size: 14.5px;
        color: var(--ink);
      }
      .tl-time {
        font-family: var(--sans);
        font-size: 12px;
        color: var(--faint);
      }
      .tl-hours {
        font-family: var(--sans);
        font-size: 13px;
        color: var(--teal);
        margin-top: 2px;
      }
      .tl-cut {
        color: var(--bad);
      }
      .tl-note {
        font-family: var(--sans);
        font-size: 13.5px;
        line-height: 1.6;
        margin-top: 6px;
        padding: 8px 11px;
        border: var(--bw) solid var(--stroke);
        border-radius: 0;
        background: var(--panel-deep);
        color: var(--ink);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .editor {
        width: 100%;
      }
      .back-btn {
        margin-bottom: 18px;
      }
      .form-grid {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 24px;
      }
      .form-row {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .form-row label {
        font-size: 13px;
        color: var(--faint);
        letter-spacing: 0.5px;
      }
      .open-link {
        font-size: 12px;
        color: var(--teal);
        margin-left: 6px;
        letter-spacing: 0;
      }
      .open-link:hover {
        color: var(--gold);
      }
      .form-row input.field,
      .form-row textarea.field {
        font-size: 15.5px;
      }
      .form-row textarea.field {
        resize: vertical;
        min-height: 80px;
        line-height: 1.6;
      }
      #j-content,
      .jedit-content {
        min-height: 150px;
        resize: none;
        overflow: hidden;
        line-height: 1.6;
      }
      .jeditor {
        border-color: var(--gold);
      }
      .jeditor .jedit-content {
        width: 100%;
        margin-bottom: 10px;
      }
      .two-col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      @media (max-width: 640px) {
        .two-col {
          grid-template-columns: 1fr;
        }
      }
      /* Full-width, uncropped hero preview at the top of a single project's
         page - the small object-fit:cover box used to hide most of the image.
         object-fit:contain here so the whole thing is always visible,
         letterboxed on the checkerboard rather than cropped to fill. */
      .proj-hero {
        width: 100%;
        max-height: 420px;
        min-height: 90px;
        border: var(--bw) solid var(--stroke);
        border-radius: 0;
        margin-bottom: 16px;
        background:
          repeating-conic-gradient(
              rgba(22, 22, 30, 0.05) 0% 25%,
              transparent 0% 50%
            )
            0 0 / 22px 22px,
          var(--panel-deep);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .proj-hero img {
        width: 100%;
        height: 100%;
        max-height: 420px;
        object-fit: contain;
      }
      .ht-pick {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 220px;
        overflow-y: auto;
        border: var(--bw) solid var(--stroke);
        border-radius: 0;
        background: var(--panel-deep);
        padding: 10px;
      }
      .ht-pick label {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 15px;
        color: var(--ink);
        letter-spacing: 0;
        padding: 3px 0;
      }
      .ht-pick input {
        accent-color: var(--gold);
        width: 17px;
        height: 17px;
      }
      .ht-pick .h {
        margin-left: auto;
        color: var(--teal);
        font-size: 14px;
      }
      .check-row {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 15.5px;
        color: var(--ink);
      }
      .check-row input {
        accent-color: var(--gold);
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }
      .disclosure {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 15px 17px;
        border: var(--bw) solid var(--stroke);
        border-radius: 0;
        background: var(--panel-deep);
      }
      .disclosure.update {
        background: color-mix(in srgb, var(--gold) 6%, var(--panel-deep));
        border-color: color-mix(in srgb, var(--gold) 35%, var(--stroke));
      }
      .disclosure-check {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 15.5px;
        font-weight: 600;
        color: var(--ink);
      }
      .disclosure.update > .disclosure-check:first-child {
        color: var(--gold);

  </head>
  <body>
    <main class="wrap">
      <section class="hero hud deep">
        <div>
          <h1 class="page-title">PROJECTS</h1>
          <div class="page-sub">
            BUILD · JOURNAL · SHIP · GET PAID IN PIXELS.
          </div>
        </div>
        <div class="hero-actions">
          <div class="legend" id="legend"></div>
          <a class="btn" href="#new" id="new-btn">+ NEW PROJECT</a>
        </div>
      </section>

      <div id="ht-slot"></div>
      <div id="invites-slot"></div>
      <div id="join-code-slot"></div>
      <div id="ysws-import-slot"></div>
      <div class="spin" id="loading"></div>
      <div id="view"></div>
    </main>

    <script src="/pixl.js?v=6"></script>
    <script>
      Pixl.mountTopbar("projects");
      Pixl.loadWallet();

      const $ = (id) => document.getElementById(id);
      // Rates come off config so they can't drift from what the server pays.
      const RE_RATES = Pixl.config.economy.tierRePerHour;
      const LEVELS = [
        ["T1 Spark", "A first spark of Restoration: a simple site, script, or tiny tool."],
        ["T2 Signal", "A focused app, CLI, or game with clean polish: one system back online."],
        ["T3 Grid", "Multiple systems working together: backend, state, infra."],
        ["T4 Nexus", "Deep systems work: complex architecture and serious scope."],
      ].map(([name, blurb], i) => [name, `${blurb} ${RE_RATES[i]} RE per hour.`]);
      const ERRORS = {
        name_required: "Give it a name first.",
        repo_not_github: "The repo link must be a GitHub repository.",
        ai_notes_required: "Describe how you used AI (at least 10 characters).",
        repo_required: "Add a GitHub repo link before shipping.",
        demo_required: "Add a demo / playable link before shipping.",
        image_required: "Upload a thumbnail before shipping.",
        repo_not_found: "That repo link doesn't load. Is it public?",
        demo_unreachable: "The demo link is unreachable.",
        demo_is_repo: "The demo can't be your GitHub repo. Use a playable build or a Releases page.",
        demo_invalid: "That demo link isn't a valid URL.",
        hackatime_hours_required:
          "Link Hackatime projects with at least 1 hour of coding first.",
        hackatime_unavailable:
          "Hackatime is unreachable right now, try again in a bit.",
        update_notes_required: "Describe what changed in this update.",
        update_notes_too_short: "Update notes need at least 100 characters.",
        other_ysws_notes_required: "Describe what you updated since your other YSWS submission.",
        other_ysws_notes_too_short: "That description needs at least 100 characters.",
        already_shipped: "This one is already in the review queue.",
        project_banned: "This project is banned and can't be shipped.",
        cdn_not_configured: "Image uploads aren't configured on the server.",
        cdn_failed: "Image upload failed, try again.",
        file_too_large: "That image is too big. Keep it under 15 MB.",
        unsupported_type: "That file type isn't supported , use PNG, JPG, or WebP.",
        empty_body: "That upload came through empty, try again.",
        journal_too_short:
          "Log more detail: journals need ~100 characters per hour.",
        journal_images_required:
          "Add at least one image to this entry, more for longer sessions.",
        not_in_review: "This project isn't in review.",
        trial_hours_below_minimum: "This Trial needs more tracked hours before you can ship it.",
        eligibility_attestation_required: "Confirm this isn't a school assignment or paid Hack Club work before shipping.",
        trial_not_accepted: "Accept that Trial in the game first (talk to its NPC), then you can pick it.",
        project_hours_required: "Log at least an hour - journal your work (Hackatime optional for hardware).",
        bom_required: "Upload a Bill of Materials (.csv) before shipping a funded project.",
        cart_screenshot_required: "Upload at least one cart screenshot (with shipping) before shipping a funded project.",
        funding_amount_required: "Enter how much funding you need before shipping.",
      };
      const err = (e) => ERRORS[e] || "Something went wrong, try again.";

      let stats = null;
      let projects = [];
      let trials = []; // Trials the player has accepted and not yet finished
      let allTrials = []; // every active Trial (accepted or not), for the picker
      let activity = []; // synthesized action log, newest first
      let news = []; // program news, newest first
      let activeTrial = null; // the Trial the player arrived to build for, if any
      let hasBirthday = true; // assume yes until we hear otherwise — avoids a flash of the banner
      let form = null;
      // The player's current $/hour ship rate (from /api/profile/wallet), used
      // only for the funding "~Xh to cover this" estimate below, falls back to
      // the base rate from config if the wallet fetch hasn't landed yet.
      let walletUsdPerHour = Pixl.config.economy ? Pixl.config.economy.basePayoutUsd : 3.5;

      function statusInfo(p) {
        if (p.banned_at) return ["BANNED", "status-needs"];
        if (p.rejected_at) return ["REJECTED", "status-needs"];
        if (p.status === "approved") return ["APPROVED", "status-approved"];
        if (p.status === "shipped" || p.status === "fraud_review" || p.status === "second_review")
          return ["IN REVIEW", "status-shipped"];
        if (p.status === "needs_changes")
          return ["NEEDS CHANGES", "status-needs"];
        return ["DRAFT", "muted"];
      }

      function linkedSeconds(p) {
        if (!stats || !stats.connected) return 0;
        const linked = new Set(p.hackatime_projects || []);
        // secondsSinceCutoff (when the server has computed it) so this matches
        // what actually counts toward shipping — same reasoning as
        // checkedHtTotals() below. Without this, a linked project with any
        // activity before HACKATIME_CUTOFF inflates the Trial progress bar and
        // per-project hour badge with time that will never actually ship.
        return stats.projects
          .filter((h) => linked.has(h.name))
          .reduce((s, h) => s + (h.secondsSinceCutoff ?? h.seconds), 0);
      }

      // Seconds from the Hackatime boxes currently ticked in the editor (which
      // may not be saved yet), so ship-readiness reflects what the player sees.
      // Uses secondsSinceCutoff when the server has computed it so this matches
      // what actually counts toward shipping (only time after the cutoff).
      // Same cutoff the server enforces (HACKATIME_CUTOFF in
      // apps/server/src/hackatime/api.ts) - both now read packages/config, so
      // this can no longer drift from it. Needed client-side so the UI can
      // explain *why* a linked project reads as 0h instead of just insisting
      // you link one.
      const HT_CUTOFF_MS = new Date(Pixl.config.hackatimeCutoff).getTime();
      const HT_CUTOFF_LABEL = new Intl.DateTimeFormat("en-US", {
        month: "short",
        day: "numeric",
        timeZone: "UTC",
      }).format(HT_CUTOFF_MS);

      function checkedHtBoxes() {
        return [...document.querySelectorAll('input[name="ht"]:checked')];
      }

      // `counted` is what the server will actually credit (time after the
      // cutoff); `total` is the projects' whole tracked time. They diverge
      // whenever someone's hours predate the cutoff — the usual reason a
      // player links projects and still can't ship.
      function checkedHtTotals() {
        if (!stats || !stats.connected) return { counted: 0, total: 0 };
        const checked = new Set(checkedHtBoxes().map((c) => c.value));
        const picked = stats.projects.filter((h) => checked.has(h.name));
        return {
          counted: picked.reduce(
            (s, h) => s + (h.secondsSinceCutoff ?? h.seconds),
            0,
          ),
          total: picked.reduce((s, h) => s + h.seconds, 0),
        };
      }

      function checkedHtSeconds() {
        return checkedHtTotals().counted;
      }

      // The blocker used to always read "link a Hackatime project with >= 1h",
      // which is baffling when you've linked ten of them — the hours are real,
      // they just fall before the cutoff (or the cutoff hasn't arrived yet).
      function htBlockerText() {
        const { counted, total } = checkedHtTotals();
        if (!stats || !stats.connected)
          return "connect Hackatime so your hours can count";
        if (total === 0) return "link a Hackatime project with ≥ 1h";
        // Only claim "all of it predates the cutoff" when none of it counts —
        // otherwise some time did land after the cutoff, just not enough yet.
        if (counted === 0)
          return Date.now() < HT_CUTOFF_MS
            ? `wait for ${HT_CUTOFF_LABEL}: only hours tracked from then on count, and your ${Pixl.hours(total)} is all logged before it`
            : `track time from ${HT_CUTOFF_LABEL} onward: your ${Pixl.hours(total)} was all logged before then`;
        return `≥ 1h tracked from ${HT_CUTOFF_LABEL} onward (you have ${Pixl.hours(counted)} of ${Pixl.hours(total)})`;
      }

      // Shared by the initial checklist render and the live refresh as boxes
      // are ticked, so the two can't drift apart.
      function shipHtLine() {
        const { counted, total } = checkedHtTotals();
        const ok = counted >= 3600;
        const detail =
          counted === total
            ? Pixl.hours(counted)
            : `${Pixl.hours(counted)} counts, ${Pixl.hours(total)} linked`;
        return `<span class="${ok ? "ok" : "no"}">${ok ? "+" : "-"}</span> ≥ 1h tracked from ${HT_CUTOFF_LABEL} onward <span class="teal">(${detail})</span>`;
      }

      // Sum of the currently-ticked Hackatime boxes, shown right next to the
      // picker so the player can see their proof-of-hours total without
      // scrolling down to the ship checklist.
      function updateHtTotal() {
        const el = $("f-ht-total");
        if (!el) return;
        if (!checkedHtBoxes().length) return void (el.textContent = "");
        const { counted, total } = checkedHtTotals();
        el.textContent =
          counted === total
            ? `${Pixl.hours(counted)} selected`
            : `${Pixl.hours(counted)} counts (of ${Pixl.hours(total)}, rest predates ${HT_CUTOFF_LABEL})`;
      }

      // Wires the Hackatime picker in whichever form it's rendered in (new
      // project or existing): keeps the running total next to the label in
      // sync and warns when a ticked project has time from before the
      // cutoff. `onChange` lets renderProject also refresh its ship checklist.
      function wireHtPicker(onChange) {
        updateHtTotal();
        document.querySelectorAll('input[name="ht"]').forEach((box) =>
          box.addEventListener("change", () => {
            if (box.checked && box.dataset.beforeCutoff === "1") {
              Pixl.toast(
                `"${box.value}" has coding time from before ${HT_CUTOFF_LABEL}: only time tracked after ${HT_CUTOFF_LABEL} will count toward shipping.`,
              );
            }
            updateHtTotal();
            if (onChange) onChange();
          }),
        );
      }

      /* ---------- hackatime strip ---------- */

      function renderHt() {
        const slot = $("ht-slot");
        if (!stats) {
          slot.innerHTML = "";
          return;
        }
        if (!stats.connected) {
          slot.innerHTML = `
      <div class="ht-bar panel">
        <span class="ht-dot off"></span>
        <span>HACKATIME NOT CONNECTED, hours can't be counted until you link it.${stats.error ? ` <span class="faint">(${Pixl.esc(stats.error)})</span>` : ""}</span>
        <a class="btn" style="margin-left:auto" href="${Pixl.apiUrl("/hackatime/connect")}" target="_blank" rel="noopener" id="ht-connect">🔌 CONNECT</a>
      </div>`;
          $("ht-connect").addEventListener("click", () => {
            Pixl.toast(
              "Finishing in the new tab, this page will refresh itself.",
            );
            const poll = setInterval(async () => {
              try {
                const d = await Pixl.api("/api/hackatime/stats");
                if (d.stats && d.stats.connected) {
                  clearInterval(poll);
                  location.reload();
                }
              } catch {}
            }, 3000);
            setTimeout(() => clearInterval(poll), 180000);
          });
          return;
        }
        const sorted = [...stats.projects].sort(
          (a, b) => b.seconds - a.seconds,
        );
        const top = sorted[0];
        slot.innerHTML = `
    <div class="ht-bar panel">
      <span class="ht-dot on"></span>
      <span>HACKATIME CONNECTED</span>
      <span class="teal">${Pixl.hours(stats.projects.reduce((s, h) => s + (h.secondsSinceCutoff ?? h.seconds), 0))} since ${HT_CUTOFF_LABEL}</span>
      <span class="faint">·</span>
      <span class="muted">${stats.projects.length} tracked</span>
      <button class="btn ghost" style="margin-left:auto" id="ht-toggle">TIME PER PROJECT ▾</button>
      <a class="btn ghost" href="${Pixl.apiUrl("/hackatime/connect")}" target="_blank" rel="noopener">RECONNECT</a>
    </div>
    <div class="ht-bars" id="ht-bars">
      ${sorted
        .map(
          (p) => `
        <div class="ht-row panel">
          <div class="top"><span>${Pixl.esc(p.name)}</span><span class="teal">${Pixl.hours(p.seconds)}</span></div>
          <div class="bar"><div style="width:${top && top.seconds ? (p.seconds / top.seconds) * 100 : 0}%"></div></div>
        </div>`,
        )
        .join("")}
    </div>`;
        $("ht-toggle").addEventListener("click", () =>
          $("ht-bars").classList.toggle("show"),
        );
      }

      /* ---------- list view ---------- */

      // The four states worth counting at a glance. Banned and rejected fold
      // into "needs changes" here, the same way statusInfo colors them.
      const LEGEND = [
        ["APPROVED", "status-approved", (p) => p.status === "approved" && !p.rejected_at],
        [
          "IN REVIEW",
          "status-shipped",
          (p) => p.status === "shipped" || p.status === "fraud_review" || p.status === "second_review",
        ],
        [
          "NEEDS CHANGES",
          "status-needs",
          (p) => p.status === "needs_changes" || !!p.rejected_at || !!p.banned_at,
        ],
        ["UNSHIPPED", "muted", (p) => !p.status || p.status === "draft"],
      ];

      function renderLegend() {
        const slot = $("legend");
        if (!slot) return;
        if (projects.length === 0) {
          slot.innerHTML = "";
          return;
        }
        slot.innerHTML = LEGEND.map(([label, cls, match]) => {
          const n = projects.filter(match).length;
          return `
        <span class="legend-item">
          <span class="legend-dot ${cls}"></span>${label}
          <span class="legend-n">${n}</span>
        </span>`;
        }).join("");
      }

      function projLinksHtml(p) {
        const ht = (p.hackatime_projects || []).join(", ");
        const secs = linkedSeconds(p);
        return `
        <div class="proj-links">
          ${p.repo_url ? `<a href="${Pixl.esc(p.repo_url)}" target="_blank" rel="noopener">CODE</a>` : ""}
          ${p.demo_url ? `<a href="${Pixl.esc(p.demo_url)}" target="_blank" rel="noopener">DEMO</a>` : ""}
          ${ht ? `<span class="ht">Hackatime: ${Pixl.esc(ht)}${secs ? ` · ${Pixl.hours(secs)}` : ""}</span>` : `<span class="ht">no hackatime linked</span>`}
          ${p.pixels_earned ? `<span class="earned">+${Math.round(p.pixels_earned)} px earned</span>` : ""}
        </div>`;
      }

      function renderList() {
        $("new-btn").style.display = "";
        const view = $("view");
        if (projects.length === 0) {
          view.innerHTML = `
      <div class="connect-card panel">
        <div style="font-size:48px;margin-bottom:12px"></div>
        <h2>NO PROJECTS YET</h2>
        <p>Log what you're building, link it to Hackatime, journal as you go, then ship it for review: approved hours pay out in pixels.</p>
        <a class="btn" href="#new">+ START YOUR FIRST PROJECT</a>
      </div>
      <div class="panel-grid" id="feeds"></div>`;
          renderFeeds();
          return;
        }
        view.innerHTML = `
    <div class="section-h">MY PROJECTS · ${projects.length}</div>
    <div class="proj-rows">
      ${projects
        .map((p) => {
          const [label, cls] = statusInfo(p);
          return `
        <div class="card panel proj-row" data-href="#p=${p.id}">
          <div class="proj-row-thumb">${p.image_url ? `<img src="${Pixl.esc(p.image_url)}" alt="" loading="lazy" onerror="this.remove()">` : `<span class="thumb-none">NO IMAGE</span>`}</div>
          <div class="proj-row-body">
            <div class="proj-row-head">
              <a class="proj-name" href="#p=${p.id}">${Pixl.esc(p.name)}</a>
              <span class="chip ${cls}">${label}</span>
              <span class="chip">${LEVELS[(p.level || 1) - 1][0]}</span>
              ${p.trial_reward_choice === "pending" ? `<span class="chip gold">TRIAL REWARD WAITING</span>` : ""}
            </div>
            ${p.description ? `<div class="proj-meta"><span>${Pixl.esc(p.description)}</span></div>` : ""}
            ${projLinksHtml(p)}
            ${p.status === "needs_changes" && p.review_note ? `<div class="note-strip">${Pixl.esc(p.review_note)}</div>` : ""}

      // Wires the custom Trial dropdown built by trialPickerHtml() — open/close

      // fresh on every renderProject(), so per-instance listeners go on the
      // (newly created) button/options each time, but the document-level
      // outside-click/Escape handlers are attached once and re-look-up the
      // live menu by id, so re-rendering never stacks duplicate listeners.
      let _trialPickerGlobalWired = false;
      function wireTrialPicker() {
        const btn = $("trial-picker-btn");
        const menu = $("trial-picker-menu");
        const hidden = $("s-trial");
        const label = $("trial-picker-label");
        if (!btn || !menu || !hidden) return;
        const setOpen = (open) => {
          menu.hidden = !open;
          btn.setAttribute("aria-expanded", String(open));
        };
        btn.onclick = (e) => {
          e.stopPropagation();
          setOpen(menu.hidden);
        };
        menu.querySelectorAll(".theme-opt").forEach((opt) => {
          opt.onclick = () => {
            hidden.value = opt.dataset.trialId;
            label.textContent = opt.textContent;
            menu.querySelectorAll(".theme-opt").forEach((o) => o.classList.toggle("active", o === opt));
            setOpen(false);
          };
        });
        if (_trialPickerGlobalWired) return;
        _trialPickerGlobalWired = true;
        document.addEventListener("click", (e) => {
          const wrap = $("trial-picker");
          const liveMenu = $("trial-picker-menu");
          if (wrap && liveMenu && !liveMenu.hidden && !wrap.contains(e.target)) {
            liveMenu.hidden = true;
            $("trial-picker-btn").setAttribute("aria-expanded", "false");
          }
        });
        document.addEventListener("keydown", (e) => {
          const liveMenu = $("trial-picker-menu");
          if (e.key === "Escape" && liveMenu && !liveMenu.hidden) {
            liveMenu.hidden = true;
            $("trial-picker-btn").setAttribute("aria-expanded", "false");
          }
        });
      }

      function wireCount(taId, countId, max) {
        const ta = $(taId),
          c = $(countId);
        if (!ta || !c) return;
        const upd = () => {
          const n = ta.value.trim().length;
          c.textContent = `${n} / ${max}`;
          c.classList.toggle("full", n >= max);
        };
        ta.addEventListener("input", upd);
        upd();

      // Tracked so saveProject can wait on it: setThumb is fired off from a
      // file input's change event (never awaited there), so clicking
      // Save/Create right after picking an image could otherwise read
      // form.imageUrl before the upload resolved and silently save without
      // the thumbnail, only for it to "vanish" on the next reload since it
      // was never actually attached to the project.
      let thumbUpload = null;

      async function setThumb(file) {
        Pixl.toast("Uploading image…");
        const upload = (async () => {
          form.imageUrl = await Pixl.upload(file);
          if ($("p-hero"))
            $("p-hero").innerHTML = `<img src="${Pixl.esc(form.imageUrl)}" alt="">`;
          Pixl.toast("Thumbnail set!");
        })()
          .catch((e) => {
            Pixl.toast(err(e.message), true);
          })
          .finally(() => {
            if (thumbUpload === upload) thumbUpload = null;
          });
        thumbUpload = upload;
        return upload;
      }

      // Same race-guard as thumbUpload, but a list since several screenshots
      // can be uploading (or the BOM + a screenshot) at once.
      let fundingUploads = [];

        return `~${hours.toFixed(1)}h shipped at your current rate ($${walletUsdPerHour.toFixed(2)}/hr) covers this. Rate rises as you earn more Restoration Energy, so this is an estimate.`;

      </div>`,
          )
          .join("");
        el.querySelectorAll(".cart-shot-x").forEach((btn) =>

            form.cartUrls.splice(Number(btn.dataset.idx), 1);

          $("f-bom-file").addEventListener("change", () => {

                form.bomUrl = url;

                  $("f-bom-status").innerHTML = `<a class="open-link" href="${Pixl.esc(url)}" target="_blank" rel="noopener">↗ current BOM</a>`;
                if ($("f-bom-btn")) $("f-bom-btn").textContent = "REPLACE BOM CSV";
                Pixl.toast("BOM uploaded!");
              })
              .catch((e) => Pixl.toast(err(e.message), true))
              .finally(() => {
                fundingUploads = fundingUploads.filter((t) => t !== task);
              });
            fundingUploads.push(task);
          });
        if ($("f-cart-btn")) $("f-cart-btn").addEventListener("click", () => $("f-cart-file").click());
        if ($("f-cart-file"))
          $("f-cart-file").addEventListener("change", () => {
            const file = $("f-cart-file").files[0];
            if (!file) return;
            Pixl.toast("Uploading screenshot…");

              .then((url) => {
                form.cartUrls.push(url);
                renderCartList();
                Pixl.toast("Screenshot added!");
              })
              .catch((e) => Pixl.toast(err(e.message), true))
              .finally(() => {
                fundingUploads = fundingUploads.filter((t) => t !== task);
                $("f-cart-file").value = "";
              });
            fundingUploads.push(task);
          });
      }

      async function saveProject(p, opts = {}) {
        const silent = !!opts.silent;
        clearTimeout(autosaveTimer);
        // Guards every early-return validation path below, not just the
        // network call — without this, mashing the save button while a
        // validation error is showing stacked a fresh toast per click.
        if ($("f-save") && $("f-save").disabled) return false;
        if ($("f-save")) $("f-save").disabled = true;
        if (thumbUpload) {
          if (!silent) Pixl.toast("Still uploading the thumbnail, hang on…");
          await thumbUpload;
        }
        if (fundingUploads.length) {
          if (!silent) Pixl.toast("Still uploading funding files, hang on…");
          await Promise.all(fundingUploads);
        }
        const reenable = () => { if ($("f-save")) $("f-save").disabled = false; };
        // Trial chosen at creation — a locked (not-accepted) pick can't be saved.
        let sidequestId = null;
        const trialSel = $("f-trial");
        if (trialSel) {
          const opt = trialSel.selectedOptions[0];
          if (opt && opt.dataset.locked) {
            Pixl.toast(
              "Go accept that Trial in the game first (talk to its NPC), then you can pick it.",
              true,
            );
            reenable();
            return false;
          }
          sidequestId = trialSel.value ? Number(trialSel.value) : null;
        }
        const body = {
          name: $("f-name").value.trim(),
          description: $("f-desc").value.trim(),
          repoUrl: $("f-repo").value.trim(),
          demoUrl: $("f-demo").value.trim(),
          imageUrl: form.imageUrl,
          usedAi: $("f-ai").checked,
          aiNotes: $("f-ai-notes").value.trim(),
          projectType: $("f-type") ? $("f-type").value : "other",
          level: $("f-level") ? Number($("f-level").value) : undefined,
          kind: $("f-kind") ? $("f-kind").value : "software",
          needsFunding: $("f-funding") ? $("f-funding").checked : false,
          fundingUsd: $("f-funding-usd") ? Number($("f-funding-usd").value) || 0 : 0,
          bomUrl: form.bomUrl || "",
          cartScreenshotUrls: form.cartUrls || [],
          sidequestId,
          hackatimeProjects: [
            ...document.querySelectorAll('input[name="ht"]:checked'),
          ].map((c) => c.value),
        };
        if (!body.name) {
          if (!silent) Pixl.toast(err("name_required"), true);
          reenable();
          return false;
        }
        const r = p.id
          ? await Pixl.send("PUT", `/api/projects/${p.id}`, body)
          : await Pixl.send("POST", "/api/projects", body);
        $("f-save").disabled = false;
        if (!r.ok) {
          Pixl.toast(silent ? "Autosave failed, click SAVE to retry." : err(r.error), true);
          return false;
        }
        if (silent) {
          // Keep the in-memory list current without the full list refetch or
          // hash rewrite a manual save does — this fires mid-edit, on a timer,
          // and shouldn't yank focus or reset scroll under the player.
          const idx = projects.findIndex((x) => x.id === p.id);
          if (idx !== -1) projects[idx] = { ...projects[idx], ...r.project, id: Number(r.project.id) };
          return true;
        }
        Pixl.toast(p.id ? "Saved!" : "Project created!");
        await loadProjects();
        skipDetailsCollapse = true;
        location.hash = "#p=" + r.project.id;
        return true;
      }

      // Autosave: 5s after the player stops touching a field, silently PUT
      // the form so a closed tab / crash doesn't lose edits. Only wired for
      // an existing project's editor (bindForm({}) on the "new project" form
      // has no p.id, so it's skipped there — draft creates shouldn't happen
      // just from typing). Deliberately not applied to the journal composer:
      // posting a journal entry is a real, deliberate action.
      let autosaveTimer = null;
      let skipDetailsCollapse = false;
      function wireAutosave(p) {
        if (!p.id) return;
        const fieldIds = [
          "f-name", "f-desc", "f-repo", "f-demo", "f-type",
          "f-level", "f-kind", "f-trial", "f-ai", "f-ai-notes",
        ];
        const fields = fieldIds.map((id) => $(id)).filter(Boolean);
        const htBoxes = [...document.querySelectorAll('input[name="ht"]')];
        const schedule = () => {
          clearTimeout(autosaveTimer);
          autosaveTimer = setTimeout(() => saveProject(p, { silent: true }), 5000);
        };
        [...fields, ...htBoxes].forEach((el) => {
          el.addEventListener("input", schedule);
          el.addEventListener("change", schedule);
        });
      }

      function journalNeed(hours) {
        return hours > 0 ? Math.max(100, Math.round(hours * 100)) : 0;
      }

      // Mirrors journalImagesNeeded/countJournalImages in
      // apps/server/src/routes/projects.ts , at least 1 image always, plus
      // one more per 4h on top of that.
      function journalImagesNeed(hours) {
        return Math.max(1, Math.ceil(hours / 4));
      }
      function countJournalImages(content) {
        return (content.match(/!\[[^\]]*\]\([^)]+\)/g) || []).length;
      }

      function updateJournalHint() {
        const hint = $("j-hint");
        if (!hint) return;
        const content = $("j-content").value.trim();
        const len = content.length;
        const hours = Number($("j-hours").value) || 0;
        const need = journalNeed(hours);
        const imagesNeed = journalImagesNeed(hours);
        const imagesHave = countJournalImages(content);
        const imagesOk = imagesHave >= imagesNeed;
        const imagesPart = `${imagesHave} / ${imagesNeed} image${imagesNeed === 1 ? "" : "s"}`;
        if (need === 0) {
          hint.textContent = len || content ? `${len} chars · ${imagesPart}` : imagesPart;
          hint.classList.toggle("bad", !imagesOk);
          hint.classList.toggle("ok", imagesOk);
          return;
        }
        hint.textContent = `${len} / ${need} chars · ${imagesPart}`;
        hint.classList.toggle("bad", len < need || !imagesOk);
        hint.classList.toggle("ok", len >= need && imagesOk);
      }

      async function ship(p, isUpdate, acceptNoTrialPrize) {
        const body = {
          otherYsws: $("s-ysws") ? $("s-ysws").checked : false,
          eligibilityAttested: $("s-eligible") ? $("s-eligible").checked : false,
          shipNote: $("s-note") ? $("s-note").value.trim() : "",

        if ($("s-ysws") && $("s-ysws").checked)
          body.otherYswsNotes = $("s-ysws-notes").value.trim();
        // 0 / absent tells the server this ship isn't for a Trial (clears any link).

        if (acceptNoTrialPrize) body.acceptNoTrialPrize = true;

        if (!r.ok) {

            const proceed = await Pixl.confirm({
              title: "Not quite there yet",

                `This Trial needs at least ${r.need}h tracked, you're at ${r.have}h. ` +
                `You can still ship it, you'll get pixels for the hours you put in, ` +
                `but not this Trial's prize.`,
              confirmText: "Ship anyway, no prize",
