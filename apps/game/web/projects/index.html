      // [dot colour class, title]. The dot is a small node on the rail — the
      // event title already names the verdict, so no status word in the marker.
      const VERDICTS = {
        approved: ["ok", "Approved"],
        first_pass_approved: ["rev", "Passed first review"],
        needs_changes: ["warn", "Sent back for changes"],
        rejected: ["bad", "Rejected"],
      };

      function tlItem(dotClass, title, at, extra, note) {
        return `<div class="tl-item">
    <span class="tl-dot ${dotClass}"></span>
    <div class="tl-content">
      <div class="tl-head"><span class="tl-title">${title}</span><span class="tl-time">${Pixl.timeAgo(at)}</span></div>
      ${extra || ""}${note || ""}
    </div>
  </div>`;
      }

      // Same shell as tlItem, but for a pipeline stage that has no per-event
      // timestamp of its own (a step still pending, or one only tracked as a
      // status field rather than a review_audits row) — takes a plain label
      // instead of computing timeAgo from an ISO date.
      function tlStageItem(dotClass, title, timeLabel) {
        return `<div class="tl-item">
    <span class="tl-dot ${dotClass}"></span>
    <div class="tl-content">
      <div class="tl-head"><span class="tl-title">${title}</span><span class="tl-time">${timeLabel}</span></div>
    </div>
  </div>`;
      }

      // After a first pass proposes approve/ban, the project still has to
      // clear the fraud pass (only if it was actually submitted there) and a
      // different final reviewer's second pass before anything is credited.
      // Rendered only while that's still in flight — once a final verdict
      // lands it becomes its own event in the list above.
      function tlPipelineRows(d) {
        const rows = [];
        if (d.joeUsed) {
          if (!d.fraudReviewDoneAt) {
            rows.push(tlStageItem("", "Waiting on fraud review", "in progress"));
            rows.push(tlStageItem("", "Second review", "not started yet"));
            return rows.join("");
          }
          rows.push(
            tlStageItem("rev", "Passed fraud review", Pixl.timeAgo(d.fraudReviewDoneAt)),
          );
        }
        rows.push(tlStageItem("", "Second review", "in progress"));
        return rows.join("");
      }

      function tlRow(e) {
        if (e.kind === "created")
          return tlItem("", "Project created", e.at, "", "");
        if (e.kind === "shipped")
          return tlItem("", "Shipped for review", e.at, "", "");
        const [icon, title] = VERDICTS[e.verdict] || ["rev", "Reviewed"];
        let hours = "";
        if (e.approvedHours != null) {
          const claimed = Number(e.claimedHours || 0);
          const appr = Number(e.approvedHours);
          const cut = Math.round((claimed - appr) * 10) / 10;
          hours = `<div class="tl-hours">Credited ${appr}h${claimed > appr ? ` of ${claimed}h claimed <span class="tl-cut">(−${cut}h)</span>` : ""}</div>`;
        }
        const note = e.note
          ? `<div class="tl-note">${Pixl.esc(e.note)}</div>`
          : "";
        return tlItem(icon, title, e.at, hours, note);
      }

      function autoGrow(el) {
        if (!el) return;
        el.style.height = "auto";
        el.style.height = el.scrollHeight + "px";
      }

      function mdApply(ta, action) {
        const s = ta.selectionStart,
          e = ta.selectionEnd,
          val = ta.value,
          sel = val.slice(s, e);
        const wrap = (before, after, ph) => {
          const text = sel || ph;
          ta.value = val.slice(0, s) + before + text + after + val.slice(e);
          ta.selectionStart = s + before.length;
          ta.selectionEnd = s + before.length + text.length;
        };
        const linePrefix = (pre) => {
          const ls = val.lastIndexOf("\n", s - 1) + 1;
          const nl = val.indexOf("\n", ls),
            le = nl === -1 ? val.length : nl;
          const line = val.slice(ls, le);
          const has = line.startsWith(pre);
          const newLine = has ? line.slice(pre.length) : pre + line;
          ta.value = val.slice(0, ls) + newLine + val.slice(le);
          const caret = Math.max(ls, s + (has ? -pre.length : pre.length));
          ta.selectionStart = ta.selectionEnd = caret;
        };
        switch (action) {
          case "bold":
            wrap("**", "**", "bold text");
            break;
          case "italic":
            wrap("*", "*", "italic text");
            break;
          case "code":
            sel.includes("\n")
              ? wrap("```\n", "\n```", "code")
              : wrap("`", "`", "code");
            break;
          case "h":
            linePrefix("# ");
            break;
          case "ul":
            linePrefix("- ");
            break;
          case "quote":
            linePrefix("> ");
            break;
          case "link": {
            const text = sel || "text",
              ins = `[${text}](url)`;
            ta.value = val.slice(0, s) + ins + val.slice(e);
            const u = s + text.length + 3;
            ta.selectionStart = u;
            ta.selectionEnd = u + 3;
            break;
          }
        }
        ta.focus();
        ta.dispatchEvent(new Event("input", { bubbles: true }));
      }

      function togglePreview() {
        const ta = $("j-content"),
          pv = $("j-preview"),
          btn = $("j-preview-btn");
        if (!pv.hidden) {
          pv.hidden = true;
          ta.hidden = false;
          btn.classList.remove("active");
          ta.focus();
          return;
        }
        const body = ta.value.trim();
        pv.innerHTML = body
          ? Pixl.markdown(body)
          : `<span class="faint">Nothing to preview yet.</span>`;
        pv.hidden = false;
        ta.hidden = true;
        btn.classList.add("active");
      }

      function initMdBar() {
        const bar = $("j-mdbar");
        if (!bar) return;
        bar.addEventListener("click", (ev) => {
          const b = ev.target.closest(".md-btn");
          if (!b) return;
          const a = b.dataset.md;
          if (a === "image") return $("j-img-file").click();
          if (a === "preview") return togglePreview();
          if (!$("j-preview").hidden) togglePreview();
          mdApply($("j-content"), a);
        });
        $("j-content").addEventListener("keydown", (ev) => {
          if (!(ev.ctrlKey || ev.metaKey)) return;
          const k = ev.key.toLowerCase();
          if (k === "b") {
            ev.preventDefault();
            mdApply($("j-content"), "bold");
          } else if (k === "i") {
            ev.preventDefault();
            mdApply($("j-content"), "italic");
          }
        });
      }

      // Swaps the IMAGE toolbar button for a spinner for the life of the
      // upload promise — the "Uploading…" toast auto-dismisses on its own
      // timer regardless of how long the request actually takes, so it's not
      // a real progress signal on a slow connection or a big journal.
      function setImageBtnBusy(busy) {
        const b = document.querySelector('#j-mdbar [data-md="image"]');
        if (!b) return;
        if (busy) {
          b.dataset.label = b.dataset.label || b.innerHTML;
          b.disabled = true;
          b.innerHTML = '<span class="spin-sm"></span>';
        } else {
          b.disabled = false;
          b.innerHTML = b.dataset.label || "IMAGE";
        }
      }

      // Autosaves the new-entry composer to localStorage as the player types,
      // so a reload/crash/tab-close mid-journal doesn't lose it — restored
      // the next time this project's composer is opened, cleared once the
      // entry actually posts. Scoped to the "new entry" composer only, not
      // the inline edit-existing-entry textareas.
      let currentJournalProjectId = null;
      function journalDraftKey(id) {
        return `pixl:journal-draft:${id}`;
      }
      function saveJournalDraft() {
        const id = currentJournalProjectId;
        if (id == null) return;
        const content = $("j-content")?.value ?? "";
        const hours = $("j-hours")?.value ?? "0";
        try {
          if (!content.trim()) localStorage.removeItem(journalDraftKey(id));
          else localStorage.setItem(journalDraftKey(id), JSON.stringify({ content, hours }));
        } catch {}
      }
      function loadJournalDraft(id) {
        try {
          const raw = localStorage.getItem(journalDraftKey(id));
          if (!raw) return;
          const draft = JSON.parse(raw);
          if (draft?.content) $("j-content").value = draft.content;
          if (draft?.hours != null) $("j-hours").value = draft.hours;
        } catch {}
      }
      function clearJournalDraft(id) {
        try {
          localStorage.removeItem(journalDraftKey(id));
        } catch {}
      }

      // Drops a literal placeholder line into the journal textarea itself —
      // visible in the raw text you're editing, not just a toast or a button
      // state — then swaps it for the real markdown once the upload resolves,
      // or removes it cleanly if the upload fails. Dispatches "input" after
      // each mutation (same convention as mdApply) so the hint/autosave/grow
      // listeners all pick it up without special-casing this path.
      async function attachImageToJournal(file, ta = $("j-content")) {
        setImageBtnBusy(true);
        const marker = "![Uploading image…]()";
        const inserted = (ta.value ? "\n" : "") + marker;
        ta.value += inserted;
        ta.dispatchEvent(new Event("input", { bubbles: true }));
        try {
          const url = await Pixl.upload(file);
          ta.value = ta.value.replace(marker, `![](${url})`);
          Pixl.toast("Image attached!");
        } catch (e) {
          ta.value = ta.value.replace(inserted, "");
          Pixl.toast(err(e.message), true);
        } finally {
          ta.dispatchEvent(new Event("input", { bubbles: true }));
          setImageBtnBusy(false);
        }
      }

      async function loadTimeline(id) {
        let d = null;
        try {
          d = await Pixl.api(`/api/projects/${id}/timeline`);
        } catch {}
        const events = (d && d.events) || [];
        const list = $("tl-list");
        if (!list) return;
        if (events.length === 0) {
          list.innerHTML = `<div class="faint" style="font-size:13px;padding:8px">No history yet, ship it to start the timeline.</div>`;
          return;
        }
        let html = events.map(tlRow).join("");
        const last = events[events.length - 1];
        // A first-pass approve/ban is only a proposal, not the final word —
        // show what's still ahead until a final verdict event replaces this.
        if (
          d &&
          last &&
          last.kind === "review" &&
          typeof last.verdict === "string" &&
          last.verdict.startsWith("first_pass_") &&
          last.verdict !== "first_pass_needs_changes"
        )
          html += tlPipelineRows(d);
        list.innerHTML = html;
      }

      let journalEditingId = null; // entry id currently expanded into an inline editor, if any

      function journalViewRow(e) {
        return `
      <div class="journal-entry panel" data-id="${e.id}">
        <div class="jmeta">
          <span>${Pixl.timeAgo(e.created_at)}</span>
          ${e.edited_at ? `<span class="faint">(edited)</span>` : ""}
          ${e.hours ? `<span class="teal">${Number(e.hours).toFixed(1)}h</span>` : ""}
          <button class="jedit" data-id="${e.id}">edit</button>
          <button class="jdel" data-id="${e.id}">delete</button>
        </div>
        <div class="jbody md">${Pixl.markdown(e.content)}</div>
      </div>`;
      }

      function journalEditRow(e) {
        return `
      <div class="journal-entry panel jeditor" data-id="${e.id}">
        <textarea class="field jedit-content" maxlength="5000">${Pixl.esc(e.content)}</textarea>
        <div class="composer-foot">
          <span class="faint" style="font-size:12px">hours:</span>
          <input class="field jedit-hours" type="number" min="0" max="100" step="0.5" value="${Number(e.hours) || 0}">
          <span class="j-hint faint jedit-hint"></span>
          <button class="btn jedit-cancel">CANCEL</button>
          <button class="btn jedit-save">SAVE</button>
        </div>
      </div>`;
      }

      let journalEntries = [];

      // hackatime + journal, kept in sync with journalEntries
      function updateTrackedChip(id) {
        const el = $("time-chip");
        if (!el) return;
        const p = projects.find((x) => x.id === Number(id));
        if (!p) return;
        if (p.is_owner === false) {
          loadCollabTrackedHours(p.id);
          return;
        }
        const htSec = linkedSeconds(p);
        const jSec = journalEntries.reduce((s, e) => s + (Number(e.hours) || 0), 0) * 3600;
        el.innerHTML = `<span class="tip-main">${Pixl.hours(htSec + jSec)} TRACKED</span><span class="tip-pop">Hackatime: ${Pixl.hours(htSec)} · Journal: ${Pixl.hours(jSec)}</span>`;
      }

      async function loadCollabTrackedHours(id) {
        try {
          const d = await Pixl.api(`/api/projects/${id}/hours`);
          const el = $("time-chip");
          if (!el || !d.ok) return;
          el.innerHTML = `<span class="tip-main">${Pixl.hours(d.trackedSeconds)} TRACKED</span><span class="tip-pop">Hackatime: ${Pixl.hours(d.hackatimeSeconds)} · Journal: ${Pixl.hours(d.journalSeconds)}</span>`;
        } catch {}
      }

      async function loadJournal(id) {
        try {
          const d = await Pixl.api(`/api/projects/${id}/journal`);
          journalEntries = d.entries || [];
        } catch {
          journalEntries = [];
        }
        journalEditingId = null;
        renderJournal(id);
      }

      function renderJournal(id) {
        const list = $("j-list");
        if (!list) return;
        list.innerHTML =
          journalEntries.length === 0
            ? `<div class="faint" style="font-size:13px;text-align:center;padding:14px">No entries yet, journal as you build, reviewers read these.</div>`
            : journalEntries
                .map((e) => (String(e.id) === journalEditingId ? journalEditRow(e) : journalViewRow(e)))
                .join("");

        list.querySelectorAll(".jedit").forEach((b) =>
          b.addEventListener("click", () => {
            // Journal ids come back from Postgres as bigint, which Supabase
            // serializes as a string , keep journalEditingId a string too so
            // the === check above (and this selector) actually match instead
            // of silently never rendering the editor.
            journalEditingId = String(b.dataset.id);
            renderJournal(id);
            const row = list.querySelector(`.jeditor[data-id="${journalEditingId}"]`);
            const ta = row && row.querySelector(".jedit-content");
            if (ta) {
              autoGrow(ta);
              ta.focus();
              ta.setSelectionRange(ta.value.length, ta.value.length);
              row.scrollIntoView({ behavior: "smooth", block: "nearest" });
            }
          }),
        );
        list.querySelectorAll(".jdel").forEach((b) =>
          b.addEventListener("click", async () => {
            if (!(await Pixl.confirm({ title: "Delete this journal entry?", confirmText: "Delete", danger: true }))) return;
            const r = await Pixl.send("DELETE", `/api/projects/${id}/journal/${b.dataset.id}`);
            if (r.ok) {
              Pixl.toast("Entry deleted.");
              loadJournal(id);
            } else Pixl.toast(err(r.error), true);
          }),
        );

        updateTrackedChip(id);

        const editRow = list.querySelector(".jeditor");
        if (!editRow) return;
        const ta = editRow.querySelector(".jedit-content");
        const hoursInput = editRow.querySelector(".jedit-hours");
        const hint = editRow.querySelector(".jedit-hint");
        const updateHint = () => {
          const content = ta.value.trim();
          const len = content.length;
          const hours = Number(hoursInput.value) || 0;
          const need = journalNeed(hours);
          const imagesNeed = journalImagesNeed(hours);
          const imagesHave = countJournalImages(content);
          const imagesOk = imagesHave >= imagesNeed;
          const imagesPart = `${imagesHave} / ${imagesNeed} image${imagesNeed === 1 ? "" : "s"}`;
          if (need === 0) {
            hint.textContent = len || content ? `${len} chars · ${imagesPart}` : imagesPart;
            hint.classList.toggle("bad", !imagesOk);
            hint.classList.toggle("ok", imagesOk);
            return;
          }
          hint.textContent = `${len} / ${need} chars · ${imagesPart}`;
          hint.classList.toggle("bad", len < need || !imagesOk);
          hint.classList.toggle("ok", len >= need && imagesOk);
        };
        ta.addEventListener("input", () => { autoGrow(ta); updateHint(); });
        hoursInput.addEventListener("input", updateHint);
        updateHint();
        editRow.querySelector(".jedit-cancel").addEventListener("click", () => {
          journalEditingId = null;
          renderJournal(id);
        });
        editRow.querySelector(".jedit-save").addEventListener("click", async () => {
          const content = ta.value.trim();
          if (!content) return Pixl.toast("Write something first!", true);
          const saveBtn = editRow.querySelector(".jedit-save");
          saveBtn.disabled = true;
          const editedId = journalEditingId;
          let r;
          try {
            r = await Pixl.send("PATCH", `/api/projects/${id}/journal/${editedId}`, {
              content,
              hours: Number(hoursInput.value) || 0,
            });
          } catch (e) {
            saveBtn.disabled = false;
            return Pixl.toast(err(e && e.message), true);
          }
          saveBtn.disabled = false;
          if (!r.ok) {
            if (r.error === "journal_too_short")
              return Pixl.toast(
                `Logging ${r.hours}h needs ≥ ${r.need} characters (you have ${content.length}).`,
                true,
              );
            if (r.error === "journal_images_required")
              return Pixl.toast(
                `This entry needs ${r.need} image${r.need === 1 ? "" : "s"} (you have ${r.have}).`,
                true,
              );
            return Pixl.toast(err(r.error), true);
          }
          // Close and re-render straight from the PATCH response instead of
          // firing a second GET (loadJournal) - fewer round trips, and one
          // less thing that has to succeed for the editor to actually close.
          const idx = journalEntries.findIndex((x) => String(x.id) === editedId);
          if (idx !== -1 && r.entry) journalEntries[idx] = r.entry;
          journalEditingId = null;
          Pixl.toast("Entry updated!");
          renderJournal(id);
        });
      }

      async function postJournal(id) {
        const content = $("j-content").value.trim();
        if (!content) return Pixl.toast("Write something first!", true);
        $("j-post").disabled = true;
        const r = await Pixl.send("POST", `/api/projects/${id}/journal`, {
          content,
          hours: Number($("j-hours").value) || 0,
        });
        $("j-post").disabled = false;
        if (!r.ok) {
          if (r.error === "journal_too_short")
            return Pixl.toast(
              `Logging ${r.hours}h needs ≥ ${r.need} characters (you have ${content.length}).`,
              true,
            );
          if (r.error === "journal_images_required")
            return Pixl.toast(
              `This entry needs ${r.need} image${r.need === 1 ? "" : "s"} (you have ${r.have}).`,
              true,
            );
          return Pixl.toast(err(r.error), true);
        }
        $("j-content").value = "";
        $("j-hours").value = "0";
        autoGrow($("j-content"));
        clearJournalDraft(id);
        Pixl.toast("Entry posted!");
        loadJournal(id);
      }

      async function deleteProject(p) {
        if (
          !(await Pixl.confirm({
            title: "Delete this project?",
            body: `Delete "${p.name}" and all its journal entries? This can't be undone.`,
            confirmText: "Delete",
            danger: true,
          }))
        )
          return;
        if (
          !(await Pixl.confirm({
            title: "Really sure?",
            body: "Gone means gone.",
            confirmText: "Delete forever",
            danger: true,
          }))
        )
          return;
        const r = await Pixl.send("DELETE", `/api/projects/${p.id}`);
        if (!r.ok) return Pixl.toast(err(r.error), true);
        Pixl.toast("Project deleted.");
        await loadProjects();
        location.hash = "#";
      }

      /* ---------- paste-to-upload (thumbnail while editing) ---------- */

      document.addEventListener("paste", (e) => {
        const file = [...(e.clipboardData?.items || [])]
          .find((i) => i.type.startsWith("image/"))
          ?.getAsFile();
        if (!file) return;
        const active = document.activeElement;
        if (active === $("j-content") || active?.classList?.contains("jedit-content")) {
          e.preventDefault();
          attachImageToJournal(file, active);
        } else if ($("f-thumb-btn")) {
          e.preventDefault();
          setThumb(file);
        }
      });

      /* ---------- router ---------- */

      async function route() {
        if (!Pixl.hasToken) return;
        // A pending autosave targets this render's #f-name/#f-desc/etc DOM
        // nodes by id — those ids get reused by whatever renders next, so an
        // in-flight timer left running would silently write the new view's
        // fields onto the old project.
        clearTimeout(autosaveTimer);
        const h = location.hash.replace(/^#/, "");
        $("new-btn").style.display = "";
        // The legend describes the list, so it comes off once you're inside
        // the editor or a single project.
        const onList = h !== "new" && !h.startsWith("p=");
        $("legend").style.display = onList ? "" : "none";
        $("ht-slot").style.display = onList ? "" : "none";
        $("invites-slot").style.display = onList ? "" : "none";
        $("join-code-slot").style.display = onList ? "" : "none";
        $("ysws-import-slot").style.display = onList ? "" : "none";
        if (onList) renderLegend();
        if (h === "new") {
          // allTrials/trials were loaded once at page boot and never since —
          // a Trial accepted in-game after that (very likely, since this page
          // is opened as a reused popup window rather than freshly navigated
          // each time) would still show here as locked, wrongly blocking
          // project creation with a stale "accept it first" error. Refetch on
          // every visit to the new-project form so the lock state is current.
          await loadTrials();
          $("new-btn").style.display = "none";
          $("view").innerHTML =
            `<a class="btn dark back-btn" href="#">← ALL PROJECTS</a><div class="editor">${trialBriefHtml(activeTrial)}${formHtml({})}</div>`;
          bindForm({});
          wireHtPicker();
          return;
        }
        if (h.startsWith("p=")) return renderProject(Number(h.slice(2)));
        renderList();
      }

      async function loadProjects() {
        const d = await Pixl.api("/api/projects");
        projects = (d.projects || []).map((p) => ({ ...p, id: Number(p.id) }));
      }

      async function loadTrials() {
        try {
          const d = await Pixl.api("/api/sidequests");
          allTrials = d.quests || [];
          // Only Trials the player has taken on and not yet finished can be a
          // ship target.
          trials = allTrials.filter((q) => q.unlocked && !q.completed);
        } catch (e) {
          trials = [];
          allTrials = [];
        }
        // The Trial the player arrived to build for: ?trial=<id> from the NPC, or
        // the single accepted Trial if there's exactly one. Drives the brief panel.
        const tid = Number(new URLSearchParams(location.search).get("trial"));
        activeTrial =
          (tid && trials.find((t) => Number(t.id) === tid)) ||
          (trials.length === 1 ? trials[0] : null);
      }

      // "Building for this Trial" brief — shown atop the new-project form and the
      // editor so the player builds to the Trial's spec.
      function trialBriefHtml(t) {
        if (!t) return "";
        return `
      <div class="trial-brief">
        <div class="trial-brief-h">BUILDING FOR TRIAL: ${Pixl.esc(t.name)}${t.region ? ` · ${Pixl.esc(t.region)}` : ""}</div>
        ${t.description ? `<p class="trial-brief-desc">${Pixl.esc(t.description)}</p>` : ""}
        ${t.brief ? `<div class="trial-brief-spec"><div class="trial-brief-spec-h">THE FULL BRIEF</div><p>${Pixl.esc(t.brief).replace(/\n/g, "<br>")}</p></div>` : ""}
        ${t.min_hours != null ? `<div class="trial-brief-hours">Minimum <b>${Pixl.esc(String(t.min_hours))}h</b> tracked to ship for this Trial.</div>` : ""}
        ${t.reward ? `<div class="trial-brief-reward">Reward on completion: <b>${Pixl.esc(t.reward)}</b>${t.min_hours ? ` (covers the first ${t.min_hours}h)` : ""}, <b>plus pixels at the normal rate for every hour beyond that</b>. Prefer pixels only? You can skip the prize once it's approved and take all your hours as pixels instead.</div>` : ""}
        <div class="trial-brief-note">Build to this spec. When you ship, it's flagged for this Trial in the picker below (change it if you're building something else).</div>
      </div>`;
      }

      // A Trial ship pays one way or the other. Once it's approved the payout
      // sits held until the player picks here: the Trial's prize, or the pixels
      // their hours earned. Whichever they skip is gone.
      function trialRewardHtml(p) {
        const choice = p.trial_reward_choice || "";
        if (!choice) return "";
        const prize = p.trial_prize_name || "the Trial reward";
        if (choice === "item")
          return `<div class="trial-claim"><div class="trial-claim-taken">Trial reward claimed: <b>${Pixl.esc(prize)}</b>. Track it in <a href="/orders/">your orders</a>.</div></div>`;
        if (choice === "pixels")
          return `<div class="trial-claim"><div class="trial-claim-taken">You took the pixels for this Trial instead of the reward.</div></div>`;
        const total = Math.round(Number(p.trial_held_px) || 0);
        const beyond = Math.max(total - Math.round(Number(p.trial_prize_px) || 0), 0);
        return `
      <div class="trial-claim">
        <div class="trial-claim-h">YOUR TRIAL REWARD</div>
        <p>
          ${Pixl.esc(p.sidequest_name || "This Trial")} is done! By default you keep <b>${Pixl.esc(prize)}</b>${beyond > 0 ? ` and still earn <b>${beyond} pixels</b> for the hours past the minimum` : ""}.
          Prefer pure pixels? Skip the prize to take all <b>${total}</b> instead. It's final either way.
        </p>
        <div class="trial-claim-opts">
          <button class="btn" id="tr-item">KEEP ${Pixl.esc(prize.toUpperCase())}${beyond > 0 ? ` + ${beyond} PX` : ""}</button>
          <button class="btn dark" id="tr-px">SKIP PRIZE, TAKE ${total} PX</button>
        </div>
      </div>`;
      }

      async function claimTrialReward(p, choice, prize, total, beyond) {
        const body =
          choice === "item"
            ? `You'll get "${prize}"${beyond > 0 ? ` plus ${beyond} pixels for the hours past the minimum` : ""}, and give up taking all ${total} pixels. This can't be undone.`
            : `You'll get all ${total} pixels and give up "${prize}". This can't be undone.`;
        if (
          !(await Pixl.confirm({
            title: choice === "item" ? "Keep the prize?" : "Skip the prize?",
            body,
            confirmText: choice === "item" ? "Keep the prize" : "Take all pixels",
          }))
        )
          return;
        for (const id of ["tr-item", "tr-px"]) if ($(id)) $(id).disabled = true;
        const r = await Pixl.send("POST", `/api/projects/${p.id}/trial-reward`, { choice });
        if (!r.ok) {
          for (const id of ["tr-item", "tr-px"]) if ($(id)) $(id).disabled = false;
          return Pixl.toast(err(r.error), true);
        }
        Pixl.toast(
          choice === "item"
            ? `"${prize}" is on the way${beyond > 0 ? ` (+${beyond} pixels)` : ""}, check your orders.`
            : `+${total} pixels.`,
        );
        await loadProjects();
        renderProject(p.id);
      }

      // The Trial to brief for a given project: its own linked Trial if set, else
      // the Trial the player arrived to work on.
      function trialForProject(p) {
        if (p && p.sidequest_id) {
          const linked = trials.find((t) => Number(t.id) === Number(p.sidequest_id));
          if (linked) return linked;
        }
        return activeTrial;
      }

      async function boot() {
        if (!Pixl.hasToken) return;
        try {
          const [s, elig, wallet] = await Promise.all([
            Pixl.api("/api/hackatime/stats"),
            Pixl.api("/api/profile/eligibility"),
            Pixl.api("/api/profile/wallet"),
            loadProjects(),
            loadTrials(),
            loadFeeds(),
          ]);
          stats = s.stats || null;
          hasBirthday = !!(elig && elig.ok && elig.birthday);
          if (wallet && wallet.ok && wallet.usdPerHour > 0) walletUsdPerHour = wallet.usdPerHour;
        } catch (e) {
          if (e.message !== "unauthorized")
            Pixl.toast("Couldn't reach the server.", true);
        }
        $("loading").remove();
        renderHt();
        loadPendingInvites();
        renderJoinCodeBox();
        renderYswsImportBox();
        route();
      }
      window.addEventListener("hashchange", route);

      // This page fetches projects once on boot and never again on its own —
      // a review verdict (needs_changes, approved, etc.) landing while the
      // tab is backgrounded left the status stuck showing whatever it was at
      // load time until a manual reload. Refetch when the tab regains focus,
      // same load+render pair already used after ship/unship/etc. above.
      // Skipped while actively typing so a background refresh can't wipe out
      // an in-progress edit.
      document.addEventListener("visibilitychange", async () => {
        if (document.visibilityState !== "visible" || !Pixl.hasToken) return;
        const active = document.activeElement;
        if (active && (active.tagName === "TEXTAREA" || active.tagName === "INPUT")) return;
        try {
          await loadProjects();
        } catch (e) {
          return;
        }
        route();
      });

      boot();
    </script>
  </body>
</html>
