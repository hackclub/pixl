<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixl · Ideas</title>
    <!-- <pixl-preview> -->
    <meta name="description" content="Post project ideas, browse what others are building, and upvote your favorites.">
    <link rel="canonical" href="https://pixl.hackclub.com/ideas/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Pixl">
    <meta property="og:title" content="Pixl · Ideas">
    <meta property="og:description" content="Post project ideas, browse what others are building, and upvote your favorites.">
    <meta property="og:url" content="https://pixl.hackclub.com/ideas/">
    <meta property="og:image" content="https://pixl.hackclub.com/ideas/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Pixl · Ideas">
    <meta name="twitter:description" content="Post project ideas, browse what others are building, and upvote your favorites.">
    <meta name="twitter:image" content="https://pixl.hackclub.com/ideas/og.png">
    <!-- <pixl-preview:end> -->
<link rel="icon" href="/index.icon.png">
<link rel="stylesheet" href="/pixl.css?v=3">
<style>
  .hero {
    padding: 26px 30px; margin-top: 8px; display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap;
  }
  .hero .page-sub { margin-bottom: 4px; color: var(--dim); }
  .compose { padding: 18px 20px; margin-bottom: 22px; display: flex; flex-direction: column; gap: 10px; }
  .compose .field { font-size: 16.5px; line-height: 1.5; }
  .compose textarea.field { min-height: 46px; max-height: 280px; resize: none; overflow-y: auto; transition: height .1s ease; }
  .compose-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .compose-foot .count { font-size: 12.5px; color: var(--faint); }
  .tabs { display: flex; gap: 6px; margin: 0 0 18px; flex-wrap: wrap; }
  .tab {
    border: var(--bw) solid var(--stroke); border-radius: 0;
    background: var(--panel);
    color: var(--dim);
    font-size: 15px;
    letter-spacing: 1px;
    padding: 10px 18px 8px;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .tab:hover { color: var(--gold); border-color: var(--gold) }
  .tab.active { background: var(--gold); color: var(--btn-ink); border-color: var(--gold); }
  .searchbar { display: flex; gap: 10px; margin-bottom: 18px; }
  .searchbar input { flex: 1; }
  .idea-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .idea-list { grid-template-columns: 1fr; } }
  .idea-card { padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }
  .idea-meta { font-size: 13px; color: var(--faint); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .idea-title { font-size: 18px; color: var(--ink); }
  .idea-body { font-size: 15px; color: var(--dim); word-break: break-word; }
  .idea-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
  .upvote-btn { display: inline-flex; align-items: center; gap: 5px; font-family: var(--pixel, inherit); font-size: 13px; font-weight: 600;
    color: var(--dim); background: var(--panel-2); border: var(--bw) solid var(--stroke); border-radius: 0; padding: 4px 11px; cursor: pointer;
    transition: color .12s ease, border-color .12s ease, background .12s ease, transform .08s ease; }
  .upvote-btn:hover:not(:disabled) { color: var(--gold); border-color: var(--gold); transform: translateY(-1px); }
  .upvote-btn.on { color: var(--btn-ink); background: var(--gold); border-color: var(--gold); cursor: default; }
  .upvote-btn:disabled { cursor: default; }
  .vote-group { display: inline-flex; align-items: center; gap: 6px; }
  .downvote-btn { display: inline-flex; align-items: center; gap: 5px; font-family: var(--pixel, inherit); font-size: 13px; font-weight: 600;
    color: var(--dim); background: var(--panel-2); border: var(--bw) solid var(--stroke); border-radius: 0; padding: 4px 11px; cursor: pointer;
    transition: color .12s ease, border-color .12s ease, background .12s ease, transform .08s ease; }
  .downvote-btn:hover:not(:disabled) { color: var(--bad); border-color: var(--bad); transform: translateY(-1px); }
  .downvote-btn.on { color: var(--btn-ink); background: var(--bad); border-color: var(--bad); cursor: default; }
  .downvote-btn:disabled { cursor: default; }
  .own-badge { color: var(--gold); }
</style>
</head>
<body>
<main class="wrap">
  <section class="hero hud deep">
    <h1 class="page-title">IDEAS</h1>
    <div class="page-sub">POST WHAT YOU'D BUILD. BROWSE WHAT EVERYONE ELSE WOULD. STEAL FREELY.</div>
  </section>

  <div class="panel compose" id="compose">
    <input class="field" id="i-title" maxlength="120" placeholder="Idea title…" autocomplete="off">
    <textarea class="field" id="i-body" maxlength="2000" placeholder="What is it, why's it cool… (optional)"></textarea>
    <div class="compose-foot">
      <span class="count" id="i-count">0/120</span>
      <button class="btn" id="i-post">POST IDEA</button>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-sort="new">NEW</button>
    <button class="tab" data-sort="top">TOP</button>
  </div>
  <div class="searchbar"><input class="field" id="iq" type="search" placeholder="Find an idea…" autocomplete="off"></div>

  <div id="view"></div>
</main>

<script src="/pixl.js?v=6"></script>
<script>
Pixl.mountTopbar("ideas");
Pixl.loadWallet();

const view = document.getElementById("view");
let sort = "new";
let q = "";

function voteGroup(i) {
  const disabled = i.has_upvoted || i.has_downvoted;
  return `<span class="vote-group">
    <button class="upvote-btn${i.has_upvoted ? " on" : ""}" onclick="return castVote(event,${Number(i.id)},'up')"${disabled ? " disabled" : ""} aria-label="Upvote this idea" title="${i.has_upvoted ? "You upvoted this" : "Upvote this idea"}">▲ <span class="uv-count">${i.upvotes || 0}</span></button>
    <button class="downvote-btn${i.has_downvoted ? " on" : ""}" onclick="return castVote(event,${Number(i.id)},'down')"${disabled ? " disabled" : ""} aria-label="Downvote this idea" title="${i.has_downvoted ? "You downvoted this" : "Downvote this idea"}">▼ <span class="dv-count">${i.downvotes || 0}</span></button>
  </span>`;
}

function ideaCard(i) {
  return `
    <div class="panel idea-card" data-id="${Pixl.esc(i.id)}">
      <div class="idea-meta">
        <span class="gold">${Pixl.esc(i.author_name)}</span>${i.is_mine ? ' <span class="own-badge">· YOU</span>' : ""}
        <span>${Pixl.timeAgo(i.created_at)}</span>
      </div>
      <div class="idea-title">${Pixl.esc(i.title)}</div>
      ${i.body ? `<div class="idea-body md">${Pixl.markdown(i.body)}</div>` : ""}
      <div class="idea-foot">
        ${voteGroup(i)}
        ${i.is_mine ? `<button class="btn dark" onclick="return deleteIdea(${Number(i.id)})">DELETE</button>` : ""}
      </div>
    </div>`;
}

window.castVote = async function (e, id, dir) {
  e.preventDefault();
  const card = document.querySelector(`.idea-card[data-id="${id}"]`);
  const upBtn = card ? card.querySelector(".upvote-btn") : null;
  const downBtn = card ? card.querySelector(".downvote-btn") : null;
  if ((upBtn && upBtn.disabled) || (downBtn && downBtn.disabled)) return false;
  if (upBtn) upBtn.disabled = true;
  if (downBtn) downBtn.disabled = true;
  const r = await Pixl.send("POST", "/api/ideas/" + id + "/" + (dir === "up" ? "upvote" : "downvote"));
  if (r.ok) {
    const btn = dir === "up" ? upBtn : downBtn;
    if (btn) {
      btn.classList.add("on");
      const c = btn.querySelector(dir === "up" ? ".uv-count" : ".dv-count");
      if (c) c.textContent = dir === "up" ? r.upvotes : r.downvotes;
    }
  } else {
    if (upBtn) upBtn.disabled = false;
    if (downBtn) downBtn.disabled = false;
    const msg = r.error === "own_idea" ? "You can't vote on your own idea."
      : r.error === "already_upvoted" || r.error === "already_downvoted" ? "You've already voted on this idea."
      : `Couldn't ${dir}vote right now.`;
    Pixl.toast(msg, true);
  }
  return false;
};

window.deleteIdea = async function (id) {
  if (!(await Pixl.confirm({ title: "Delete this idea?", confirmText: "Delete", danger: true }))) return false;
  const r = await Pixl.send("DELETE", "/api/ideas/" + id);
  if (r.ok) {
    const card = document.querySelector(`.idea-card[data-id="${id}"]`);
    if (card) card.remove();
  } else {
    Pixl.toast("Couldn't delete that idea.", true);
  }
  return false;
};

async function load() {
  view.innerHTML = `<div class="spin"></div>`;
  const params = new URLSearchParams();
  if (q) params.set("q", q);
  if (sort !== "new") params.set("sort", sort);
  const data = await Pixl.api("/api/ideas" + (params.toString() ? "?" + params.toString() : ""));
  const ideas = data.ideas || [];
  view.innerHTML = ideas.length === 0
    ? `<div class="empty-note">NO IDEAS YET, POST THE FIRST ONE!</div>`
    : `<div class="idea-list">${ideas.map(ideaCard).join("")}</div>`;
}

document.querySelectorAll("#tabs .tab").forEach((t) => t.addEventListener("click", () => {
  sort = t.dataset.sort;
  document.querySelectorAll("#tabs .tab").forEach((x) => x.classList.toggle("active", x === t));
  load();
}));

const searchInput = document.getElementById("iq");
let searchT;
searchInput.addEventListener("input", () => {
  clearTimeout(searchT);
  searchT = setTimeout(() => { q = searchInput.value.trim(); load(); }, 350);
});

const titleInput = document.getElementById("i-title");
const bodyInput = document.getElementById("i-body");
const countEl = document.getElementById("i-count");
const postBtn = document.getElementById("i-post");
titleInput.addEventListener("input", () => { countEl.textContent = `${titleInput.value.length}/120`; });

// Grows with the text up to max-height (280px, set in CSS), then scrolls —
// stays roomy without letting one huge idea take over the page.
function autoGrow() {
  bodyInput.style.height = "auto";
  bodyInput.style.height = bodyInput.scrollHeight + "px";
}
bodyInput.addEventListener("input", autoGrow);

postBtn.addEventListener("click", async () => {
  const title = titleInput.value.trim();
  if (title.length < 3) return Pixl.toast("Give it a title (3+ characters).", true);
  postBtn.disabled = true;
  const r = await Pixl.send("POST", "/api/ideas", { title, body: bodyInput.value.trim() });
  postBtn.disabled = false;
  if (r.ok) {
    titleInput.value = "";
    bodyInput.value = "";
    bodyInput.style.height = "";
    countEl.textContent = "0/120";
    load();
  } else {
    const msg = r.error === "blocked_content" ? "That idea contains blocked content."
      : r.error === "title_too_short" ? "Give it a title (3+ characters)."
      : "Couldn't post that idea.";
    Pixl.toast(msg, true);
  }
});

if (Pixl.hasToken) load();
</script>
</body>
</html>
