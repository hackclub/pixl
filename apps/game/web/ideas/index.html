<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixl · Ideas</title>
    <!-- <pixl-preview> -->
    <meta name="description" content="Post project ideas, browse what others are building, and upvote your favorites.">
    <link rel="canonical" href="https://pixl.hackclub.com/ideas/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Pixl">
    <meta property="og:title" content="Pixl · Ideas">
    <meta property="og:description" content="Post project ideas, browse what others are building, and upvote your favorites.">
    <meta property="og:url" content="https://pixl.hackclub.com/ideas/">
    <meta property="og:image" content="https://pixl.hackclub.com/ideas/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Pixl · Ideas">
    <meta name="twitter:description" content="Post project ideas, browse what others are building, and upvote your favorites.">
    <meta name="twitter:image" content="https://pixl.hackclub.com/ideas/og.png">
    <!-- <pixl-preview:end> -->
<link rel="icon" href="/index.icon.png">
<link rel="stylesheet" href="/pixl.css?v=4">
<style>
  .hero {
    padding: 26px 30px; margin-top: 8px; display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap;
  }
  .hero .page-sub { margin-bottom: 4px; color: var(--dim); }
  .compose { padding: 18px 20px; margin-bottom: 22px; display: flex; flex-direction: column; gap: 10px; }
  .compose .field { font-size: 16.5px; line-height: 1.5; }
  .compose textarea.field { min-height: 46px; max-height: 280px; resize: none; overflow-y: auto; transition: height .1s ease; }
  .compose-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .compose-foot .count { font-size: 12.5px; color: var(--faint); }
  .tabs { display: flex; gap: 6px; margin: 0 0 18px; flex-wrap: wrap; }
  .tab {
    border: var(--bw) solid var(--stroke); border-radius: 0;
    background: var(--panel);
    color: var(--dim);
    font-size: 15px;
    letter-spacing: 1px;
    padding: 10px 18px 8px;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .tab:hover { color: var(--gold); border-color: var(--gold) }
  .tab.active { background: var(--gold); color: var(--btn-ink); border-color: var(--gold); }
  .searchbar { display: flex; gap: 10px; margin-bottom: 18px; }
  .searchbar input { flex: 1; }
  .idea-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .idea-list { grid-template-columns: 1fr; } }
  .idea-card { padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }

  .collab-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--panel-2); border: var(--bw) dashed var(--stroke); }
  .collab-row .switch { position: relative; width: 38px; height: 22px; border: var(--bw) solid var(--stroke); background: var(--panel); flex: none; cursor: pointer; }
  .collab-row .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: var(--faint); transition: transform .15s ease, background .15s ease; }
  .collab-row .switch.on { background: var(--gold); }
  .collab-row .switch.on::after { transform: translateX(16px); background: var(--btn-ink); }
  .collab-row .switch-label { font-size: 13.5px; color: var(--ink); font-weight: 600; }
  .collab-row .switch-sub { font-size: 12px; color: var(--faint); }
  .role-picker { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .role-picker[hidden] { display: none; }
  .role-opt { display: inline-flex; align-items: center; gap: 6px; font-family: var(--sans); font-size: 12.5px; font-weight: 700;
    padding: 5px 10px 5px 6px; border: var(--bw) solid var(--stroke); background: var(--panel); color: var(--dim); cursor: pointer; }
  .role-opt.on { background: var(--role-color, var(--teal)); color: var(--btn-ink); }
  .hours-row { display: flex; align-items: center; gap: 10px; }
  .hours-row[hidden] { display: none; }
  .hours-row label { font-size: 13px; color: var(--faint); }
  .hours-row input { width: 90px; }
  .image-row { display: flex; align-items: center; gap: 10px; }
  .image-row[hidden] { display: none; }
  .image-row .thumb-preview { width: 60px; height: 34px; border: var(--bw) solid var(--stroke); overflow: hidden; flex: none;
    background: repeating-conic-gradient(rgba(22,22,30,.05) 0% 25%, transparent 0% 50%) 0 0/10px 10px, var(--panel-2); }
  .image-row .thumb-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .idea-list .poster-layout { grid-column: 1 / -1; display: grid; grid-template-columns: 340px 1fr; gap: 28px; align-items: start; }
  @media (max-width: 760px) { .idea-list .poster-layout { grid-template-columns: 1fr; } }
  .poster-card { position: relative; width: 340px; height: 438px;
    background: url(../img/poster-wanted.png) no-repeat; background-size: 340px 438px;
    filter: drop-shadow(5px 5px 0 rgba(0,0,0,.18)); }
  .poster-thumb { position: absolute; left: 65px; top: 172px; width: 210px; height: 96px;
    border: 2px solid var(--stroke); overflow: hidden; display: flex; align-items: center; justify-content: center;
    background: repeating-conic-gradient(rgba(22,22,30,.05) 0% 25%, transparent 0% 50%) 0 0/16px 16px, var(--panel-2); }
  .poster-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .poster-thumb-roles { display: flex; gap: 10px; }
  .poster-thumb-role { width: 56px; height: 56px; display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--stroke); background: var(--role-color); }
  .poster-thumb-role img { width: 36px; height: 36px; image-rendering: pixelated; }
  .poster-thumb-none { font-family: var(--pixel); font-size: 11px; letter-spacing: 1.5px; color: var(--muted); text-align: center; }
  .poster-seeking { position: absolute; left: 26px; top: 280px; width: 288px; text-align: center;
    font-family: var(--sans); font-weight: 700; font-size: 13px; letter-spacing: .3px; color: #16161e; }
  .poster-hours { position: absolute; left: 26px; top: 302px; width: 288px; text-align: center;
    font-family: var(--sans); font-size: 11.5px; letter-spacing: .2px; color: #6f6f78; }
  .poster-desc { padding: 26px 28px; display: flex; flex-direction: column; gap: 14px; }
  .poster-desc-eyebrow { font-family: var(--pixel); font-size: 12px; letter-spacing: 1.5px; color: var(--gold); }
  .poster-desc-title { font-size: 24px; font-weight: 700; color: var(--ink); line-height: 1.28; }
  .poster-desc-meta { font-size: 13px; color: var(--faint); padding-bottom: 14px; border-bottom: 1px solid var(--stroke); }
  .poster-desc-body { font-size: 15.5px; color: var(--dim); line-height: 1.6; max-width: 60ch; }
  .poster-desc-roles-h { font-family: var(--pixel); font-size: 11px; letter-spacing: 1px; color: var(--faint); margin-top: 4px; }
  .poster-desc-roles { display: flex; gap: 6px; flex-wrap: wrap; }
  .poster-desc-role { display: inline-flex; align-items: center; gap: 5px; font-family: var(--sans); font-size: 11.5px; font-weight: 700;
    letter-spacing: .2px; padding: 4px 10px 4px 5px; border: var(--bw) solid var(--stroke); background: var(--role-color); color: var(--btn-ink); }
  .poster-desc-role img { width: 18px; height: 18px; image-rendering: pixelated; display: block; }
  .poster-desc-apply { align-self: flex-start; margin-top: 6px; }
  .poster-desc-apply.on { background: var(--panel-2); color: var(--faint); cursor: default; }
  .poster-desc-note { font-size: 12px; color: var(--faint); margin-top: 6px; }
  .idea-meta { font-size: 13px; color: var(--faint); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .idea-title { font-size: 18px; color: var(--ink); }
  .idea-body { font-size: 15px; color: var(--dim); word-break: break-word; }
  .idea-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
  .upvote-btn { display: inline-flex; align-items: center; gap: 5px; font-family: var(--pixel, inherit); font-size: 13px; font-weight: 600;
    color: var(--dim); background: var(--panel-2); border: var(--bw) solid var(--stroke); border-radius: 0; padding: 4px 11px; cursor: pointer;
    transition: color .12s ease, border-color .12s ease, background .12s ease, transform .08s ease; }
  .upvote-btn:hover:not(:disabled) { color: var(--gold); border-color: var(--gold); transform: translateY(-1px); }
  .upvote-btn.on { color: var(--btn-ink); background: var(--gold); border-color: var(--gold); cursor: default; }
  .upvote-btn:disabled { cursor: default; }
  .vote-group { display: inline-flex; align-items: center; gap: 6px; }
  .downvote-btn { display: inline-flex; align-items: center; gap: 5px; font-family: var(--pixel, inherit); font-size: 13px; font-weight: 600;
    color: var(--dim); background: var(--panel-2); border: var(--bw) solid var(--stroke); border-radius: 0; padding: 4px 11px; cursor: pointer;
    transition: color .12s ease, border-color .12s ease, background .12s ease, transform .08s ease; }
  .downvote-btn:hover:not(:disabled) { color: var(--bad); border-color: var(--bad); transform: translateY(-1px); }
  .downvote-btn.on { color: var(--btn-ink); background: var(--bad); border-color: var(--bad); cursor: default; }
  .downvote-btn:disabled { cursor: default; }
  .own-badge { color: var(--gold); }
</style>
</head>
<body>
<main class="wrap">
  <section class="hero hud deep">
    <h1 class="page-title">IDEAS</h1>
    <div class="page-sub">POST WHAT YOU'D BUILD. BROWSE WHAT EVERYONE ELSE WOULD. STEAL FREELY.</div>
  </section>

  <div class="panel compose" id="compose">
    <input class="field" id="i-title" maxlength="120" placeholder="Idea title…" autocomplete="off">
    <textarea class="field" id="i-body" maxlength="2000" placeholder="What is it, why's it cool… (optional)"></textarea>
    <div class="collab-row">
      <span class="switch" id="collab-switch"></span>
      <div>
        <div class="switch-label">Looking for collaborators</div>
        <div class="switch-sub">Shows what roles you need and lets people apply</div>
      </div>
    </div>
    <div class="role-picker" id="role-picker" hidden>
      <span class="role-opt" data-role="art" style="--role-color:#e8a33d">ART</span>
      <span class="role-opt" data-role="audio" style="--role-color:#8a6fd8">AUDIO</span>
      <span class="role-opt" data-role="code" style="--role-color:#52aeb9">CODE</span>
      <span class="role-opt" data-role="design" style="--role-color:#5fa8e0">DESIGN</span>
      <span class="role-opt" data-role="writing" style="--role-color:#c96a8f">WRITING</span>
    </div>
    <div class="hours-row" id="hours-row" hidden>
      <label for="i-hours">Approx hours of work needed</label>
      <input class="field" id="i-hours" type="number" min="1" max="1000" step="1" placeholder="15">
    </div>
    <div class="image-row" id="image-row" hidden>
      <button class="btn ghost" id="i-image-btn" type="button">ADD IMAGE</button>
      <div class="thumb-preview" id="i-image-preview" hidden></div>
      <input type="file" id="i-image-file" accept="image/*" hidden>
    </div>
    <div class="compose-foot">
      <span class="count" id="i-count">0/120</span>
      <button class="btn" id="i-post">POST IDEA</button>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-sort="new">NEW</button>
    <button class="tab" data-sort="top">TOP</button>
  </div>
  <div class="searchbar"><input class="field" id="iq" type="search" placeholder="Find an idea…" autocomplete="off"></div>

  <div id="view"></div>
</main>

<script src="/pixl.js?v=6"></script>
<script>
Pixl.mountTopbar("ideas");
Pixl.loadWallet();

const view = document.getElementById("view");
let sort = "new";
let q = "";

function voteGroup(i) {
  const disabled = i.has_upvoted || i.has_downvoted;
  return `<span class="vote-group">
    <button class="upvote-btn${i.has_upvoted ? " on" : ""}" onclick="return castVote(event,${Number(i.id)},'up')"${disabled ? " disabled" : ""} aria-label="Upvote this idea" title="${i.has_upvoted ? "You upvoted this" : "Upvote this idea"}">▲ <span class="uv-count">${i.upvotes || 0}</span></button>
    <button class="downvote-btn${i.has_downvoted ? " on" : ""}" onclick="return castVote(event,${Number(i.id)},'down')"${disabled ? " disabled" : ""} aria-label="Downvote this idea" title="${i.has_downvoted ? "You downvoted this" : "Downvote this idea"}">▼ <span class="dv-count">${i.downvotes || 0}</span></button>
  </span>`;
}

function ideaCard(i) {
  return `
    <div class="panel idea-card" data-id="${Pixl.esc(i.id)}">
      <div class="idea-meta">
        <span class="gold">${Pixl.esc(i.author_name)}</span>${i.is_mine ? ' <span class="own-badge">· YOU</span>' : ""}
        <span>${Pixl.timeAgo(i.created_at)}</span>
      </div>
      <div class="idea-title">${Pixl.esc(i.title)}</div>
      ${i.body ? `<div class="idea-body md">${Pixl.markdown(i.body)}</div>` : ""}
      <div class="idea-foot">
        ${voteGroup(i)}
        ${i.is_mine ? `<button class="btn dark" onclick="return deleteIdea(${Number(i.id)})">DELETE</button>` : ""}
      </div>
    </div>`;
}

const ROLE_META = {
  art: { color: "#e8a33d", label: "ART" },
  audio: { color: "#8a6fd8", label: "AUDIO" },
  code: { color: "#52aeb9", label: "CODE" },
  design: { color: "#5fa8e0", label: "DESIGN" },
  writing: { color: "#c96a8f", label: "WRITING" },
};
function roleLabel(r) {
  return ROLE_META[r] ? ROLE_META[r].label : String(r).toUpperCase();
}

function posterThumbHtml(i, roles) {
  if (i.image_url)
    return `<img src="${Pixl.esc(i.image_url)}" alt="" loading="lazy" onerror="this.remove()">`;
  if (roles.length)
    return `<div class="poster-thumb-roles">${roles.slice(0, 3).map((r) => `<span class="poster-thumb-role" style="--role-color:${ROLE_META[r] ? ROLE_META[r].color : "#999"}"><img src="../img/icon-role-${Pixl.esc(r)}.png" alt=""></span>`).join("")}</div>`;
  return `<span class="poster-thumb-none">NO IMAGE</span>`;
}

function posterCard(i) {
  const roles = Array.isArray(i.roles_needed) ? i.roles_needed : [];
  const roleWords = roles.map(roleLabel).join(", ");
  const hours = i.hours_estimate ? `~${Math.round(i.hours_estimate)}H OF WORK NEEDED` : "";
  const applyBtn = i.is_mine
    ? `<button class="btn dark poster-desc-apply" onclick="return deleteIdea(${Number(i.id)})">DELETE</button>`
    : `<button class="btn teal poster-desc-apply" onclick="return applyToIdea(event,${Number(i.id)})">APPLY</button>
       <div class="poster-desc-note">Link up on Slack if the poster reaches out</div>`;
  return `
    <div class="poster-layout" data-id="${Pixl.esc(i.id)}">
      <div class="poster-card">
        <div class="poster-thumb">${posterThumbHtml(i, roles)}</div>
        ${roleWords ? `<div class="poster-seeking">${Pixl.esc(roleWords)}</div>` : ""}
        ${hours ? `<div class="poster-hours">${Pixl.esc(hours)}</div>` : ""}
      </div>
      <div class="panel poster-desc">
        <div class="poster-desc-eyebrow">COLLAB WANTED</div>
        <div class="poster-desc-title">${Pixl.esc(i.title)}</div>
        <div class="poster-desc-meta">posted by <span class="gold">${Pixl.esc(i.author_name)}</span>${i.is_mine ? ' <span class="own-badge">· YOU</span>' : ""} · ${Pixl.timeAgo(i.created_at)}</div>
        ${i.body ? `<div class="poster-desc-body md">${Pixl.markdown(i.body)}</div>` : ""}
        ${roles.length ? `
        <div class="poster-desc-roles-h">ROLES NEEDED</div>
        <div class="poster-desc-roles">
          ${roles.map((r) => `<span class="poster-desc-role" style="--role-color:${ROLE_META[r] ? ROLE_META[r].color : "#999"}"><img src="../img/icon-role-${Pixl.esc(r)}.png" alt="">${roleLabel(r)}</span>`).join("")}
        </div>` : ""}
        ${applyBtn}
      </div>
    </div>`;
}

window.applyToIdea = async function (e, id) {
  e.preventDefault();
  const wrap = document.querySelector(`.poster-layout[data-id="${id}"]`);
  const btn = wrap ? wrap.querySelector(".poster-desc-apply") : null;
  if (btn && btn.disabled) return false;
  if (btn) btn.disabled = true;
  const r = await Pixl.send("POST", "/api/ideas/" + id + "/apply");
  if (r.ok) {
    if (btn) {
      btn.textContent = "APPLIED";
      btn.classList.add("on");
    }
    Pixl.toast("Applied! Link up on Slack once the poster reaches out.");
  } else {
    if (btn) btn.disabled = false;
    const msg = r.error === "own_idea" ? "You can't apply to your own idea."
      : r.error === "not_collab" ? "This idea isn't looking for collaborators."
      : "Couldn't apply right now.";
    Pixl.toast(msg, true);
  }
  return false;
};

window.castVote = async function (e, id, dir) {
  e.preventDefault();
  const card = document.querySelector(`.idea-card[data-id="${id}"]`);
  const upBtn = card ? card.querySelector(".upvote-btn") : null;
  const downBtn = card ? card.querySelector(".downvote-btn") : null;
  if ((upBtn && upBtn.disabled) || (downBtn && downBtn.disabled)) return false;
  if (upBtn) upBtn.disabled = true;
  if (downBtn) downBtn.disabled = true;
  const r = await Pixl.send("POST", "/api/ideas/" + id + "/" + (dir === "up" ? "upvote" : "downvote"));
  if (r.ok) {
    const btn = dir === "up" ? upBtn : downBtn;
    if (btn) {
      btn.classList.add("on");
      const c = btn.querySelector(dir === "up" ? ".uv-count" : ".dv-count");
      if (c) c.textContent = dir === "up" ? r.upvotes : r.downvotes;
    }
  } else {
    if (upBtn) upBtn.disabled = false;
    if (downBtn) downBtn.disabled = false;
    const msg = r.error === "own_idea" ? "You can't vote on your own idea."
      : r.error === "already_upvoted" || r.error === "already_downvoted" ? "You've already voted on this idea."
      : `Couldn't ${dir}vote right now.`;
    Pixl.toast(msg, true);
  }
  return false;
};

window.deleteIdea = async function (id) {
  if (!(await Pixl.confirm({ title: "Delete this idea?", confirmText: "Delete", danger: true }))) return false;
  const r = await Pixl.send("DELETE", "/api/ideas/" + id);
  if (r.ok) {
    const card = document.querySelector(`.idea-card[data-id="${id}"], .poster-layout[data-id="${id}"]`);
    if (card) card.remove();
  } else {
    Pixl.toast("Couldn't delete that idea.", true);
  }
  return false;
};

async function load() {
  view.innerHTML = `<div class="spin"></div>`;
  const params = new URLSearchParams();
  if (q) params.set("q", q);
  if (sort !== "new") params.set("sort", sort);
  const data = await Pixl.api("/api/ideas" + (params.toString() ? "?" + params.toString() : ""));
  const ideas = data.ideas || [];
  view.innerHTML = ideas.length === 0
    ? `<div class="empty-note">NO IDEAS YET, POST THE FIRST ONE!</div>`
    : `<div class="idea-list">${ideas.map((i) => (i.is_collab ? posterCard(i) : ideaCard(i))).join("")}</div>`;
}

document.querySelectorAll("#tabs .tab").forEach((t) => t.addEventListener("click", () => {
  sort = t.dataset.sort;
  document.querySelectorAll("#tabs .tab").forEach((x) => x.classList.toggle("active", x === t));
  load();
}));

const searchInput = document.getElementById("iq");
let searchT;
searchInput.addEventListener("input", () => {
  clearTimeout(searchT);
  searchT = setTimeout(() => { q = searchInput.value.trim(); load(); }, 350);
});

const titleInput = document.getElementById("i-title");
const bodyInput = document.getElementById("i-body");
const countEl = document.getElementById("i-count");
const postBtn = document.getElementById("i-post");
titleInput.addEventListener("input", () => { countEl.textContent = `${titleInput.value.length}/120`; });

// Grows with the text up to max-height (280px, set in CSS), then scrolls —
// stays roomy without letting one huge idea take over the page.
function autoGrow() {
  bodyInput.style.height = "auto";
  bodyInput.style.height = bodyInput.scrollHeight + "px";
}
bodyInput.addEventListener("input", autoGrow);

const collabSwitch = document.getElementById("collab-switch");
const rolePicker = document.getElementById("role-picker");
const hoursRow = document.getElementById("hours-row");
const hoursInput = document.getElementById("i-hours");
const imageRow = document.getElementById("image-row");
const imageBtn = document.getElementById("i-image-btn");
const imageFile = document.getElementById("i-image-file");
const imagePreview = document.getElementById("i-image-preview");
let isCollab = false;
let selectedRoles = new Set();
let pendingImageUrl = null;
let pendingImageUpload = null;

collabSwitch.addEventListener("click", () => {
  isCollab = !isCollab;
  collabSwitch.classList.toggle("on", isCollab);
  rolePicker.hidden = !isCollab;
  hoursRow.hidden = !isCollab;
  imageRow.hidden = !isCollab;
});
rolePicker.querySelectorAll(".role-opt").forEach((opt) => {
  opt.addEventListener("click", () => {
    const role = opt.dataset.role;
    if (selectedRoles.has(role)) selectedRoles.delete(role);
    else selectedRoles.add(role);
    opt.classList.toggle("on");
  });
});

imageBtn.addEventListener("click", () => imageFile.click());
imageFile.addEventListener("change", () => {
  const file = imageFile.files[0];
  if (!file) return;
  imageBtn.disabled = true;
  pendingImageUpload = (async () => {
    pendingImageUrl = await Pixl.upload(file);
    imagePreview.innerHTML = `<img src="${Pixl.esc(pendingImageUrl)}" alt="">`;
    imagePreview.hidden = false;
    imageBtn.textContent = "CHANGE IMAGE";
  })()
    .catch((e) => Pixl.toast(e.message, true))
    .finally(() => {
      imageBtn.disabled = false;
      pendingImageUpload = null;
    });
});

postBtn.addEventListener("click", async () => {
  const title = titleInput.value.trim();
  if (title.length < 3) return Pixl.toast("Give it a title (3+ characters).", true);
  postBtn.disabled = true;
  if (pendingImageUpload) await pendingImageUpload;
  const payload = { title, body: bodyInput.value.trim() };
  if (isCollab) {
    payload.isCollab = true;
    payload.rolesNeeded = [...selectedRoles];
    const hours = Number(hoursInput.value);
    if (hours > 0) payload.hoursEstimate = hours;
    if (pendingImageUrl) payload.imageUrl = pendingImageUrl;
  }
  const r = await Pixl.send("POST", "/api/ideas", payload);
  postBtn.disabled = false;
  if (r.ok) {
    titleInput.value = "";
    bodyInput.value = "";
    bodyInput.style.height = "";
    countEl.textContent = "0/120";
    isCollab = false;
    selectedRoles = new Set();
    collabSwitch.classList.remove("on");
    rolePicker.hidden = true;
    rolePicker.querySelectorAll(".role-opt.on").forEach((o) => o.classList.remove("on"));
    hoursRow.hidden = true;
    hoursInput.value = "";
    imageRow.hidden = true;
    imageFile.value = "";
    imagePreview.hidden = true;
    imagePreview.innerHTML = "";
    imageBtn.textContent = "ADD IMAGE";
    pendingImageUrl = null;
    load();
  } else {
    const msg = r.error === "blocked_content" ? "That idea contains blocked content."
      : r.error === "title_too_short" ? "Give it a title (3+ characters)."
      : "Couldn't post that idea.";
    Pixl.toast(msg, true);
  }
});

if (Pixl.hasToken) load();
</script>
</body>
</html>
