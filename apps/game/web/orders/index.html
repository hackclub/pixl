<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixl · Orders</title>
    <!-- <pixl-preview> -->
    <meta name="description" content="Track the shop orders you've placed with your Pixels.">
    <link rel="canonical" href="https://pixl.hackclub.com/orders/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Pixl">
    <meta property="og:title" content="Pixl · Orders">
    <meta property="og:description" content="Track the shop orders you've placed with your Pixels.">
    <meta property="og:url" content="https://pixl.hackclub.com/orders/">
    <meta property="og:image" content="https://pixl.hackclub.com/orders/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Pixl · Orders">
    <meta name="twitter:description" content="Track the shop orders you've placed with your Pixels.">
    <meta name="twitter:image" content="https://pixl.hackclub.com/orders/og.png">
    <!-- <pixl-preview:end> -->
    <link rel="icon" href="/index.icon.png" />
    <link rel="stylesheet" href="/pixl.css?v=4" />
    <style>
      /* ── order rows: a panel per order with a fulfilment stage tracker ── */
      .orders-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin-top: 22px;
      }
      .order {
        padding: 16px 18px;
        display: flex;
        flex-direction: column;
        gap: 13px;
      }
      .order-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
      }
      .order-name {
        font-family: var(--pixel);
        font-size: 17px;
        letter-spacing: 0.5px;
        color: var(--ink);
      }
      .order-price {
        color: var(--gold);
        font-family: var(--sans);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        font-size: 15px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .order-price img { width: 14px; height: 14px; }
      .order-when { margin-left: auto; color: var(--faint); font-size: 13px; }

      /* stage tracker - dots + connectors, current one lit */
      .track {
        display: flex;
        align-items: flex-start;
        gap: 0;
      }
      .track .step {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        position: relative;
        min-width: 0;
      }
      /* connector line to the next step, drawn from this dot's center rightward */
      .track .step:not(:last-child)::after {
        content: "";
        position: absolute;
        top: 6px;
        left: 50%;
        width: 100%;
        height: 2px;
        background: var(--stroke);
      }
      .track .step.filled:not(:last-child)::after { background: var(--teal); }
      .track .step .bead {
        width: 14px;
        height: 14px;
        border-radius: 0;
        background: var(--panel-deep);
        border: 2px solid var(--stroke);
        position: relative;
        z-index: 1;
      }
      .track .step.filled .bead { background: var(--teal); border-color: var(--teal); }
      .track .step.current .bead {
        background: var(--gold);
        border-color: var(--gold);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--gold) 30%, transparent);
      }
      .track .step .lbl {
        font-family: var(--pixel);
        font-size: 10px;
        letter-spacing: 1px;
        color: var(--faint);
        text-align: center;
      }
      .track .step.filled .lbl { color: var(--dim); }
      .track .step.current .lbl { color: var(--gold); }

      .order-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 13.5px;
        color: var(--dim);
      }
      .order-track {
        font-family: var(--sans);
        font-variant-numeric: tabular-nums;
        color: var(--ink);
        background: var(--panel-deep);
        border: var(--bw) solid var(--stroke);
        border-radius: 0;
        padding: 2px 8px;
        letter-spacing: 0.3px;
      }
      .order.cancelled { opacity: 0.72; }
      .order-note { color: var(--faint); font-size: 13px; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1 class="page-title">YOUR ORDERS</h1>
      <div class="page-sub">
        Everything you've spent pixels on, and where it is in fulfilment. We'll DM you the tracking
        number the moment it ships.
      </div>

      <div class="spin" id="loading"></div>
      <div class="orders-list" id="list"></div>
      <div class="empty-note" id="empty" hidden>
        NO ORDERS YET.<br />HEAD TO THE SHOP AND SPEND SOME OF THOSE HARD-EARNED PIXELS.
      </div>
    </main>

    <script src="/pixl.js?v=6"></script>
    <script>
      Pixl.mountTopbar("orders");
      Pixl.loadWallet();
      const $ = (id) => document.getElementById(id);

      // The happy-path stages in order, plus how each status reads as a badge.
      const STAGES = [
        ["pending", "NEW"],
        ["ordered", "ORDERED"],
        ["credited", "PAID"],
        ["shipped", "SHIPPED"],
        ["done", "DONE"],
      ];
      const BADGE = {
        pending: ["AWAITING", ""],
        ordered: ["ORDERED", "gold"],
        credited: ["PAID", "gold"],
        shipped: ["SHIPPED", "teal"],
        done: ["DELIVERED", "green"],
        cancelled: ["CANCELLED · REFUNDED", "red"],
      };

      function tracker(status) {
        const idx = STAGES.findIndex(([s]) => s === status);
        return `<div class="track">${STAGES.map(([, lbl], i) => {
          const cls = i < idx ? "filled" : i === idx ? "filled current" : "";
          return `<div class="step ${cls}"><span class="bead"></span><span class="lbl">${lbl}</span></div>`;
        }).join("")}</div>`;
      }

      function orderCard(o) {
        const [badgeText, badgeCls] = BADGE[o.status] || ["", ""];
        const badge = `<span class="chip ${badgeCls}">${badgeText}</span>`;
        const option = o.option ? `<span class="chip">${Pixl.esc(o.option)}</span>` : "";
        const when = o.created_at
          ? `<span class="order-when">${Pixl.timeAgo(o.created_at)}</span>`
          : "";

        const body =
          o.status === "cancelled"
            ? `<div class="order-note">Refunded to your wallet.${o.note ? " " + Pixl.esc(o.note) : ""}</div>`
            : tracker(o.status);

        const tracking =
          (o.status === "shipped" || o.status === "done") && o.tracking
            ? `<div class="order-meta">Tracking <span class="order-track">${Pixl.esc(o.tracking)}</span><span class="muted">· DM'd to you</span></div>`
            : "";

        // Cancellable up until it ships - once fulfillment marks it shipped
        // (or it's already done/cancelled) there's nothing left to refund.
        const cancellable = !["shipped", "done", "cancelled"].includes(o.status);
        const cancelBtn = cancellable
          ? `<button class="btn ghost" data-cancel="${o.id}" style="margin-left:auto">CANCEL &amp; REFUND</button>`
          : "";

        return `
      <div class="panel order ${o.status === "cancelled" ? "cancelled" : ""}">
        <div class="order-head">
          <span class="order-name">${Number(o.quantity) > 1 ? `${Number(o.quantity)}× ` : ""}${Pixl.esc(o.item_name || "Item")}</span>
          <span class="order-price"><img src="/img/pixel.png" alt="">${Number(o.price)} PX</span>
          ${badge}${option}${when}
        </div>
        ${body}
        ${tracking}
        ${cancelBtn ? `<div class="order-meta">${cancelBtn}</div>` : ""}
      </div>`;
      }

      async function cancelOrder(id, btn) {
        if (!confirm("Cancel this order and get your pixels back?")) return;
        btn.disabled = true;
        btn.textContent = "CANCELLING…";
        try {
          const r = await Pixl.send("POST", `/api/shop/orders/${id}/cancel`);
          if (!r.ok) {
            Pixl.toast("Couldn't cancel that order, try again.", true);
            btn.disabled = false;
            btn.textContent = "CANCEL & REFUND";
            return;
          }
          Pixl.toast(`Order cancelled, ${r.refunded} pixels refunded.`);
          Pixl.loadWallet();
          boot();
        } catch (e) {
          Pixl.toast("Couldn't cancel that order, try again.", true);
          btn.disabled = false;
          btn.textContent = "CANCEL & REFUND";
        }
      }

      async function boot() {
        if (!Pixl.hasToken) return;
        let orders = [];
        try {
          const data = await Pixl.api("/api/shop/orders");
          orders = data.orders || [];
        } catch (e) {
          if (e.message !== "unauthorized")
            Pixl.toast("Couldn't load your orders right now.", true);
        }
        $("loading").remove();
        if (orders.length === 0) {
          $("empty").hidden = false;
          return;
        }
        $("empty").hidden = true;
        $("list").innerHTML = orders.map(orderCard).join("");
        $("list").querySelectorAll("[data-cancel]").forEach((btn) => {
          btn.addEventListener("click", () => cancelOrder(Number(btn.dataset.cancel), btn));
        });
      }
      boot();
    </script>
  </body>
</html>
