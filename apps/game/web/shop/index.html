<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixl · Shop</title>
    <!-- <pixl-preview> -->
    <meta name="description" content="Spend your Pixels on real, physical rewards.">
    <link rel="canonical" href="https://pixl.hackclub.com/shop/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Pixl">
    <meta property="og:title" content="Pixl · Shop">
    <meta property="og:description" content="Spend your Pixels on real, physical rewards.">
    <meta property="og:url" content="https://pixl.hackclub.com/shop/">
    <meta property="og:image" content="https://pixl.hackclub.com/shop/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Pixl · Shop">
    <meta name="twitter:description" content="Spend your Pixels on real, physical rewards.">
    <meta name="twitter:image" content="https://pixl.hackclub.com/shop/og.png">
    <!-- <pixl-preview:end> -->
    <link rel="icon" href="/index.icon.png" />
    <link rel="stylesheet" href="/pixl.css?v=2" />
    <style>
      /* ── shop hero: a pixel-HUD outpost window ── */
      .shop-hero {
        margin-top: 4px;
        padding: 22px 26px 24px;
      }
      .shop-hero-inner {
        display: flex;
        gap: 24px;
        align-items: center;
        flex-wrap: wrap;
      }
      .shop-title-box {
        text-align: left;
      }
      .open-sign {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-top: 10px;
        font-family: var(--pixel);
        font-size: 12px;
        letter-spacing: 2px;
        color: var(--teal);
      }
      .open-sign .dot { animation: open-blink 1.4s steps(2) infinite; }
      @keyframes open-blink { 50% { opacity: 0.3; } }

      /* ── toolbar + facet chips ── */
      .toolbar {
        display: flex;
        gap: 10px;
        margin: 22px 0 14px;
        flex-wrap: wrap;
      }
      .toolbar input.field {
        flex: 1;
        min-width: 200px;
      }
      .tiers {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }
      .tier {
        font-family: var(--sans);
        font-size: 12.5px;
        letter-spacing: 0.2px;
        font-weight: 700;
        padding: 6px 12px;
        color: var(--faint);
        background: var(--panel);
        border: var(--bw) solid var(--stroke);
        border-radius: 0;
        transition: color 0.13s ease, border-color 0.13s ease, background 0.13s ease;
      }
      .tier:hover { color: var(--ink); border-color: var(--faint); }
      /* explicit, so the selected chip's hover never falls back to a
         same-specificity source-order tie and washes the text into the fill */
      .tier.on:hover { color: var(--btn-ink); border-color: transparent; }
      .tier.on {
        color: var(--btn-ink);
        background: var(--gold);
        border-color: transparent;
      }

      /* ── section headers (two-currency split) ── */
      .shop-section-h {
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
        margin: 8px 0 16px;
      }
      .shop-section-h .t {
        font-family: var(--pixel);
        font-size: 18px;
        letter-spacing: 1px;
        color: var(--gold);
      }
      .shop-section-h.rest .t { color: var(--teal); }
      .shop-section-h .s {
        font-size: 12.5px;
        color: var(--faint);
      }

      /* ── item cards ── */
      .item-card {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 13px 13px 15px;
        position: relative;
      }
      .item-card.limited {
        border-color: var(--gold);
        box-shadow: 0 0 0 1px var(--gold), var(--drop);
      }
      .item-img {
        height: 148px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--img-slot);
        border: var(--bw) solid var(--stroke);
        border-radius: 0;
        overflow: hidden;
        image-rendering: pixelated;
      }
      .item-img .ph {
        width: 40px;
        height: 40px;
        opacity: 0.5;
        background: var(--stroke);
        clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
      }
      .item-img img { max-width: 100%; max-height: 100%; }
      .item-name {
        font-family: var(--pixel);
        font-size: 17px;
        letter-spacing: 0.5px;
        color: var(--ink);
      }
      .item-desc {
        font-size: 14px;
        color: var(--dim);
        line-height: 1.5;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        min-height: 2.7em;
      }
      .item-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: auto;
      }
      .price-wrap {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .price {
        color: var(--gold);
        font-family: var(--sans);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        font-size: 17px;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .price img { width: 16px; height: 16px; }
      .price.cant { color: var(--bad); }
      .price-hours {
        font-family: var(--sans);
        font-size: 10.5px;
        font-weight: 500;
        line-height: 1.4;
        color: var(--faint);
        max-width: 170px;
      }
      .limited-tag {
        position: absolute;
        top: -9px;
        right: 9px;
        background: var(--gold);
        color: var(--btn-ink);
        border-radius: 0;
        font-family: var(--pixel);
        font-size: 10px;
        letter-spacing: 1px;
        padding: 3px 7px;
        animation: limited-blink 1s steps(2) infinite;
      }
      @keyframes limited-blink { 50% { background: var(--gold-soft); } }
      .stock-corner-tag {
        position: absolute;
        top: -9px;
        left: 9px;
        background: var(--teal);
        color: var(--btn-ink);
        border-radius: 0;
        font-family: var(--pixel);
        font-size: 10px;
        letter-spacing: 1px;
        padding: 3px 7px;
      }
      /* Trial-gated item: still shown, but greyed out until unlocked. */
      .item-card.locked {
        filter: saturate(0.45) brightness(0.82);
      }
      .item-card.locked .item-img { opacity: 0.7; }
      .locked-corner-tag {
        position: absolute;
        top: -9px;
        left: 9px;
        background: var(--faint);
        color: var(--btn-ink);
        border-radius: 0;
        font-family: var(--pixel);
        font-size: 10px;
        letter-spacing: 1px;
        padding: 3px 7px;
        z-index: 2;
      }

      /* ── trophies / restoration rewards ── */
      .trophy-card {
        display: flex;
        flex-direction: column;
        gap: 10px;
        position: relative;
        overflow: hidden;
        padding: 13px 13px 15px;
      }
      .trophy-card.locked { filter: saturate(0.5) brightness(0.8); }
      .trophy-card.claimable {
        border-color: var(--teal);
        box-shadow: 0 0 0 1px var(--teal), var(--drop);
        animation: trophy-glow 1.6s ease infinite;
      }
      @keyframes trophy-glow {
        50% { box-shadow: 0 0 0 1px var(--teal-hover), 0 0 16px color-mix(in srgb, var(--teal) 40%, transparent), var(--drop); }
      }
      .trophy-card.claimed {
        border-color: var(--good);
        box-shadow: 0 0 0 1px var(--good), var(--drop);
      }
      .trophy-img { background: var(--img-slot); }
      .trophy-tag {
        position: absolute;
        top: -9px;
        right: 9px;
        font-family: var(--pixel);
        font-size: 10px;
        letter-spacing: 1px;
        padding: 3px 7px;
        border-radius: 0;
        background: var(--panel-deep);
        border: var(--bw) solid var(--stroke);
        color: var(--dim);
      }
      .trophy-tag.ready {
        background: var(--teal);
        color: var(--btn-ink);
        border-color: transparent;
        animation: limited-blink 1s steps(2) infinite;
      }
      .trophy-tag.claimed {
        background: var(--good);
        color: #fff;
        border-color: transparent;
      }
      .trophy-foot { margin-top: auto; }
      .trophy-progress {
        height: 12px;
        border: var(--bw) solid var(--stroke);
        border-radius: 0;
        background: var(--panel-deep);
        overflow: hidden;
      }
      .trophy-progress > div {
        height: 100%;
        background: repeating-linear-gradient(90deg, var(--teal) 0 6px, var(--teal-hover) 6px 12px);
        transition: width 0.5s ease;
      }
      .trophy-need {
        font-size: 13.5px;
        color: var(--faint);
        margin-top: 6px;
      }
      .trophy-need.earned { color: var(--good); }
      .trophy-claim { width: 100%; justify-content: center; }

      /* ── ticker ── */
      .marquee {
        overflow: hidden;
        white-space: nowrap;
        border-top: var(--bw) solid var(--stroke);
        border-bottom: var(--bw) solid var(--stroke);
        background: var(--panel-deep);
        color: var(--faint);
        font-family: var(--pixel);
        font-size: 12px;
        letter-spacing: 2px;
        padding: 8px 0;
        margin-top: 36px;
      }
      .marquee > div { display: inline-block; animation: marquee 30s linear infinite; }
      @keyframes marquee {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
      }
      @media (max-width: 560px) {
        /* same px/s speed as desktop reads much faster on a narrow viewport,
           since less of the track is visible at once - slow it down instead. */
        .marquee > div { animation-duration: 55s; }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="shop-hero hud">
        <div class="shop-hero-inner">
          <div class="shop-title-box">
            <h1 class="page-title">THE PIXL SHOP</h1>
            <div class="page-sub">Stickers · Licenses · Plushies · Hardware, all real</div>
            <div class="open-sign"><span class="dot teal"></span>OPEN · PIXELS ACCEPTED</div>
          </div>
        </div>
      </section>

      <div class="toolbar">
        <input
          class="field"
          id="search"
          type="search"
          placeholder="Search the shelves…"
          autocomplete="off"
        />
        <select class="field" id="sort">
          <option value="featured">FEATURED</option>
          <option value="cheap">PRICE ↑</option>
          <option value="pricey">PRICE ↓</option>
          <option value="name">A–Z</option>
        </select>
        <select class="field" id="region-select" title="Your region: sets which catalog you shop from">
          <option value="US">🇺🇸 US</option>
          <option value="NORTH_AMERICA">🌎 North America</option>
          <option value="SOUTH_AMERICA">🌎 South America</option>
          <option value="EUROPE">🇪🇺 Europe</option>
          <option value="ASIA">🌏 Asia</option>
          <option value="INDIA">🇮🇳 India</option>
          <option value="AFRICA">🌍 Africa</option>
        </select>
      </div>

      <div class="tiers" id="tiers">
        <button class="tier on" data-tier="all">ALL</button>
        <button class="tier" data-tier="afford">AFFORDABLE NOW</button>
        <button class="tier" data-tier="under">UNDER 500</button>
        <button class="tier" data-tier="over">500+</button>
        <button class="tier" id="unlocked-toggle">UNLOCKED ONLY</button>
      </div>

      <div class="tiers" id="categories"></div>

      <div class="spin" id="loading"></div>
      <div id="trophies"></div>
      <div id="shop-list-h" hidden>
        <div class="shop-section-h">
          <span class="t">◆ THE PIXL SHOP</span>
          <span class="s">Spend the pixels you've earned</span>
        </div>
      </div>
      <div class="grid" id="items"></div>
      <div class="empty-note" id="empty" hidden>
        NOTHING ON THE SHELVES YET.<br />SHIP A PROJECT AND CHECK BACK, NEW STOCK DROPS AS THE RESTORATION GOES ON.
      </div>

      <div class="marquee"><div id="marquee-inner"></div></div>
    </main>

    <script src="/pixl.js?v=6"></script>
    <script>
      Pixl.mountTopbar("shop");

      const $ = (id) => document.getElementById(id);
      let items = [];
      let wallet = null;
      let xp = 0;
      let claimedIds = new Set();
      let activeTier = "all";
      let activeCategory = "all";
      let unlockedOnly = false;
      let loadingRegion = false;

      const CATEGORIES = [
        ["all", "ALL"],
        ["grants", "GRANTS"],
        ["merch", "MERCH"],
        ["tech", "TECH"],
        ["printers", "3D PRINTERS"],
        ["software", "SOFTWARE & LICENSES"],
        ["kits", "DIY KITS"],
        ["other", "OTHER"],
      ];
      $("categories").innerHTML = CATEGORIES.map(
        ([v, l]) =>
          `<button class="tier ${v === "all" ? "on" : ""}" data-cat="${v}">${l}</button>`,
      ).join("");

      function basePrice(item) {
        return item.config_options ? Number(item.config_options.base_price) : Number(item.price);
      }

      // Every price is set at the payout floor. Shows a range: hours needed at
      // that floor rate, then hours needed at the ceiling - your lifetime
      // Restoration Energy puts you somewhere between the two.
      function fmtHours(h) {
        const r = Math.round(h * 10) / 10;
        return Number.isInteger(r) ? String(r) : r.toFixed(1);
      }
      // Spells out both rates every time (not just two bare numbers) so it's
      // clear why there are two: hours needed at the payout floor, then hours
      // needed at the ceiling you reach once you've built up Restoration
      // Energy. Both rates come from config so they can't drift from the
      // server's actual payout maths.
      const LO_USD = Pixl.config.economy.basePayoutUsd;
      const HI_USD = Pixl.config.economy.maxPayoutUsd;
      const fmtRate = (usd) => "$" + (Number.isInteger(usd) ? usd : usd.toFixed(2));
      function hoursOf(px) {
        const lo = px / (LO_USD / Pixl.config.economy.pixelValueUsd);
        const hi = (lo * LO_USD) / HI_USD;
        return `${fmtHours(lo)}h at ${fmtRate(LO_USD)}/h → ${fmtHours(hi)}h at ${fmtRate(HI_USD)}/h`;
      }

      function isTrophy(item) {
        return Number(item.unlock_xp) > 0;
      }
      function trophyState(item) {
        if (claimedIds.has(item.id)) return "claimed";
        return xp >= Number(item.unlock_xp) ? "claimable" : "locked";
      }

      // No-op: the shopkeeper avatar + speech bubble were removed from the
      // hero. Kept as a stub so callers (e.g. the trophy-claim celebration)
      // don't need their own guard.
      function say() {}

      function canAfford(item) {
        return wallet && wallet.pixels >= basePrice(item);
      }

      // Newly-stocked-region items whose price research came back empty for
      // that region — still shown in the catalog, just not buyable yet. Also
      // covers configurable items (Framework) that aren't sold in a region:
      // there the top-level price is 0 even though config_options exists.
      function isPending(item) {
        return Number(item.price) <= 0;
      }

      function tierMatch(item) {
        if (activeTier === "afford") return canAfford(item);
        if (activeTier === "under") return basePrice(item) < 500;
        if (activeTier === "over") return basePrice(item) >= 500;
        return true;
      }

      function categoryMatch(item) {
        return activeCategory === "all" || (item.category || "other") === activeCategory;
      }

      function imgHtml(item, big = false) {
        const url = String(item.image_url || "");
        if (!url) return `<span class="ph"></span>`;
        return `<img src="${Pixl.esc(url)}" alt="" loading="lazy" onerror="this.outerHTML='<span class=ph></span>'">`;
      }

      function trophyCard(item) {
        const state = trophyState(item);
        const need = Number(item.unlock_xp);
        const pct = Math.max(0, Math.min(100, (xp / Math.max(1, need)) * 100));
        const badge =
          state === "claimed"
            ? `<div class="trophy-tag claimed">CLAIMED</div>`
            : state === "claimable"
              ? `<div class="trophy-tag ready">CLAIM ME!</div>`
              : `<div class="trophy-tag">LEVEL ${need}</div>`;
        const foot =
          state === "locked"
            ? `<div class="trophy-progress"><div style="width:${pct}%"></div></div>
       <div class="trophy-need">LEVEL ${Math.floor(xp)} / ${need} · keep shipping!</div>`
            : state === "claimable"
              ? `<button class="btn teal trophy-claim" data-claim="${item.id}">CLAIM</button>`
              : `<div class="trophy-need earned">Yours forever.</div>`;
        return `
    <div class="card panel trophy-card ${state}" data-id="${item.id}" title="Level ${need} trophy">
      ${badge}
      <div class="item-img trophy-img">${imgHtml(item)}</div>
      <div class="item-name">${Pixl.esc(item.name)}</div>
      <div class="item-desc">${Pixl.esc(Pixl.bbstrip(item.description || ""))}</div>
      <div class="trophy-foot">${foot}</div>
    </div>`;
      }

      function render() {
        const q = $("search").value.trim().toLowerCase();
        const sort = $("sort").value;
        const match = (i) =>
          !q ||
          String(i.name).toLowerCase().includes(q) ||
          String(i.description || "")
            .toLowerCase()
            .includes(q);

        const trophies = items
          .filter((i) => isTrophy(i) && match(i))
          .filter((i) => !unlockedOnly || trophyState(i) !== "locked");
        let list = items.filter(
          (i) => !isTrophy(i) && match(i) && tierMatch(i) && categoryMatch(i),
        );
        if (sort === "cheap")
          list = [...list].sort((a, b) => basePrice(a) - basePrice(b));
        else if (sort === "pricey")
          list = [...list].sort((a, b) => basePrice(b) - basePrice(a));
        else if (sort === "name")
          list = [...list].sort((a, b) =>
            String(a.name).localeCompare(String(b.name)),
          );

        $("trophies").innerHTML =
          trophies.length === 0
            ? ""
            : `<div class="shop-section-h rest">
         <span class="t">✦ RESTORATION REWARDS</span>
         <span class="s">Earned by leveling up, not for sale</span>
       </div>
     <div class="grid">${trophies.map(trophyCard).join("")}</div>
     <div class="divider"></div>`;

        $("shop-list-h").hidden = list.length === 0;
        $("empty").hidden = list.length + trophies.length > 0;
        $("items").innerHTML = list
          .map(
            (item, idx) => `
    <div class="card panel item-card ${item.limited ? "limited" : ""} ${item.locked ? "locked" : ""}" data-id="${item.id}" style="animation: toast-in .2s ease both; animation-delay:${Math.min(idx * 30, 400)}ms">
      ${item.locked && !item.unlockPending ? `<div class="locked-corner-tag">🔒 LOCKED</div>` : ""}
      ${item.limited ? `<div class="limited-tag">LIMITED</div>` : ""}
      ${item.stock && item.stock.length ? `<div class="stock-corner-tag">${item.stock[0].total} ONLY</div>` : ""}
      <div class="item-img">${imgHtml(item)}</div>
      <div class="item-name">${Pixl.esc(item.name)}</div>
      <div class="item-desc">${Pixl.esc(Pixl.bbstrip(item.description || ""))}</div>
      <div class="item-foot">
        ${
          item.locked && item.unlockPending
            ? `<div class="price-wrap"><span class="price cant">NOT AVAILABLE</span><span class="price-hours">Available soon</span></div>`
            : item.locked
            ? `<div class="price-wrap"><span class="price cant">🔒 LOCKED</span><span class="price-hours">Ship ${item.unlock_trials && item.unlock_trials.length ? item.unlock_trials.map((t) => `“${Pixl.esc(t)}”`).join(" or ") : "the required Trial"} to unlock this</span></div>`
            : isPending(item)
            ? `<div class="price-wrap"><span class="price cant">NOT AVAILABLE</span><span class="price-hours">Coming soon to this region</span></div>`
            : `<div class="price-wrap">
          <span class="price ${canAfford(item) ? "" : "cant"}"><img src="/img/pixel.png" alt="">${item.config_options ? `FROM ${basePrice(item).toLocaleString()}` : basePrice(item).toLocaleString()} PX</span>
          <span class="price-hours">${hoursOf(basePrice(item))}</span>
        </div>
        <span class="dot ${canAfford(item) ? "on" : "off"}" title="${canAfford(item) ? "You can afford this" : "Keep shipping!"}"></span>`
        }
      </div>
    </div>`,
          )
          .join("");

        for (const card of $("trophies").querySelectorAll(".card")) {
          card.addEventListener("click", (e) => {
            if (e.target.closest("[data-claim]")) return;
            location.href = `/shop/item?id=${card.dataset.id}`;
          });
        }
        for (const btn of $("trophies").querySelectorAll("[data-claim]")) {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            claimTrophy(Number(btn.dataset.claim));
          });
        }
        for (const card of $("items").querySelectorAll(".card")) {
          card.addEventListener("click", () => {
            location.href = `/shop/item?id=${card.dataset.id}`;
          });
        }
      }

      async function claimTrophy(id) {
        const r = await Pixl.send("POST", `/api/shop/claim/${id}`);
        if (r.ok && r.claimed) {
          claimedIds.add(id);
          Pixl.toast("🏆 TROPHY CLAIMED! The team will reach out.");
          say("A LEGEND CLAIMS THEIR PRIZE!", 4000);
          render();
        } else if (r.error === "not_eligible") {
          Pixl.toast(
            `Not yet, you're at ${Math.floor(r.xp)} / ${r.need} XP.`,
            true,
          );
        } else {
          Pixl.toast("Couldn't claim that right now.", true);
        }
      }

      $("search").addEventListener("input", render);
      $("sort").addEventListener("change", render);

      $("tiers").addEventListener("click", (e) => {
        const b = e.target.closest(".tier");
        if (!b) return;
        if (b.id === "unlocked-toggle") {
          unlockedOnly = !unlockedOnly;
          b.classList.toggle("on", unlockedOnly);
          render();
          return;
        }
        activeTier = b.dataset.tier;
        for (const t of $("tiers").querySelectorAll(".tier[data-tier]"))
          t.classList.toggle("on", t === b);
        render();
      });

      $("categories").addEventListener("click", (e) => {
        const b = e.target.closest(".tier");
        if (!b) return;
        activeCategory = b.dataset.cat;
        for (const t of $("categories").querySelectorAll(".tier"))
          t.classList.toggle("on", t === b);
        render();
      });

      async function loadItems() {
        try {
          const data = await Pixl.api("/api/shop/items");
          items = (data.items || []).map((i) => ({
            ...i,
            id: Number(i.id),
            price: Number(i.price),
            unlock_xp: Number(i.unlock_xp || 0),
          }));
          xp = Number(data.xp || 0);
          claimedIds = new Set((data.claimed || []).map(Number));
          if (data.region) $("region-select").value = data.region;
        } catch (e) {
          if (e.message !== "unauthorized")
            Pixl.toast("Couldn't reach the shop server.", true);
        }
        render();
        const names =
          items
            .filter((i) => !isTrophy(i))
            .map((i) => `${Pixl.esc(i.name)} · ${i.config_options ? "FROM " : ""}${basePrice(i)} PX`)
            .join("  ◆  ") || "THE SHELVES ARE BARE TODAY";
        $("marquee-inner").innerHTML =
          `<span>${names}  ◆  ${names}  ◆  </span>`;
      }

      async function boot() {
        if (!Pixl.hasToken) return;
        wallet = await Pixl.loadWallet();
        await loadItems();
        $("loading").remove();
        if (wallet)
          say(`HEY! YOU'VE GOT ${Math.round(wallet.pixels)} PX TO BURN.`, 5000);
      }
      boot();

      $("region-select").addEventListener("change", async (e) => {
        if (loadingRegion) return;
        loadingRegion = true;
        const region = e.target.value;
        e.target.disabled = true;
        const label = e.target.selectedOptions[0]?.textContent || region;
        const r = await Pixl.send("POST", "/api/shop/region", { region });
        if (r.ok) {
          say(`SWITCHED TO ${label}. NEW SHELVES!`, 3500);
          await loadItems();
        } else {
          Pixl.toast("Couldn't switch region.", true);
          await loadItems(); // resync the dropdown to whatever the server has
        }
        e.target.disabled = false;
        loadingRegion = false;
      });
    </script>
  </body>
</html>
