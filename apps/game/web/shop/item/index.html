<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixl · Shop</title>
    <!-- <pixl-preview> -->
    <meta name="description" content="A closer look at a Pixl shop item.">
    <link rel="canonical" href="https://pixl.hackclub.com/shop/item/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Pixl">
    <meta property="og:title" content="Pixl · Shop">
    <meta property="og:description" content="A closer look at a Pixl shop item.">
    <meta property="og:url" content="https://pixl.hackclub.com/shop/item/">
    <meta property="og:image" content="https://pixl.hackclub.com/shop/item/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Pixl · Shop">
    <meta name="twitter:description" content="A closer look at a Pixl shop item.">
    <meta name="twitter:image" content="https://pixl.hackclub.com/shop/item/og.png">
    <!-- <pixl-preview:end> -->
    <link rel="icon" href="/index.icon.png" />
    <link rel="stylesheet" href="/pixl.css?v=2" />
    <style>
      /* back link */
      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin: 4px 0 16px;
        font-family: var(--pixel);
        font-size: 13px;
        letter-spacing: 1px;
        color: var(--faint);
      }
      .back-link:hover { color: var(--teal); }

      /* ── item detail ── */
      .detail-card { padding: 22px 24px 24px; }
      #detail-img {
        width: 300px;
        height: 300px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--img-slot);
        border: var(--bw) solid var(--stroke);
        border-radius: 0;
        overflow: hidden;
        image-rendering: pixelated;
      }
      #detail-img img { max-width: 100%; max-height: 100%; }
      #detail-img .ph {
        width: 56px;
        height: 56px;
        opacity: 0.5;
        background: var(--stroke);
        clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
      }
      .detail-row { display: flex; gap: 28px; flex-wrap: wrap; }
      .detail-info {
        flex: 1;
        min-width: 260px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      #detail-name {
        font-family: var(--pixel);
        font-size: 28px;
        letter-spacing: 0.5px;
        color: var(--gold);
      }
      #detail-desc {
        font-size: 15px;
        line-height: 1.7;
        color: var(--ink);
        white-space: pre-wrap;
      }
      .price {
        color: var(--gold);
        font-family: var(--sans);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        font-size: 22px;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 7px;
      }
      .price img { width: 20px; height: 20px; }
      .price.cant { color: var(--bad); }
      .price-hours {
        display: block;
        width: 100%;
        font-family: var(--sans);
        font-size: 12px;
        font-weight: 500;
        line-height: 1.4;
        color: var(--faint);
        margin-top: 2px;
      }
      .options-row { display: flex; gap: 8px; flex-wrap: wrap; }
      .qty-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .qty-label {
        font-family: var(--pixel);
        font-size: 13px;
        letter-spacing: 1px;
        color: var(--dim);
      }
      .qty-stepper {
        display: flex;
        align-items: center;
        gap: 0;
        border: var(--bw) solid var(--stroke);
        border-radius: 0;
        overflow: hidden;
      }
      .qty-stepper button {
        width: 32px;
        height: 32px;
        border: none;
        background: var(--panel-2);
        color: var(--ink);
        font-family: var(--pixel);
        font-size: 16px;
        cursor: pointer;
      }
      .qty-stepper button:hover:not(:disabled) { background: var(--panel-deep); }
      .qty-stepper button:disabled { opacity: 0.4; cursor: default; }
      .qty-stepper input {
        width: 44px;
        height: 32px;
        border: none;
        border-left: var(--bw) solid var(--stroke);
        border-right: var(--bw) solid var(--stroke);
        background: var(--panel-deep);
        color: var(--ink);
        font-family: var(--sans);
        font-weight: 700;
        text-align: center;
        font-size: 14px;
        appearance: textfield;
        -moz-appearance: textfield;
      }
      .qty-stepper input::-webkit-outer-spin-button,
      .qty-stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
      .opt-group { display: flex; flex-direction: column; gap: 6px; }
      .opt-group-name {
        font-family: var(--pixel);
        font-size: 13px;
        letter-spacing: 1px;
        color: var(--dim);
      }
      .opt-choices { display: flex; gap: 9px; flex-wrap: wrap; }
      .opt-choice {
        user-select: none;
        font-size: 15px;
        padding: 10px 16px;
      }
      .opt-choice.on {
        color: var(--btn-ink);
        background: var(--gold);
        border-color: transparent;
      }
      .opt-choice.sold-out {
        opacity: 0.4;
        cursor: default;
        text-decoration: line-through;
      }
      .stock-tag { opacity: 0.75; font-size: 0.85em; }
      .opt-choice.on .stock-tag { opacity: 0.85; }
      .cfg-delta { opacity: 0.7; font-size: 0.9em; }
      .opt-choice.on .cfg-delta { opacity: 0.85; }
      .note-row { display: flex; flex-direction: column; gap: 6px; }
      .note-row textarea {
        resize: vertical;
        min-height: 44px;
        max-height: 120px;
        border: var(--bw) solid var(--stroke);
        border-radius: 0;
        background: var(--panel-deep);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 13px;
        padding: 8px 10px;
      }
      .cfg-ref-note {
        font-size: 13px;
        color: var(--dim);
        background: var(--panel-2);
        border: var(--bw) solid var(--stroke);
        border-radius: 0;
        padding: 9px 12px;
        margin-bottom: 4px;
      }
      .cfg-ref-note a { color: var(--gold); text-decoration: underline; }
      .afford-bar {
        height: 14px;
        border: var(--bw) solid var(--stroke);
        border-radius: 0;
        background: var(--panel-deep);
        overflow: hidden;
      }
      .afford-bar > div {
        height: 100%;
        background: repeating-linear-gradient(90deg, var(--gold) 0 7px, var(--gold-soft) 7px 14px);
        transition: width 0.3s ease;
      }
      .btn-row { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <a class="back-link" href="/shop/">← BACK TO SHOP</a>

      <div class="spin" id="loading"></div>

      <div class="empty-note" id="notfound" hidden>
        CAN'T FIND THAT ITEM.<br />IT MAY HAVE SOLD OUT OR VANISHED.
        <div style="margin-top: 14px"><a class="btn dark" href="/shop/">BACK TO THE SHELVES</a></div>
      </div>

      <div id="detail" hidden>
        <section class="hud detail-card">
          <div class="detail-row">
            <div id="detail-img"></div>
            <div class="detail-info">
              <div id="detail-name"></div>
              <div id="detail-limited"></div>
              <div class="price" id="detail-price"></div>
              <div id="detail-desc"></div>
              <div class="options-row" id="detail-options"></div>
              <div class="note-row" id="note-row" hidden>
                <label
                  class="qty-label"
                  for="note-input"
                  >NOTE TO FULFILLER (OPTIONAL)</label
                >
                <textarea
                  id="note-input"
                  maxlength="300"
                  rows="2"
                  placeholder="anything the person shipping this should know..."
                ></textarea>
              </div>
              <div>
                <div
                  class="muted"
                  style="font-size: 13px; margin-bottom: 6px; font-family: var(--sans); font-weight: 700; letter-spacing: 0.2px"
                  id="afford-label"
                ></div>
                <div class="afford-bar"><div id="afford-fill"></div></div>
              </div>
              <div class="qty-row" id="qty-row" hidden>
                <span class="qty-label">QTY</span>
                <div class="qty-stepper">
                  <button type="button" id="qty-minus">-</button>
                  <input id="qty-input" type="number" min="1" max="999" step="1" value="1" inputmode="numeric" />
                  <button type="button" id="qty-plus">+</button>
                </div>
              </div>
              <div class="btn-row">
                <button class="btn" id="buy-btn">BUY</button>
                <button class="btn dark" id="save-btn" hidden>☆ SAVE</button>
                <a class="btn dark" href="/shop/">KEEP BROWSING</a>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script src="/pixl.js?v=6"></script>
    <script>
      Pixl.mountTopbar("shop");

      const $ = (id) => document.getElementById(id);
      const itemId = Number(new URLSearchParams(location.search).get("id"));
      let selected = null;
      let wallet = null;
      let xp = 0;
      let claimedIds = new Set();
      let buying = false;
      let optionPick = {};
      let configPick = {};
      let quantity = 1;
      let saved = false;

      function clampQty(n) {
        n = Math.round(Number(n));
        if (!Number.isFinite(n)) return 1;
        return Math.max(1, Math.min(999, n));
      }
      function setQty(n) {
        quantity = clampQty(n);
        $("qty-input").value = quantity;
        $("qty-minus").disabled = quantity <= 1;
        $("qty-plus").disabled = quantity >= 999;
        // Not a full renderDetail() — that resets optionPick back to each
        // group's first choice, which would silently undo a picked option
        // (e.g. "Gabin") every time the quantity stepper is touched.
        if (selected && !isTrophy(selected) && !selected.config_options) updatePlainPriceUI();
      }

      // ── real price-varying configurator (Framework 13/16 DIY etc.) ──
      function computeConfigPrice(item, picks) {
        const cfg = item.config_options;
        if (!cfg) return Number(item.price);
        let total = Number(cfg.base_price) || 0;
        for (const g of cfg.groups || []) {
          if (g.type === "multi") {
            const chosen = new Set(picks[g.name] || []);
            for (const c of g.choices) if (chosen.has(c.label)) total += Number(c.price) || 0;
          } else {
            const pick = picks[g.name] ?? g.choices[0]?.label;
            const c = g.choices.find((c) => c.label === pick) ?? g.choices[0];
            total += Number(c?.price) || 0;
          }
        }
        return total;
      }

      function renderConfigurator() {
        const cfg = selected.config_options;
        const refNote = cfg.reference_url
          ? `<div class="cfg-ref-note">Want the exact spec sheet (all language/layout variants, full details)? <a href="${Pixl.esc(cfg.reference_url)}" target="_blank" rel="noopener">Check the real configurator ↗</a> then pick the matching options below.</div>`
          : "";
        $("detail-options").innerHTML =
          refNote +
          cfg.groups
            .map((g) => {
              const isMulti = g.type === "multi";
              const chosen = isMulti
                ? new Set(configPick[g.name] || [])
                : new Set([configPick[g.name] ?? g.choices[0]?.label]);
              const chips = g.choices
                .map((c) => {
                  const on = chosen.has(c.label);
                  const priceTag = c.price ? ` <span class="cfg-delta">+${c.price}px</span>` : "";
                  return `<span class="chip opt-choice ${on ? "on" : ""}" data-g="${Pixl.esc(g.name)}" data-c="${Pixl.esc(c.label)}" ${isMulti ? 'data-multi="1"' : ""}>${Pixl.esc(c.label)}${priceTag}</span>`;
                })
                .join("");
              return `<div class="opt-group"><div class="opt-group-name">${Pixl.esc(g.name.toUpperCase())}${isMulti ? " (pick any)" : ""}</div><div class="opt-choices">${chips}</div></div>`;
            })
            .join("");
        for (const chip of $("detail-options").querySelectorAll(".opt-choice")) {
          chip.addEventListener("click", () => {
            const g = chip.dataset.g;
            const c = chip.dataset.c;
            if (chip.dataset.multi) {
              const set = new Set(configPick[g] || []);
              if (set.has(c)) set.delete(c);
              else set.add(c);
              configPick[g] = [...set];
            } else {
              configPick[g] = c;
            }
            renderConfigurator();
            updateConfigPriceUI();
            if (saved) saveCurrent();
          });
        }
      }

      // A config choice may carry its own `image` (e.g. the A1 vs A1 Combo). When
      // one is picked, swap the detail image to it; otherwise keep the item's own.
      function updateConfigImage() {
        const cfg = selected.config_options;
        if (!cfg || !Array.isArray(cfg.groups)) return;
        let img = null;
        for (const g of cfg.groups) {
          if (g.type === "multi") continue;
          const pickedLabel = configPick[g.name] ?? g.choices[0]?.label;
          const choice = (g.choices || []).find((c) => c.label === pickedLabel);
          if (choice && choice.image) img = choice.image;
        }
        const url = img || selected.image_url || "";
        $("detail-img").innerHTML = url
          ? `<img src="${Pixl.esc(url)}" alt="" onerror="this.outerHTML='<span class=ph></span>'">`
          : `<span class="ph"></span>`;
      }

      function updateConfigPriceUI() {
        updateConfigImage();
        const price = computeConfigPrice(selected, configPick);
        const afford = wallet && wallet.pixels >= price;
        $("detail-price").innerHTML =
          `<img src="/img/pixel.png" style="width:20px;height:20px" alt="">${price.toLocaleString()} PIXELS<span class="price-hours">${hoursOf(price)}</span>`;
        $("detail-price").classList.toggle("cant", !afford);
        $("buy-btn").disabled = !afford;
        $("buy-btn").textContent = "BUY";
        const have = wallet ? wallet.pixels : 0;
        const pct = Math.max(0, Math.min(100, (have / Math.max(1, price)) * 100));
        $("afford-fill").style.width = pct + "%";
        $("afford-fill").style.background =
          pct >= 100
            ? "var(--good)"
            : "repeating-linear-gradient(90deg,var(--gold) 0 7px,var(--gold-soft) 7px 14px)";
        $("afford-label").textContent =
          `YOU HAVE ${Math.round(have)} / ${price.toLocaleString()} PX` + (pct >= 100 ? ", EASY." : "");
      }

      function optionGroups(item) {
        const named = [];
        const loose = [];
        for (const raw of Array.isArray(item.options) ? item.options : []) {
          const o = String(raw);
          const idx = o.indexOf(":");
          if (idx > 0) {
            const name = o.slice(0, idx).trim();
            const choices = o
              .slice(idx + 1)
              .split(",")
              .map((s) => s.trim())
              .filter(Boolean);
            if (choices.length) named.push({ name, choices });
          } else if (o.trim()) {
            loose.push(o.trim());
          }
        }
        if (loose.length) named.unshift({ name: "", choices: loose });
        return named;
      }

      // Per-choice live stock (e.g. 12/15 "Ridit" Signed Org Photos left),
      // keyed by the raw choice label. Empty map for items with no pool.
      function stockMap(item) {
        const m = new Map();
        for (const s of Array.isArray(item && item.stock) ? item.stock : []) m.set(s.choice, s);
        return m;
      }
      // The option group whose choices are all stock-tracked, if any — that's
      // the group that gets remaining counts and sold-out chips.
      function stockGroupIndex(groups, stock) {
        if (!stock.size) return -1;
        return groups.findIndex((g) => g.choices.length && g.choices.every((c) => stock.has(c)));
      }
      function firstAvailableChoice(choices, stock) {
        return choices.find((c) => !stock.has(c) || stock.get(c).remaining > 0) ?? choices[0];
      }

      function optionSummary() {
        if (!selected) return "";
        if (selected.config_options) {
          return (selected.config_options.groups || [])
            .map((g) => {
              if (g.type === "multi") {
                const picks = configPick[g.name] || [];
                return picks.length ? `${g.name}: ${picks.join(", ")}` : null;
              }
              const pick = configPick[g.name] ?? g.choices[0]?.label;
              return `${g.name}: ${pick}`;
            })
            .filter(Boolean)
            .join(" · ");
        }
        return optionGroups(selected)
          .map((g, gi) => {
            const pick = optionPick[gi] ?? g.choices[0];
            return g.name ? `${g.name}: ${pick}` : pick;
          })
          .join(" · ");
      }

      function renderOptions() {
        const groups = optionGroups(selected);
        const stock = stockMap(selected);
        const sGroupIdx = stockGroupIndex(groups, stock);
        $("detail-options").innerHTML = groups
          .map((g, gi) => {
            const isStockGroup = gi === sGroupIdx;
            let pick = optionPick[gi] ?? g.choices[0];
            if (isStockGroup) {
              const cur = stock.get(pick);
              if (cur && cur.remaining <= 0) pick = firstAvailableChoice(g.choices, stock);
            }
            optionPick[gi] = pick;
            const chips = g.choices
              .map((c) => {
                const s = isStockGroup ? stock.get(c) : null;
                const soldOut = !!s && s.remaining <= 0;
                const tag = s ? ` <span class="stock-tag">${soldOut ? "SOLD OUT" : `${s.remaining} LEFT`}</span>` : "";
                return `<span class="chip opt-choice ${c === pick ? "on" : ""} ${soldOut ? "sold-out" : ""}" data-g="${gi}" data-c="${Pixl.esc(c)}">${Pixl.esc(c.toUpperCase())}${tag}</span>`;
              })
              .join("");
            const label = g.name
              ? `<div class="opt-group-name">${Pixl.esc(g.name.toUpperCase())}</div>`
              : "";
            return `<div class="opt-group">${label}<div class="opt-choices">${chips}</div></div>`;
          })
          .join("");
        for (const chip of $("detail-options").querySelectorAll(".opt-choice:not(.sold-out)")) {
          chip.addEventListener("click", () => {
            optionPick[Number(chip.dataset.g)] = chip.dataset.c;
            renderOptions();
            updatePlainPriceUI();
          });
        }
      }

      // Whether the currently picked stock-tracked choice (if any) can cover
      // the requested quantity — used to grey out BUY on top of affordability.
      function stockOk() {
        const groups = optionGroups(selected);
        const stock = stockMap(selected);
        const sGroupIdx = stockGroupIndex(groups, stock);
        if (sGroupIdx === -1) return true;
        const pick = optionPick[sGroupIdx];
        const s = stock.get(pick);
        return !s || s.remaining >= quantity;
      }

      function isTrophy(item) {
        return Number(item.unlock_xp) > 0;
      }
      function trophyState(item) {
        if (claimedIds.has(item.id)) return "claimed";
        return xp >= Number(item.unlock_xp) ? "claimable" : "locked";
      }
      function canAfford(item) {
        const p = item.config_options ? Number(item.config_options.base_price) : Number(item.price);
        return wallet && wallet.pixels >= p;
      }

      // Spells out both rates every time (not just two bare numbers) so it's
      // clear why there are two: hours needed at the payout floor, then hours
      // needed at the ceiling you reach once you've built up Restoration
      // Energy. Both rates come from config so they can't drift from the
      // server's actual payout maths.
      function fmtHours(h) {
        const r = Math.round(h * 10) / 10;
        return Number.isInteger(r) ? String(r) : r.toFixed(1);
      }
      const LO_USD = Pixl.config.economy.basePayoutUsd;
      const HI_USD = Pixl.config.economy.maxPayoutUsd;
      const fmtRate = (usd) => "$" + (Number.isInteger(usd) ? usd : usd.toFixed(2));
      function hoursOf(px) {
        const lo = px / (LO_USD / Pixl.config.economy.pixelValueUsd);
        const hi = (lo * LO_USD) / HI_USD;
        return `${fmtHours(lo)}h at ${fmtRate(LO_USD)}/h → ${fmtHours(hi)}h at ${fmtRate(HI_USD)}/h`;
      }
      function imgHtml(item) {
        const url = String(item.image_url || "");
        if (!url) return `<span class="ph"></span>`;
        return `<img src="${Pixl.esc(url)}" alt="" onerror="this.outerHTML='<span class=ph></span>'">`;
      }

      // The shopkeeper mascot/speech-bubble strip was removed from this page;
      // these stay as no-ops so the many existing call sites don't need editing.
      function say() {}
      function nudgeKeeper() {}

      function renderDetail() {
        $("detail-img").innerHTML = imgHtml(selected);
        $("detail-name").textContent = selected.name;
        $("detail-desc").innerHTML = Pixl.bbcode(selected.description || "");
        document.title = `Pixl · ${selected.name}`;

        $("qty-row").hidden = true;
        $("note-row").hidden = true;
        $("save-btn").hidden = isTrophy(selected);
        updateSaveBtn();

        if (isTrophy(selected)) {
          $("detail-options").innerHTML = optionGroups(selected)
            .flatMap((g) => g.choices)
            .map((o) => `<span class="chip teal">${Pixl.esc(o.toUpperCase())}</span>`)
            .join("");
          const state = trophyState(selected);
          const need = Number(selected.unlock_xp);
          const pct = Math.max(0, Math.min(100, (xp / Math.max(1, need)) * 100));
          $("detail-limited").innerHTML =
            `<span class="chip ${state === "locked" ? "" : "teal"}">LEVEL ${need} TROPHY, EARNED, NOT BOUGHT</span>`;
          $("detail-price").innerHTML =
            state === "claimed"
              ? "CLAIMED"
              : state === "claimable"
                ? "READY TO CLAIM!"
                : `LOCKED, REACH ${need} XP`;
          $("detail-price").classList.toggle("cant", state === "locked");
          $("afford-fill").style.width = pct + "%";
          $("afford-fill").style.background =
            pct >= 100
              ? "var(--good)"
              : "repeating-linear-gradient(90deg,var(--teal) 0 7px,var(--teal-hover) 7px 14px)";
          $("afford-label").textContent =
            `YOU'RE AT ${Math.floor(xp)} / ${need} XP` +
            (pct >= 100 ? ", EARNED!" : `  ·  ${need - Math.floor(xp)} to go`);
          $("buy-btn").textContent =
            state === "claimed" ? "CLAIMED" : state === "claimable" ? "CLAIM" : "LOCKED";
          $("buy-btn").disabled = state !== "claimable";
          $("buy-btn").classList.toggle("teal", state === "claimable");
          say(
            state === "claimable"
              ? "YOU EARNED THAT ONE!"
              : state === "claimed"
                ? "A TRUE LEGEND."
                : "SHIP MORE TO EARN IT!",
            5000,
          );
          return;
        }

        $("buy-btn").classList.remove("teal");

        // Trial-gated item: locked until the player ships one of the unlocking
        // Trials (server also rejects a locked buy with error "locked").
        // unlockPending means none of the gating Trials are live yet (e.g. a
        // placeholder Trial for a region that hasn't launched) - nothing for
        // the player to actually go do, so this reads as "coming soon"
        // instead of a lock with a call to action.
        if (selected.locked && selected.unlockPending) {
          $("detail-options").innerHTML = "";
          $("detail-limited").innerHTML = "";
          $("detail-price").innerHTML = "NOT AVAILABLE";
          $("detail-price").classList.add("cant");
          $("buy-btn").textContent = "NOT AVAILABLE";
          $("buy-btn").disabled = true;
          $("afford-fill").style.width = "0%";
          $("afford-label").textContent = "Available soon.";
          return;
        }

        if (selected.locked) {
          $("detail-options").innerHTML = "";
          $("detail-limited").innerHTML = "";
          $("detail-price").innerHTML = "🔒 LOCKED";
          $("detail-price").classList.add("cant");
          $("buy-btn").textContent = "LOCKED";
          $("buy-btn").disabled = true;
          $("afford-fill").style.width = "0%";
          const trials = (selected.unlock_trials || []).map((t) => `"${t}"`).join(" or ");
          $("afford-label").textContent = `Ship the ${trials || "required"} Trial to unlock this.`;
          say("SHIP THE RIGHT TRIAL AND THIS UNLOCKS.", 5000);
          return;
        }

        if (selected.config_options) {
          // Configurable item not sold in this region: top-level price is 0
          // (buy_shop_item also rejects price<=0 as not_for_sale). Show the
          // NOT AVAILABLE state instead of a buildable configurator.
          if (Number(selected.price) <= 0) {
            $("detail-options").innerHTML = "";
            $("detail-limited").innerHTML = "";
            $("detail-price").innerHTML = "NOT AVAILABLE";
            $("detail-price").classList.add("cant");
            $("buy-btn").textContent = "NOT AVAILABLE YET";
            $("buy-btn").disabled = true;
            $("afford-fill").style.width = "0%";
            $("afford-label").textContent = "Coming soon to this region.";
            say("NOT SOLD IN YOUR REGION… YET.", 5000);
            return;
          }
          // Restore a saved build (see toggleSave / saveCurrent) instead of
          // resetting to the first choice of every group on each visit.
          configPick = { ...(selected.saved_config || {}) };
          renderConfigurator();
          $("note-row").hidden = false;
          $("detail-limited").innerHTML =
            `<span class="chip gold">FULLY CUSTOM, PRICE UPDATES AS YOU PICK</span>`;
          updateConfigPriceUI();
          say("LET'S BUILD YOUR DREAM MACHINE.", 5000);
          return;
        }

        optionPick = {};
        renderOptions();
        $("note-row").hidden = false;
        $("detail-limited").innerHTML =
          (selected.limited ? `<span class="chip red">LIMITED, ${Pixl.countdown(selected.limited_until)}</span>` : "") +
          (selected.stock && selected.stock.length
            ? `<span class="chip teal">${selected.stock[0].total} ONLY PER PERSON</span>`
            : "");
        $("qty-row").hidden = false;
        $("qty-input").value = quantity;
        $("qty-minus").disabled = quantity <= 1;
        $("qty-plus").disabled = quantity >= 999;
        updatePlainPriceUI();
        say(stockOk() && wallet && wallet.pixels >= Number(selected.price) * quantity ? "OOH, GOOD EYE." : "BIT PRICEY FOR YOU… FOR NOW.", 5000);
      }

      // Price/afford/buy-button state for a plain (non-configurator) priced
      // item — pulled out of renderDetail() so the stock-poll refresh and the
      // qty stepper can update it without resetting the picked option/note.
      function updatePlainPriceUI() {
        if (Number(selected.price) <= 0) {
          $("detail-price").innerHTML = "NOT AVAILABLE";
          $("detail-price").classList.add("cant");
          $("buy-btn").textContent = "NOT AVAILABLE YET";
          $("buy-btn").disabled = true;
          $("afford-fill").style.width = "0%";
          $("afford-label").textContent = "Coming soon to this region.";
          return;
        }
        const total = Number(selected.price) * quantity;
        const afford = wallet && wallet.pixels >= total;
        const inStock = stockOk();
        $("detail-price").innerHTML =
          `<img src="/img/pixel.png" style="width:20px;height:20px" alt="">${total.toLocaleString()} PIXELS<span class="price-hours">${hoursOf(total)}</span>` +
          (quantity > 1 ? ` <span class="price-hours">(${Number(selected.price).toLocaleString()} × ${quantity})</span>` : "");
        $("detail-price").classList.toggle("cant", !afford);
        $("buy-btn").textContent = !inStock ? "SOLD OUT" : "BUY";
        $("buy-btn").disabled = !afford || !inStock;
        const have = wallet ? wallet.pixels : 0;
        const pct = Math.max(0, Math.min(100, (have / Math.max(1, total)) * 100));
        $("afford-fill").style.width = pct + "%";
        $("afford-fill").style.background =
          pct >= 100
            ? "var(--good)"
            : "repeating-linear-gradient(90deg,var(--gold) 0 7px,var(--gold-soft) 7px 14px)";
        $("afford-label").textContent =
          `YOU HAVE ${Math.round(have)} / ${total.toLocaleString()} PX` +
          (pct >= 100 ? ", EASY." : "");
      }

      function updateSaveBtn() {
        $("save-btn").textContent = saved ? "★ SAVED" : "☆ SAVE";
        $("save-btn").classList.toggle("teal", saved);
        $("save-btn").classList.toggle("dark", !saved);
      }

      // Re-posts the current option/config picks under the existing save —
      // fired on every configurator change once an item is saved, so a
      // player's build stays in sync as they keep deciding, without them
      // having to hit SAVE again after every tweak.
      async function saveCurrent() {
        await Pixl.send("POST", `/api/shop/save/${selected.id}`, {
          option: optionSummary(),
          config: selected.config_options ? configPick : null,
        });
      }

      async function toggleSave() {
        const nowSaved = !saved;
        saved = nowSaved;
        updateSaveBtn();
        const r = nowSaved
          ? await Pixl.send("POST", `/api/shop/save/${selected.id}`, {
              option: optionSummary(),
              config: selected.config_options ? configPick : null,
            })
          : await Pixl.send("DELETE", `/api/shop/save/${selected.id}`);
        if (!r.ok) {
          saved = !nowSaved;
          updateSaveBtn();
          Pixl.toast("Couldn't update that save, try again.", true);
        } else {
          Pixl.toast(saved ? "Saved! We'll keep your build in sync as you tweak it." : "Removed from saved items.");
        }
      }
      $("save-btn").addEventListener("click", toggleSave);

      async function claimTrophy(id) {
        const r = await Pixl.send("POST", `/api/shop/claim/${id}`);
        if (r.ok && r.claimed) {
          claimedIds.add(id);
          Pixl.toast("🏆 TROPHY CLAIMED! The team will reach out.");
          say("A LEGEND CLAIMS THEIR PRIZE!", 5000);
          renderDetail();
        } else if (r.error === "not_eligible") {
          Pixl.toast(`Not yet, you're at ${Math.floor(r.xp)} / ${r.need} XP.`, true);
        } else {
          Pixl.toast("Couldn't claim that right now.", true);
        }
      }

      // Redirects through Hack Club Auth to re-fetch this player's address
      // live (not just whatever Pixl already has cached) — only ever fired
      // by an explicit button click, never automatically.
      function startAddressVerification(id) {
        const back = new URL(location.href);
        back.searchParams.set("id", id);
        back.searchParams.delete("addr_verified");
        back.searchParams.set("addr_verified_return", "1");
        location.href = Pixl.apiUrl(
          "/auth/hackclub/verify-address?web_redirect=" + encodeURIComponent(back.toString()),
        );
      }

      // Every order ships physically, so confirm the on-file address before
      // spending pixels — same pattern as a checkout confirm step.
      async function confirmAddressThenBuy(id) {
        let elig = null;
        try { elig = await Pixl.api("/api/profile/eligibility"); } catch {}
        if (!elig || !elig.ok || !elig.hasAddress) {
          const go = await Pixl.confirm({
            title: "No shipping address on file",
            body: "We need an address before you can order this. Verify it with your Hack Club identity.",
            confirmText: "Verify address",
            cancelText: "Cancel",
          });
          if (go) startAddressVerification(id);
          return;
        }
        const summary = [
          elig.addressLine1,
          elig.addressLine2,
          [elig.addressCity, elig.addressState].filter(Boolean).join(", "),
          [elig.addressCountry, elig.addressPostal].filter(Boolean).join(" "),
        ].filter(Boolean).join(" · ");
        const ok = await Pixl.confirm({
          title: "Confirm shipping address",
          body: "We'll ship to: " + summary,
          confirmText: "Yes, ship here",
          cancelText: "Cancel",
          middleText: "Verify address",
          onMiddle: () => startAddressVerification(id),
        });
        if (!ok) return;
        buyItem(id);
      }

      // The raw picked label for the stock-tracked group (e.g. "Ridit"), or
      // "" for items with no stock-limited choice.
      function currentStockChoice() {
        const groups = optionGroups(selected);
        const stock = stockMap(selected);
        const sGroupIdx = stockGroupIndex(groups, stock);
        return sGroupIdx === -1 ? "" : optionPick[sGroupIdx] ?? "";
      }

      async function refreshStock() {
        if (!selected || isTrophy(selected) || selected.config_options) return;
        try {
          const r = await Pixl.api(`/api/shop/stock/${selected.id}`);
          if (r.ok && Array.isArray(r.stock) && r.stock.length) {
            selected.stock = r.stock;
            renderOptions();
            updatePlainPriceUI();
          }
        } catch (e) {}
      }

      async function buyItem(id) {
        if (buying) return;
        buying = true;
        $("buy-btn").disabled = true;
        $("buy-btn").textContent = "BUYING...";
        const option = optionSummary();
        const note = $("note-row").hidden ? "" : $("note-input").value.trim().slice(0, 300);
        const body = { option, note };
        if (selected && selected.config_options) body.config = configPick;
        else {
          body.quantity = quantity;
          const stockChoice = currentStockChoice();
          if (stockChoice) body.stockChoice = stockChoice;
        }
        const r = await Pixl.send("POST", `/api/shop/buy/${id}`, body);
        buying = false;
        if (r.ok) {
          if (wallet && typeof r.balance === "number") wallet.pixels = r.balance;
          const el = document.getElementById("pixl-wallet");
          if (el && typeof r.balance === "number")
            el.querySelector(".px").textContent = Math.round(r.balance).toLocaleString();
          Pixl.toast("ORDER PLACED! The team will reach out.");
          say("GREAT PICK! WE'LL BE IN TOUCH\nABOUT GETTING IT TO YOU.", 0);
          $("buy-btn").outerHTML = `<a class="btn teal" href="/orders/">VIEW MY ORDERS</a>`;
        } else if (r.error === "insufficient") {
          Pixl.toast("Not enough pixels for that.", true);
          $("buy-btn").disabled = false;
          $("buy-btn").textContent = "BUY";
        } else if (r.error === "not_for_sale") {
          Pixl.toast("That one isn't for sale.", true);
          $("buy-btn").disabled = false;
          $("buy-btn").textContent = "BUY";
        } else if (r.error === "sold_out") {
          Pixl.toast("That option just sold out, pick another.", true);
          await refreshStock();
          $("buy-btn").disabled = false;
          $("buy-btn").textContent = "BUY";
        } else {
          Pixl.toast("Couldn't place that order right now.", true);
          $("buy-btn").disabled = false;
          $("buy-btn").textContent = "BUY";
        }
      }

      $("buy-btn").addEventListener("click", () => {
        if (!selected) return;
        if (isTrophy(selected)) {
          if (trophyState(selected) === "claimable") claimTrophy(selected.id);
          return;
        }
        if (!selected.config_options && !stockOk()) {
          Pixl.toast("That option just sold out, pick another.", true);
          refreshStock();
          return;
        }
        const price = selected.config_options
          ? computeConfigPrice(selected, configPick)
          : Number(selected.price) * quantity;
        if (!wallet || wallet.pixels < price) {
          Pixl.toast("BIT PRICEY FOR YOU, FOR NOW.", true);
          say("SHIP A FEW MORE PROJECTS\nAND COME BACK!", 4000);
          nudgeKeeper();
          return;
        }
        confirmAddressThenBuy(selected.id);
      });

      $("qty-minus").addEventListener("click", () => setQty(quantity - 1));
      $("qty-plus").addEventListener("click", () => setQty(quantity + 1));
      $("qty-input").addEventListener("change", (e) => setQty(e.target.value));

      // limited-item countdown refresh
      setInterval(() => {
        if (selected && selected.limited && selected.limited_until && !isTrophy(selected))
          $("detail-limited").innerHTML =
            `<span class="chip red">LIMITED, ${Pixl.countdown(selected.limited_until)}</span>` +
            (selected.stock && selected.stock.length
              ? `<span class="chip teal">${selected.stock[0].total} ONLY PER PERSON</span>`
              : "");
      }, 1000);

      // Live stock refresh — so "12/15 left" updates while someone's looking
      // at the page, not just after their own purchase.
      setInterval(refreshStock, 8000);

      async function boot() {
        if (!Pixl.hasToken) {
          $("loading").remove();
          $("notfound").hidden = false;
          return;
        }
        wallet = await Pixl.loadWallet();
        try {
          const data = await Pixl.api("/api/shop/items");
          const items = (data.items || []).map((i) => ({
            ...i,
            id: Number(i.id),
            price: Number(i.price),
            unlock_xp: Number(i.unlock_xp || 0),
          }));
          xp = Number(data.xp || 0);
          claimedIds = new Set((data.claimed || []).map(Number));
          selected = items.find((i) => i.id === itemId) || null;
          saved = !!(selected && selected.saved);
        } catch (e) {
          if (e.message !== "unauthorized")
            Pixl.toast("Couldn't reach the shop server.", true);
        }
        $("loading").remove();
        if (!selected) {
          $("notfound").hidden = false;
          return;
        }
        $("detail").hidden = false;
        renderDetail();

        // Bounced back here after clicking "Verify address" mid-checkout —
        // report the result and pick the purchase flow back up.
        const params = new URLSearchParams(location.search);
        if (params.has("addr_verified_return")) {
          const verified = params.get("addr_verified") === "1";
          history.replaceState(null, "", location.pathname + "?id=" + itemId);
          if (verified) {
            Pixl.toast("Address verified.");
            confirmAddressThenBuy(itemId);
          } else {
            Pixl.toast("Couldn't get an address from Hack Club Auth.", true);
          }
        }
      }
      boot();
    </script>
  </body>
</html>
