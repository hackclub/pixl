<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixl · Show &amp; Tell</title>
    <!-- <pixl-preview> -->
    <meta name="description" content="Vote for your favorite projects at the live Pixl Show & Tell.">
    <link rel="canonical" href="https://pixl.hackclub.com/show-n-tell/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Pixl">
    <meta property="og:title" content="Pixl · Show & Tell">
    <meta property="og:description" content="Vote for your favorite projects at the live Pixl Show & Tell.">
    <meta property="og:url" content="https://pixl.hackclub.com/show-n-tell/">
    <meta property="og:image" content="https://pixl.hackclub.com/show-n-tell/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Pixl · Show & Tell">
    <meta name="twitter:description" content="Vote for your favorite projects at the live Pixl Show & Tell.">
    <meta name="twitter:image" content="https://pixl.hackclub.com/show-n-tell/og.png">
    <!-- <pixl-preview:end> -->
    <link rel="icon" href="/index.icon.png" />
    <link rel="stylesheet" href="/pixl.css?v=4" />
    <style>
      .stt-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin-top: 22px;
      }
      .stt-card {
        padding: 16px 18px;
        display: flex;
        gap: 14px;
        align-items: center;
      }
      .stt-thumb {
        width: 64px;
        height: 64px;
        flex-shrink: 0;
        overflow: hidden;
        border: var(--bw) solid var(--stroke);
        background: var(--panel-deep);
      }
      .stt-thumb img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
      .stt-body { min-width: 0; flex: 1; }
      .stt-name { font-family: var(--pixel); font-size: 16px; letter-spacing: 0.3px; color: var(--ink); }
      .stt-owner { font-size: 12.5px; color: var(--faint); margin-top: 2px; }
      .stt-desc { font-size: 13px; color: var(--dim); margin-top: 6px; line-height: 1.5;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .stt-vote { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
      .stt-vote-btn {
        width: 52px; height: 52px; border: var(--bw) solid var(--stroke); background: var(--panel-deep);
        color: var(--ink); font-family: var(--pixel); font-size: 20px; cursor: pointer; border-radius: 0;
      }
      .stt-vote-btn:hover { border-color: var(--accent); }
      .stt-vote-btn.voted { background: var(--accent); color: var(--panel-deep); border-color: var(--accent); }
      .stt-vote-count { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
      .stt-rank { width: 26px; text-align: center; font-family: var(--pixel); font-size: 14px; color: var(--faint); flex-shrink: 0; }
      .stt-rank.top1 { color: var(--gold); }
      .stt-rank.top2 { color: var(--teal); }
      .stt-rank.top3 { color: var(--gold-soft); }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1 class="page-title">SHOW &amp; TELL</h1>
      <div class="page-sub" id="round-sub">
        Vote for your favorite projects, one vote per project per account, no stuffing the
        ballot.
      </div>

      <div class="spin" id="loading"></div>
      <div class="stt-list" id="list"></div>
      <div class="empty-note" id="empty" hidden>
        NO SHOW &amp; TELL RUNNING RIGHT NOW.<br />CHECK BACK WHEN THE NEXT ONE STARTS.
      </div>
    </main>

    <script src="/pixl.js?v=6"></script>
    <script>
      Pixl.mountTopbar("show-n-tell");
      Pixl.loadWallet();
      const $ = (id) => document.getElementById(id);

      function rankClass(i) {
        return i === 0 ? "top1" : i === 1 ? "top2" : i === 2 ? "top3" : "";
      }

      function entryCard(e, i) {
        const thumb = e.imageUrl
          ? `<img src="${Pixl.esc(e.imageUrl)}" alt="">`
          : `<span class="faint" style="font-size:20px">?</span>`;
        return `
      <div class="panel stt-card" data-entry="${e.id}">
        <span class="stt-rank ${rankClass(i)}">#${i + 1}</span>
        <div class="stt-thumb">${thumb}</div>
        <div class="stt-body">
          <div class="stt-name">${Pixl.esc(e.name || "Untitled")}</div>
          <div class="stt-owner">by ${Pixl.esc(e.ownerName || "someone")}</div>
          ${e.description ? `<div class="stt-desc">${Pixl.esc(e.description)}</div>` : ""}
        </div>
        <div class="stt-vote">
          <button class="stt-vote-btn ${e.votedByMe ? "voted" : ""}" data-vote="${e.id}">${e.votedByMe ? "♥" : "♡"}</button>
          <span class="stt-vote-count">${e.voteCount} vote${e.voteCount === 1 ? "" : "s"}</span>
        </div>
      </div>`;
      }

      let entries = [];

      function render() {
        entries = entries.slice().sort((a, b) => b.voteCount - a.voteCount);
        $("list").innerHTML = entries.map(entryCard).join("");
        $("list").querySelectorAll("[data-vote]").forEach((btn) => {
          btn.addEventListener("click", () => vote(Number(btn.dataset.vote), btn));
        });
      }

      async function vote(id, btn) {
        if (!Pixl.hasToken) {
          Pixl.toast("Log in to vote.", true);
          return;
        }
        btn.disabled = true;
        try {
          const r = await Pixl.send("POST", `/api/show-n-tell/entries/${id}/vote`);
          if (!r.ok) {
            Pixl.toast(r.error === "round_closed" ? "This round just closed." : "Couldn't vote, try again.", true);
            btn.disabled = false;
            return;
          }
          const entry = entries.find((e) => e.id === id);
          if (entry) {
            entry.votedByMe = r.voted;
            entry.voteCount += r.voted ? 1 : -1;
          }
          render();
        } catch (e) {
          Pixl.toast("Couldn't vote, try again.", true);
        } finally {
          btn.disabled = false;
        }
      }

      async function boot() {
        let data = null;
        try {
          data = await Pixl.api("/api/show-n-tell");
        } catch (e) {
          if (e.message !== "unauthorized") Pixl.toast("Couldn't load Show & Tell right now.", true);
        }
        $("loading").remove();
        if (!data || !data.ok || !data.round) {
          $("empty").hidden = false;
          return;
        }
        $("round-sub").textContent = data.round.title;
        entries = data.entries || [];
        if (entries.length === 0) {
          $("empty").hidden = false;
          $("empty").innerHTML = "NOTHING ENTERED FOR THIS ROUND YET.<br />CHECK BACK SOON.";
          return;
        }
        render();
      }
      boot();
    </script>
  </body>
</html>
