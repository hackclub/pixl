<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixl · Quest Log</title>
    <!-- <pixl-preview> -->
    <meta name="description" content="Trials and sidequests on the way to your next reward.">
    <link rel="canonical" href="https://pixl.hackclub.com/quests/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Pixl">
    <meta property="og:title" content="Pixl · Quest Log">
    <meta property="og:description" content="Trials and sidequests on the way to your next reward.">
    <meta property="og:url" content="https://pixl.hackclub.com/quests/">
    <meta property="og:image" content="https://pixl.hackclub.com/quests/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Pixl · Quest Log">
    <meta name="twitter:description" content="Trials and sidequests on the way to your next reward.">
    <meta name="twitter:image" content="https://pixl.hackclub.com/quests/og.png">
    <!-- <pixl-preview:end> -->
<link rel="icon" href="/index.icon.png">
<link rel="stylesheet" href="/pixl.css?v=4">
<style>
  .hero {
    padding: 26px 28px;
    margin-top: 8px;
    display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap;
    /* flat filled block, no wood gradient and no inset bevel: the only depth
       cue in this look is the hard offset shadow */
    background: var(--gold);
    color: var(--ink);
    border: var(--bw-heavy) solid var(--stroke); border-radius: 0;
    box-shadow: var(--drop-lg);
  }
  .hero .page-title, .hero .page-sub { color: var(--ink); }
  .progress-box { margin-left: auto; text-align: right; }
  .progress-label { font-size: 13px; color: var(--ink); margin-bottom: 7px; letter-spacing: 1px; }
  .progress-bar { width: 240px; max-width: 60vw; height: 18px; border: var(--bw) solid var(--stroke); border-radius: 0; background: var(--panel-deep); overflow: hidden; }
  .progress-bar > div { height: 100%; background: var(--gold); transition: width .5s ease; }
  .quest-list { display: flex; flex-direction: column; gap: 16px; max-width: 860px; margin-top: 26px; }
  .quest {
    display: flex; gap: 18px;
    padding: 18px 20px;
    position: relative;
  }
  .quest.locked { opacity: .55; }
  /* Unlocked reads as the heavier block (full-weight rule + big shadow) rather
     than a colored inset ring, which is how landing separates states. */
  .quest.unlocked { border-width: var(--bw-heavy); box-shadow: var(--drop-lg); }
  .quest-icon {
    width: 58px; height: 58px; flex-shrink: 0;
    border: var(--bw) solid var(--stroke); border-radius: 0;
    background: var(--panel-deep);
    display: flex; align-items: center; justify-content: center;
    /* These "icons" are short words (MAP, SWORD, CRYSTAL), not glyphs. At 26px
       the longer ones ran straight out of the 58px box, so they're sized to
       fit and clipped as a backstop. */
    font-family: var(--pixel); font-size: 11px; letter-spacing: .5px;
    text-align: center; overflow: hidden; padding: 2px;
  }
  .quest.unlocked .quest-icon { background: var(--gold); color: var(--btn-ink); }
  .quest-main { flex: 1; min-width: 0; }
  .quest-name { font-size: 19px; color: var(--ink); margin-bottom: 5px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .quest-desc { font-size: 15px; color: var(--dim); line-height: 1.6; margin-bottom: 9px; white-space: pre-wrap; }
  .quest-meta { display: flex; gap: 8px; flex-wrap: wrap; }
  /* filled, not tinted text: the reward is the thing worth spotting on this page */
  .reward-tag { background: var(--good); color: var(--ink); }
  .stamp {
    position: absolute; top: 14px; right: 16px;
    font-size: 12px; letter-spacing: 2px;
    border: 2px solid; border-radius: 0;
    padding: 4px 9px 3px;
    transform: rotate(4deg);
  }
  .stamp.on { color: var(--panel-deep); background: var(--good); border-color: var(--stroke); }
  .stamp.off { color: var(--dim); border-color: var(--stroke); transform: rotate(-3deg); }
  .hint-box { margin-top: 30px; padding: 16px 20px; font-size: 14px; color: var(--dim); line-height: 1.7; max-width: 860px; }
  .quest { cursor: pointer; }

  /* ---- trial card modal: same raffle-ticket frame + coordinate system as
     the Explore player card, just relabeled for a Trial instead of a player. ---- */
  .tc-overlay {
    position: fixed; inset: 0; background: rgba(22,22,30,.72);
    display: flex; align-items: center; justify-content: center; z-index: 50;
    padding: 24px; box-sizing: border-box; overflow-y: auto;
  }
  .tc-overlay[hidden] { display: none; }
  .tc-close {
    position: absolute; top: -18px; right: -18px; width: 40px; height: 40px;
    border: var(--bw) solid var(--stroke); border-radius: 0; background: var(--panel);
    font-family: var(--pixel); font-size: 16px; color: var(--ink); cursor: pointer;
    box-shadow: var(--drop);
  }
  .ticket-frame {
    position: relative; width: 460px; height: 599px; flex-shrink: 0; margin: 20px auto;
    background: url(../img/ticket_frame.png) no-repeat; background-size: 460px 599px;
  }
  .ticket-head { position: absolute; left: 28px; top: 57.6px; width: 278px; height: 77.4px;
    display: flex; align-items: center; overflow: hidden; }
  .ticket-head .tname { font-family: var(--pixel); font-size: 23px; color: #fff; letter-spacing: .5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 1.5px 0 var(--stroke), -1.5px 0 var(--stroke), 0 1.5px var(--stroke), 0 -1.5px var(--stroke); }
  .ticket-avatar { position: absolute; left: 49.5px; top: 177px; width: 148.5px; height: 150px;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    font-family: var(--pixel); font-size: 56px; color: var(--ink); }
  .ticket-avatar.locked { filter: grayscale(1) brightness(.55); }
  .tstat-v { position: absolute; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; gap: 3px; overflow: hidden; padding: 0 4px; }
  .tstat-v .tlabel { font-size: 9px; color: var(--dim); letter-spacing: .5px; }
  .tstat-v .tval { font-family: var(--pixel); font-size: 16px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .ts-level  { left: 232.3px; top: 177.2px; width: 83.9px; height: 69.2px; }
  .ts-hours  { left: 334.6px; top: 178px;   width: 84.6px; height: 68.4px; }
  .ts-proj   { left: 232.3px; top: 263.3px; width: 83.9px; height: 69.2px; }
  .ts-joined { left: 334.6px; top: 263.3px; width: 84.6px; height: 69.2px; }
  /* The baked art has "EXPERIENCE" + an empty XP-track box here (it's the
     player card's XP bar) — nothing about a Trial belongs on top of that
     label, so patch it over with paper before laying the brief text down. */
  .ticket-mask { position: absolute; left: 34px; top: 348px; width: 392px; height: 88px;
    background: var(--panel); border: 2px solid var(--panel-2); box-sizing: border-box; }
  .ticket-brief { position: absolute; left: 39.3px; top: 356px; width: 381.5px; height: 148px;
    font-size: 12.5px; line-height: 1.55; color: var(--ink); overflow: hidden; }
  .ticket-brief.locked-text { color: var(--muted); font-style: italic; }
  .ticket-foot { position: absolute; left: 39.3px; top: 508.3px; width: 384px; height: 46.8px;
    display: flex; flex-direction: column; justify-content: center; gap: 4px; padding-left: 14px; box-sizing: border-box; overflow: hidden; }
  .ticket-foot .tf-class { font-family: var(--pixel); font-size: 17px; color: var(--ink); line-height: 1.15;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ticket-foot .tf-sub { font-size: 11px; color: var(--faint); letter-spacing: .3px; line-height: 1; }
</style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <div>
      <h1 class="page-title">QUEST LOG</h1>
      <div class="page-sub">TRIALS FROM THE VILLAGERS, SPECIAL REWARDS ON TOP.</div>
    </div>
    <div class="progress-box">
      <div class="progress-label" id="progress-label">- / - UNLOCKED</div>
      <div class="progress-bar"><div id="progress-fill" style="width:0%"></div></div>
    </div>
  </section>

  <div class="spin" id="loading"></div>
  <div class="quest-list" id="quests"></div>
  <div class="empty-note" id="empty" hidden>NO TRIALS POSTED RIGHT NOW.<br>THE VILLAGERS ARE THINKING…</div>

  <div class="hint-box panel-deep" id="hint" hidden>
    Locked quests are unlocked by talking to the right NPC in the game: wander the village, chat with everyone, and their quests open up here.
  </div>
</main>

<div class="tc-overlay" id="tc-overlay" hidden onclick="if (event.target === this) closeCard()">
  <div style="position:relative">
    <button class="tc-close" onclick="closeCard()" aria-label="Close">X</button>
    <div class="ticket-frame" id="tc-frame"></div>
  </div>
</div>

<script src="/pixl.js?v=6"></script>
<script>
Pixl.mountTopbar("quests");
Pixl.loadWallet();

const ICONS = ["MAP", "SWORD", "CRYSTAL", "WHEAT", "ARROW", "AXE", "POTION", "SCROLL", "CHICKEN", "FISH"];

async function boot() {
  if (!Pixl.hasToken) return;
  let quests = [];
  try {
    const data = await Pixl.api("/api/sidequests");
    quests = data.quests || [];
  } catch (e) {
    if (e.message !== "unauthorized") Pixl.toast("Couldn't load quests.", true);
  }
  document.getElementById("loading").remove();

  const unlocked = quests.filter((q) => q.unlocked).length;
  document.getElementById("progress-label").textContent = `${unlocked} / ${quests.length} UNLOCKED`;
  document.getElementById("progress-fill").style.width =
    quests.length ? (unlocked / quests.length) * 100 + "%" : "0%";

  if (quests.length === 0) {
    document.getElementById("empty").hidden = false;
    return;
  }
  document.getElementById("hint").hidden = quests.every((q) => q.unlocked);

  const sorted = [...quests].sort((a, b) => Number(b.unlocked) - Number(a.unlocked));
  QUESTS_BY_ID = new Map(sorted.map((q) => [q.id, q]));
  document.getElementById("quests").innerHTML = sorted.map((q, i) => `
    <div class="quest panel ${q.unlocked ? "unlocked" : "locked"}" style="animation: toast-in .2s ease both; animation-delay:${Math.min(i * 40, 500)}ms" onclick="openCard(${q.id})">
      <div class="quest-icon">${q.unlocked ? ICONS[q.id % ICONS.length] : ""}</div>
      <div class="quest-main">
        <div class="quest-name">${Pixl.esc(q.name)}</div>
        <div class="quest-desc">${q.description ? Pixl.bbcode(q.description) : Pixl.esc(q.unlocked ? "" : "Find the right villager to learn more…")}</div>
        <div class="quest-meta">
          ${q.region ? `<span class="chip">${Pixl.esc(q.region)}</span>` : ""}
          ${q.npc ? `<span class="chip teal">${Pixl.esc(q.npc)}</span>` : ""}
          ${q.reward ? `<span class="chip reward-tag">${Pixl.esc(q.reward)}</span>` : ""}
        </div>
      </div>
      <div class="stamp ${q.unlocked ? "on" : "off"}">${q.unlocked ? "UNLOCKED" : "LOCKED"}</div>
    </div>`).join("");
}
boot();

/* ---- trial card: the same ticket_frame.png raffle-ticket used for the
   Explore player card, repurposed to show one Trial's brief + reward. ---- */
let QUESTS_BY_ID = new Map();

function openCard(id) {
  const q = QUESTS_BY_ID.get(id);
  if (!q) return;
  const letter = Pixl.esc((q.npc_name || q.npc || "?").trim().charAt(0).toUpperCase() || "?");
  const status = q.completed ? "DONE" : q.unlocked ? "UNLOCKED" : "LOCKED";
  const brief = q.unlocked
    ? Pixl.bbcode(q.brief || q.description || "No brief written for this trial yet.")
    : Pixl.esc("Find the right villager in the world to unlock this trial's story.");
  document.getElementById("tc-frame").innerHTML = `
    <div class="ticket-head"><div class="tname">${Pixl.esc(q.name)}</div></div>
    <div class="ticket-avatar${q.unlocked ? "" : " locked"}">${letter}</div>
    <div class="tstat-v ts-level"><span class="tlabel">REGION</span><span class="tval">${Pixl.esc(q.region || "-")}</span></div>
    <div class="tstat-v ts-hours"><span class="tlabel">MIN HRS</span><span class="tval">${q.min_hours ? q.min_hours + "h" : "-"}</span></div>
    <div class="tstat-v ts-proj"><span class="tlabel">GIVEN BY</span><span class="tval">${Pixl.esc(q.npc_name || q.npc || "-")}</span></div>
    <div class="tstat-v ts-joined"><span class="tlabel">STATUS</span><span class="tval">${status}</span></div>
    <div class="ticket-mask"></div>
    <div class="ticket-brief${q.unlocked ? "" : " locked-text"}">${brief}</div>
    <div class="ticket-foot">
      <div class="tf-class">${q.reward ? Pixl.esc(q.reward) : "No reward listed"}</div>
      <div class="tf-sub">REWARD ON COMPLETION</div>
    </div>`;
  document.getElementById("tc-overlay").hidden = false;
}

function closeCard() {
  document.getElementById("tc-overlay").hidden = true;
}
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeCard();
});
</script>
</body>
</html>
