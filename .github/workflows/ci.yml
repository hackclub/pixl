name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    # The *.db.test.ts suites need a real Postgres; this throwaway service
    # only exists for the duration of the job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PIXL_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
      JWT_SECRET: ci-only-not-a-real-secret
    steps:
      # Pinned to SHAs (see zizmor unpinned-uses).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install (workspace)
        run: bun install --frozen-lockfile

      # apps/server, apps/internal-dashboard and apps/pixorpheus build from
      # their own folder in Docker with --frozen-lockfile, so their standalone
      # lockfiles must stay in sync with package.json too.
      - name: Verify standalone lockfiles
        run: |
          for app in server internal-dashboard pixorpheus; do
            tmp="$(mktemp -d)"
            cp "apps/$app/package.json" "apps/$app/bun.lock" "$tmp/"
            (cd "$tmp" && bun install --frozen-lockfile --ignore-scripts > /dev/null)
          done

      - name: Typecheck
        run: |
          bunx tsc --noEmit -p apps/server
          bun run --cwd apps/internal-dashboard typecheck
          bun run --cwd apps/pixl-dashboard typecheck
          bun run --cwd apps/pixorpheus typecheck

      - name: Test
        run: |
          bun run --cwd apps/server test
          bun run --cwd apps/internal-dashboard test
          bun run --cwd apps/pixl-dashboard test
          bun run --cwd apps/pixorpheus test

      # The budget page is a server-rendered route; typechecks alone won't
      # catch Next.js production build or route compilation errors.
      - name: Build internal dashboard
        run: bun run --cwd apps/internal-dashboard build

  vulnerabilities:
    name: Dependency vulnerabilities
    permissions:
      contents: read
      security-events: write
      actions: read
    # Fails the run on any known-vulnerable dependency in any lockfile.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --recursive
        ./
